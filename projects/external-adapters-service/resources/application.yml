system:
  kafka:
    schemas: !system/component
      system/component-kind: avro/serde
      schemas:
        command: schemas/command/command-envelope.avsc.json
        command-response: schemas/command/command-response.avsc.json
        event: schemas/event/event-envelope.avsc.json
    producers: !system/component
      system/component-kind: kafka/producers
      schemes-command-response:
        schemas: !system/local-ref schemas
        schema: !keyword command-response
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-schemes-command-response
          acks: all
          linger.ms: 0
      schemes-payments-event:
        schemas: !system/local-ref schemas
        schema: !keyword event
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-schemes-payments-event
          acks: all
          linger.ms: 0
      idv-command-response:
        schemas: !system/local-ref schemas
        schema: !keyword command-response
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-idv-command-response
          acks: all
          linger.ms: 0
      idv-event:
        schemas: !system/local-ref schemas
        schema: !keyword event
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-idv-event
          acks: all
          linger.ms: 0
      companies-command-response:
        schemas: !system/local-ref schemas
        schema: !keyword command-response
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-companies-command-response
          acks: all
          linger.ms: 0
      modulr-command-dlq:
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-modulr-command-dlq
          acks: all
          linger.ms: 0
      form3-command-dlq:
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-form3-command-dlq
          acks: all
          linger.ms: 0
      clearbank-command-dlq:
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-clearbank-command-dlq
          acks: all
          linger.ms: 0
      cash-accounts-event-dlq:
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-cash-accounts-event-dlq
          acks: all
          linger.ms: 0
      payments-event-dlq:
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-payments-event-dlq
          acks: all
          linger.ms: 0
      rewards-event-dlq:
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-rewards-event-dlq
          acks: all
          linger.ms: 0
      idvs-event-dlq:
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-idvs-event-dlq
          acks: all
          linger.ms: 0
      parties-event-dlq:
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-parties-event-dlq
          acks: all
          linger.ms: 0
      invitations-event-dlq:
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-invitations-event-dlq
          acks: all
          linger.ms: 0
      memberships-command:
        schemas: !system/local-ref schemas
        schema: !keyword command
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-memberships-command
          acks: all
          linger.ms: 0
      payments-command:
        schemas: !system/local-ref schemas
        schema: !keyword command
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-payments-command
          acks: all
          linger.ms: 0
    # The group.ids name the per-adapter services this one absorbed.
    # They are carried over verbatim: a consumer group identifies the
    # consumer role, not the pod hosting it, and renaming one
    # re-consumes or skips (ADR-0036 cursor continuity). A provider's
    # command channel is a topic of its own, whose group is named for
    # this service.
    consumers: !system/component
      system/component-kind: kafka/consumers
      modulr-command:
        schemas: !system/local-ref schemas
        schema: !keyword command
        topics: [topic-modulr-command]
        dead-letter-producer: !system/local-ref producers.modulr-command-dlq
        max-redeliveries: 5
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: external-adapters-service-modulr-command
      form3-command:
        schemas: !system/local-ref schemas
        schema: !keyword command
        topics: [topic-form3-command]
        dead-letter-producer: !system/local-ref producers.form3-command-dlq
        max-redeliveries: 5
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: external-adapters-service-form3-command
      clearbank-command:
        schemas: !system/local-ref schemas
        schema: !keyword command
        topics: [topic-clearbank-command]
        dead-letter-producer: !system/local-ref producers.clearbank-command-dlq
        max-redeliveries: 5
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: external-adapters-service-clearbank-command
      zyphe-idv-command:
        schemas: !system/local-ref schemas
        schema: !keyword command
        topics: [topic-zyphe-idv-command]
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: external-adapters-service-zyphe-idv-command
      onfido-idv-command:
        schemas: !system/local-ref schemas
        schema: !keyword command
        topics: [topic-onfido-idv-command]
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: external-adapters-service-onfido-idv-command
      companies-command:
        schemas: !system/local-ref schemas
        schema: !keyword command
        topics: [topic-companies-command]
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: uk-companies-house-adapter-service-companies-command
      cash-accounts-event:
        schemas: !system/local-ref schemas
        schema: !keyword event
        topics: [topic-cash-accounts-event]
        dead-letter-producer: !system/local-ref producers.cash-accounts-event-dlq
        max-redeliveries: 5
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: webhook-service-cash-accounts-event
      payments-event:
        schemas: !system/local-ref schemas
        schema: !keyword event
        topics: [topic-payments-event]
        dead-letter-producer: !system/local-ref producers.payments-event-dlq
        max-redeliveries: 5
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: webhook-service-payments-event
      rewards-event:
        schemas: !system/local-ref schemas
        schema: !keyword event
        topics: [topic-rewards-event]
        dead-letter-producer: !system/local-ref producers.rewards-event-dlq
        max-redeliveries: 5
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: webhook-service-rewards-event
      idvs-event:
        schemas: !system/local-ref schemas
        schema: !keyword event
        topics: [topic-idvs-event]
        dead-letter-producer: !system/local-ref producers.idvs-event-dlq
        max-redeliveries: 5
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: webhook-service-idvs-event
      parties-event:
        schemas: !system/local-ref schemas
        schema: !keyword event
        topics: [topic-parties-event]
        dead-letter-producer: !system/local-ref producers.parties-event-dlq
        max-redeliveries: 5
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: webhook-service-parties-event
      invitations-event:
        schemas: !system/local-ref schemas
        schema: !keyword event
        topics: [topic-invitations-event]
        dead-letter-producer: !system/local-ref producers.invitations-event-dlq
        max-redeliveries: 5
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: email-service-invitations-event
      memberships-command-response:
        schemas: !system/local-ref schemas
        schema: !keyword command-response
        topics: [topic-memberships-command-response]
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: email-service-memberships-command-response
      payments-command-response:
        schemas: !system/local-ref schemas
        schema: !keyword command-response
        topics: [topic-payments-command-response]
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: external-adapters-service-payments-command-response
    message-bus-producers: !system/component
      system/component-kind: kafka/message-bus-producers
      schemes-command-response:
        producer: !system/local-ref producers.schemes-command-response
      schemes-payments-event:
        producer: !system/local-ref producers.schemes-payments-event
      idv-command-response:
        producer: !system/local-ref producers.idv-command-response
      idv-event:
        producer: !system/local-ref producers.idv-event
      companies-command-response:
        producer: !system/local-ref producers.companies-command-response
      memberships-command:
        producer: !system/local-ref producers.memberships-command
      payments-command:
        producer: !system/local-ref producers.payments-command
    message-bus-consumers: !system/component
      system/component-kind: kafka/message-bus-consumers
      modulr-command:
        consumer: !system/local-ref consumers.modulr-command
        timeout: 500
      form3-command:
        consumer: !system/local-ref consumers.form3-command
        timeout: 500
      clearbank-command:
        consumer: !system/local-ref consumers.clearbank-command
        timeout: 500
      zyphe-idv-command:
        consumer: !system/local-ref consumers.zyphe-idv-command
        timeout: 500
      onfido-idv-command:
        consumer: !system/local-ref consumers.onfido-idv-command
        timeout: 500
      companies-command:
        consumer: !system/local-ref consumers.companies-command
        timeout: 500
      cash-accounts-event:
        consumer: !system/local-ref consumers.cash-accounts-event
        timeout: 500
      payments-event:
        consumer: !system/local-ref consumers.payments-event
        timeout: 500
      rewards-event:
        consumer: !system/local-ref consumers.rewards-event
        timeout: 500
      idvs-event:
        consumer: !system/local-ref consumers.idvs-event
        timeout: 500
      parties-event:
        consumer: !system/local-ref consumers.parties-event
        timeout: 500
      invitations-event:
        consumer: !system/local-ref consumers.invitations-event
        timeout: 500
      memberships-command-response:
        consumer: !system/local-ref consumers.memberships-command-response
        timeout: 500
      payments-command-response:
        consumer: !system/local-ref consumers.payments-command-response
        timeout: 500
  message-bus: !include system/message-bus.yml
  fdb: !include system/fdb.yml
  avro: !include system/avro.yml
  telemetry: !include system/telemetry.yml
  modulr-adapter-server: !include system/modulr-adapter-server.yml
  payment-provider: !include system/payment-provider.yml
  idv-provider: !include system/idv-provider.yml
  modulr-adapter: !include system/modulr-adapter.yml
  zyphe-adapter-server: !include system/zyphe-adapter-server.yml
  zyphe-adapter: !include system/zyphe-adapter.yml
  form3-adapter-server: !include system/form3-adapter-server.yml
  form3-adapter: !include system/form3-adapter.yml
  clearbank-adapter-server: !include system/clearbank-adapter-server.yml
  clearbank-adapter: !include system/clearbank-adapter.yml
  onfido-adapter-server: !include system/onfido-adapter-server.yml
  onfido-adapter: !include system/onfido-adapter.yml
  uk-companies-house-adapter: !include system/uk-companies-house-adapter.yml
  webhook: !include system/webhook.yml
  email: !include system/email.yml
  memberships-dispatcher: !include system/membership-dispatcher.yml
  payments-dispatcher: !include system/payment-dispatcher.yml
  smtp: !include system/smtp.yml
