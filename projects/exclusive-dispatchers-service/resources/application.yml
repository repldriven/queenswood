system:
  fdb: !include system/fdb.yml
  avro: !include system/avro.yml
  kafka:
    schemas: !system/component
      system/component-kind: avro/serde
      schemas:
        command: schemas/command/command-envelope.avsc.json
        event: schemas/event/event-envelope.avsc.json
    producers: !system/component
      system/component-kind: kafka/producers
      cash-accounts-event:
        schemas: !system/local-ref schemas
        schema: !keyword event
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-cash-accounts-event
          acks: all
      payments-event:
        schemas: !system/local-ref schemas
        schema: !keyword event
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-payments-event
          acks: all
      rewards-event:
        schemas: !system/local-ref schemas
        schema: !keyword event
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-rewards-event
          acks: all
      idv-event:
        schemas: !system/local-ref schemas
        schema: !keyword event
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-idv-event
          acks: all
      idvs-event:
        schemas: !system/local-ref schemas
        schema: !keyword event
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-idvs-event
          acks: all
      invitations-event:
        schemas: !system/local-ref schemas
        schema: !keyword event
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-invitations-event
          acks: all
      parties-event:
        schemas: !system/local-ref schemas
        schema: !keyword event
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-parties-event
          acks: all
      modulr-payment-command:
        schemas: !system/local-ref schemas
        schema: !keyword command
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-modulr-payment-command
          acks: all
      form3-payment-command:
        schemas: !system/local-ref schemas
        schema: !keyword command
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-form3-payment-command
          acks: all
      clearbank-payment-command:
        schemas: !system/local-ref schemas
        schema: !keyword command
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-clearbank-payment-command
          acks: all
      schemes-payments-event:
        schemas: !system/local-ref schemas
        schema: !keyword event
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-schemes-payments-event
          acks: all
      schemes-account-event:
        schemas: !system/local-ref schemas
        schema: !keyword event
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-schemes-account-event
          acks: all
      transactions-event:
        schemas: !system/local-ref schemas
        schema: !keyword event
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-transactions-event
          acks: all
    message-bus-producers: !system/component
      system/component-kind: kafka/message-bus-producers
      cash-accounts-event:
        producer: !system/local-ref producers.cash-accounts-event
      payments-event:
        producer: !system/local-ref producers.payments-event
      rewards-event:
        producer: !system/local-ref producers.rewards-event
      idv-event:
        producer: !system/local-ref producers.idv-event
      idvs-event:
        producer: !system/local-ref producers.idvs-event
      invitations-event:
        producer: !system/local-ref producers.invitations-event
      parties-event:
        producer: !system/local-ref producers.parties-event
      modulr-payment-command:
        producer: !system/local-ref producers.modulr-payment-command
      form3-payment-command:
        producer: !system/local-ref producers.form3-payment-command
      clearbank-payment-command:
        producer: !system/local-ref producers.clearbank-payment-command
      schemes-payments-event:
        producer: !system/local-ref producers.schemes-payments-event
      schemes-account-event:
        producer: !system/local-ref producers.schemes-account-event
      transactions-event:
        producer: !system/local-ref producers.transactions-event
    # This service only produces. `message-bus/bus` requires a consumers
    # map, so this is declared empty rather than omitted.
    message-bus-consumers: !system/component
      system/component-kind: kafka/message-bus-consumers
  message-bus: !include system/message-bus.yml
  relay:
    # Every store writes the shared envelope, so one handler kind
    # decodes them all and republishes the payload verbatim. The outbox
    # protos reuse ChangelogEvent's field numbers, so their entries
    # decode as one too. Handlers are named for the domain they carry;
    # nothing about them is vendor-specific any more.
    cash-accounts-handler: !system/component
      system/component-kind: changelog-relay/envelope-handler
      bus: !system/ref message-bus.bus
      event-channel: !keyword cash-accounts-event
      store-name: cash-accounts
    idv-handler: !system/component
      system/component-kind: changelog-relay/envelope-handler
      bus: !system/ref message-bus.bus
      event-channel: !keyword idv-event
    idvs-handler: !system/component
      system/component-kind: changelog-relay/envelope-handler
      bus: !system/ref message-bus.bus
      event-channel: !keyword idvs-event
      store-name: idvs
    idv-sessions-handler: !system/component
      system/component-kind: changelog-relay/envelope-handler
      bus: !system/ref message-bus.bus
      event-channel: !keyword idvs-event
      store-name: idv-sessions
    invitations-handler: !system/component
      system/component-kind: changelog-relay/envelope-handler
      bus: !system/ref message-bus.bus
      event-channel: !keyword invitations-event
      store-name: invitations
    parties-handler: !system/component
      system/component-kind: changelog-relay/envelope-handler
      bus: !system/ref message-bus.bus
      event-channel: !keyword parties-event
      store-name: parties
    payments-handler: !system/component
      system/component-kind: changelog-relay/envelope-handler
      bus: !system/ref message-bus.bus
      event-channel: !keyword payments-event
      store-name: payments
    rewards-handler: !system/component
      system/component-kind: changelog-relay/envelope-handler
      bus: !system/ref message-bus.bus
      event-channel: !keyword rewards-event
      store-name: rewards
    schemes-payments-handler: !system/component
      system/component-kind: changelog-relay/envelope-handler
      bus: !system/ref message-bus.bus
      event-channel: !keyword schemes-payments-event
      event-channels: !include system/payment-account-event-channels.yml
    transactions-handler: !system/component
      system/component-kind: changelog-relay/envelope-handler
      bus: !system/ref message-bus.bus
      event-channel: !keyword transactions-event
      store-name: transactions
    # Keyed by store, because a cursor belongs to a store. `store-name`
    # and `consumer-id` are physical: the ids are carried over verbatim
    # from the watchers these replaced, and a fresh one would restart
    # from no checkpoint and rescan the whole changelog in a single
    # transaction (ADR-0019 cursor continuity).
    runners: !system/component
      system/component-kind: changelog-relay/runners
      cash-accounts:
        record-db: !system/ref fdb.record-db
        keyspace-prefix: !system/ref fdb.keyspace-prefix
        consumer-id: cash-account-watcher
        store-name: cash-accounts
        handler: !system/local-ref cash-accounts-handler
      modulr-outbox:
        record-db: !system/ref fdb.record-db
        keyspace-prefix: !system/ref fdb.keyspace-prefix
        consumer-id: modulr-relay
        store-name: modulr-outbox
        handler: !system/local-ref schemes-payments-handler
      form3-outbox:
        record-db: !system/ref fdb.record-db
        keyspace-prefix: !system/ref fdb.keyspace-prefix
        consumer-id: form3-relay
        store-name: form3-outbox
        handler: !system/local-ref schemes-payments-handler
      clearbank-outbox:
        record-db: !system/ref fdb.record-db
        keyspace-prefix: !system/ref fdb.keyspace-prefix
        consumer-id: clearbank-relay
        store-name: clearbank-outbox
        handler: !system/local-ref schemes-payments-handler
      transactions:
        record-db: !system/ref fdb.record-db
        keyspace-prefix: !system/ref fdb.keyspace-prefix
        consumer-id: transactions-relay
        store-name: transactions
        handler: !system/local-ref transactions-handler
      idvs:
        record-db: !system/ref fdb.record-db
        keyspace-prefix: !system/ref fdb.keyspace-prefix
        consumer-id: parties-watcher
        store-name: idvs
        handler: !system/local-ref idvs-handler
      idv-sessions:
        record-db: !system/ref fdb.record-db
        keyspace-prefix: !system/ref fdb.keyspace-prefix
        consumer-id: idv-sessions-relay
        store-name: idv-sessions
        handler: !system/local-ref idv-sessions-handler
      invitations:
        record-db: !system/ref fdb.record-db
        keyspace-prefix: !system/ref fdb.keyspace-prefix
        consumer-id: invitations-relay
        store-name: invitations
        handler: !system/local-ref invitations-handler
      zyphe-outbox:
        record-db: !system/ref fdb.record-db
        keyspace-prefix: !system/ref fdb.keyspace-prefix
        consumer-id: zyphe-relay
        store-name: zyphe-outbox
        handler: !system/local-ref idv-handler
      onfido-outbox:
        record-db: !system/ref fdb.record-db
        keyspace-prefix: !system/ref fdb.keyspace-prefix
        consumer-id: onfido-relay
        store-name: onfido-outbox
        handler: !system/local-ref idv-handler
      parties:
        record-db: !system/ref fdb.record-db
        keyspace-prefix: !system/ref fdb.keyspace-prefix
        consumer-id: idv-party-watcher
        store-name: parties
        handler: !system/local-ref parties-handler
      outbound-payments:
        record-db: !system/ref fdb.record-db
        keyspace-prefix: !system/ref fdb.keyspace-prefix
        consumer-id: outbound-payments-relay
        store-name: outbound-payments
        handler: !system/local-ref payments-handler
      inbound-payments:
        record-db: !system/ref fdb.record-db
        keyspace-prefix: !system/ref fdb.keyspace-prefix
        consumer-id: inbound-payments-relay
        store-name: inbound-payments
        handler: !system/local-ref payments-handler
      internal-payments:
        record-db: !system/ref fdb.record-db
        keyspace-prefix: !system/ref fdb.keyspace-prefix
        consumer-id: internal-payments-relay
        store-name: internal-payments
        handler: !system/local-ref payments-handler
      rewards:
        record-db: !system/ref fdb.record-db
        keyspace-prefix: !system/ref fdb.keyspace-prefix
        consumer-id: rewards-relay
        store-name: rewards
        handler: !system/local-ref rewards-handler
  scheduler: !include system/scheduler.yml
  payment-provider: !include system/payment-provider.yml
  payment-sweep: !include system/payment-outbound-sweep.yml
  telemetry: !include system/telemetry.yml
