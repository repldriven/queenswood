system:
  kafka:
    schemas: !system/component
      system/component-kind: avro/serde
      schemas:
        command: schemas/command/command-envelope.avsc.json
        command-response: schemas/command/command-response.avsc.json
        event: schemas/event/event-envelope.avsc.json
    producers: !system/component
      system/component-kind: kafka/producers
      banks-command:
        schemas: !system/local-ref schemas
        schema: !keyword command
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-banks-command
          acks: all
          linger.ms: 0
      companies-command:
        schemas: !system/local-ref schemas
        schema: !keyword command
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-companies-command
          acks: all
          linger.ms: 0
      cash-accounts-command:
        schemas: !system/local-ref schemas
        schema: !keyword command
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-cash-accounts-command
          acks: all
          linger.ms: 0
      memberships-command:
        schemas: !system/local-ref schemas
        schema: !keyword command
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-memberships-command
          acks: all
          linger.ms: 0
      parties-command:
        schemas: !system/local-ref schemas
        schema: !keyword command
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-parties-command
          acks: all
          linger.ms: 0
      idvs-command:
        schemas: !system/local-ref schemas
        schema: !keyword command
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-idvs-command
          acks: all
          linger.ms: 0
      payments-command:
        schemas: !system/local-ref schemas
        schema: !keyword command
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-payments-command
          acks: all
          linger.ms: 0
      transactions-command:
        schemas: !system/local-ref schemas
        schema: !keyword command
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-transactions-command
          acks: all
          linger.ms: 0
      payee-checks-command:
        schemas: !system/local-ref schemas
        schema: !keyword command
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          topic: topic-payee-checks-command
          acks: all
          linger.ms: 0
    consumers: !system/component
      system/component-kind: kafka/consumers
      banks-command-response:
        schemas: !system/local-ref schemas
        schema: !keyword command-response
        topics: [topic-banks-command-response]
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          # A reply matters only to the request waiting on it, so each process
          # reads replies in a group of its own from the newest one on: a restart
          # does not wade through replies to requests that died with the last
          # process, and every replica hears its own replies.
          group.id: !join ["api-service-banks-command-response-", !random-uuid ""]
          auto.offset.reset: latest
      companies-command-response:
        schemas: !system/local-ref schemas
        schema: !keyword command-response
        topics: [topic-companies-command-response]
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: !join ["api-service-companies-command-response-", !random-uuid ""]
          auto.offset.reset: latest
      cash-accounts-command-response:
        schemas: !system/local-ref schemas
        schema: !keyword command-response
        topics: [topic-cash-accounts-command-response]
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: !join ["api-service-cash-accounts-command-response-", !random-uuid ""]
          auto.offset.reset: latest
      memberships-command-response:
        schemas: !system/local-ref schemas
        schema: !keyword command-response
        topics: [topic-memberships-command-response]
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: !join ["api-service-memberships-command-response-", !random-uuid ""]
          auto.offset.reset: latest
      parties-command-response:
        schemas: !system/local-ref schemas
        schema: !keyword command-response
        topics: [topic-parties-command-response]
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: !join ["api-service-parties-command-response-", !random-uuid ""]
          auto.offset.reset: latest
      idvs-command-response:
        schemas: !system/local-ref schemas
        schema: !keyword command-response
        topics: [topic-idvs-command-response]
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: !join ["api-service-idvs-command-response-", !random-uuid ""]
          auto.offset.reset: latest
      payments-command-response:
        schemas: !system/local-ref schemas
        schema: !keyword command-response
        topics: [topic-payments-command-response]
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: !join ["api-service-payments-command-response-", !random-uuid ""]
          auto.offset.reset: latest
      transactions-command-response:
        schemas: !system/local-ref schemas
        schema: !keyword command-response
        topics: [topic-transactions-command-response]
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: !join ["api-service-transactions-command-response-", !random-uuid ""]
          auto.offset.reset: latest
      payee-checks-command-response:
        schemas: !system/local-ref schemas
        schema: !keyword command-response
        topics: [topic-payee-checks-command-response]
        conf:
          bootstrap.servers: !env KAFKA_BOOTSTRAP_SERVERS
          group.id: !join ["api-service-payee-checks-command-response-", !random-uuid ""]
          auto.offset.reset: latest
    message-bus-producers: !system/component
      system/component-kind: kafka/message-bus-producers
      banks-command:
        producer: !system/local-ref producers.banks-command
      companies-command:
        producer: !system/local-ref producers.companies-command
      cash-accounts-command:
        producer: !system/local-ref producers.cash-accounts-command
      memberships-command:
        producer: !system/local-ref producers.memberships-command
      parties-command:
        producer: !system/local-ref producers.parties-command
      idvs-command:
        producer: !system/local-ref producers.idvs-command
      payments-command:
        producer: !system/local-ref producers.payments-command
      transactions-command:
        producer: !system/local-ref producers.transactions-command
      payee-checks-command:
        producer: !system/local-ref producers.payee-checks-command
    message-bus-consumers: !system/component
      system/component-kind: kafka/message-bus-consumers
      banks-command-response:
        consumer: !system/local-ref consumers.banks-command-response
        timeout: 500
      companies-command-response:
        consumer: !system/local-ref consumers.companies-command-response
        timeout: 500
      cash-accounts-command-response:
        consumer: !system/local-ref consumers.cash-accounts-command-response
        timeout: 500
      memberships-command-response:
        consumer: !system/local-ref consumers.memberships-command-response
        timeout: 500
      parties-command-response:
        consumer: !system/local-ref consumers.parties-command-response
        timeout: 500
      idvs-command-response:
        consumer: !system/local-ref consumers.idvs-command-response
        timeout: 500
      payments-command-response:
        consumer: !system/local-ref consumers.payments-command-response
        timeout: 500
      transactions-command-response:
        consumer: !system/local-ref consumers.transactions-command-response
        timeout: 500
      payee-checks-command-response:
        consumer: !system/local-ref consumers.payee-checks-command-response
        timeout: 500
  message-bus: !include system/message-bus.yml
  fdb: !include system/fdb.yml
  avro: !include system/avro.yml
  keycloak: !include system/keycloak.yml
  payment-provider: !include system/payment-provider.yml
  idv-provider: !include system/idv-provider.yml
  banks: !include system/bank-dispatcher.yml
  companies: !include system/company-dispatcher.yml
  cash-accounts: !include system/cash-account-dispatcher.yml
  memberships: !include system/membership-dispatcher.yml
  parties: !include system/party-dispatcher.yml
  idvs: !include system/idv-dispatcher.yml
  payments: !include system/payment-dispatcher.yml
  transactions: !include system/transaction-dispatcher.yml
  payee-checks: !include system/payee-check-dispatcher.yml
  telemetry: !include system/telemetry.yml
  server:
    handler: !system/required-component
    interceptors: !system/component
      system/component-kind: server/interceptors
      identity-provider: !system/ref keycloak.identity-provider
      # The providers the installation offers, by kind: what a bank's
      # create may name, and what its reads and product publishing
      # resolve against.
      providers:
        payment: !system/ref payment-provider.providers
        idv: !system/ref idv-provider.providers
      # All identity-provider instances the auth interceptor may use
      # to verify an incoming JWT. The interceptor extracts the
      # unverified `iss`, picks the matching provider, then verifies.
      identity-providers:
        - !system/ref keycloak.identity-provider
        - !system/ref keycloak.identity-provider-ops
      expected-audiences:
        - queenswood-api-test
        - queenswood-api-live
        # SPA user JWTs carry the public client id as aud (the audience
        # mapper points the client at itself).
        - queenswood-console
        - queenswood-app
      # Public client ids whose JWTs the auth interceptor treats as
      # user JWTs (azp == one of these). Anything else is a service
      # JWT keyed by azp == bank-id.
      user-client-ids:
        - queenswood-console
        - queenswood-app
      # Banking-specific status → audience mapping. Both values are
      # realm-import scope names that carry an `oidc-audience-mapper`.
      audiences-by-status:
        bank-status-test: queenswood-api-test
        bank-status-live: queenswood-api-live
      dispatchers:
        banks: !system/ref banks.dispatcher
        cash-accounts: !system/ref cash-accounts.dispatcher
        memberships: !system/ref memberships.dispatcher
        parties: !system/ref parties.dispatcher
        idvs: !system/ref idvs.dispatcher
        payments: !system/ref payments.dispatcher
        transactions: !system/ref transactions.dispatcher
        payee-checks: !system/ref payee-checks.dispatcher
        companies: !system/ref companies.dispatcher
      avro: !system/ref avro.serde
      record-db: !system/ref fdb.record-db
      record-store: !system/ref fdb.meta-store
      # The platform's own published hosts, which no tenant webhook
      # address may name. Comma-separated, because an environment
      # variable carries a string.
      platform-hosts: !env WEBHOOK_PLATFORM_HOSTS
    jetty-adapter: !system/component
      system/component-kind: server/jetty-adapter
      handler: !system/ref server.handler
      interceptors: !system/ref server.interceptors
      # The most requests the API handles at once, any beyond answered
      # 503 at once rather than held until the heap runs out. 200 is the
      # limit measured to serve the most, and the limiter moves it no more
      # than a quarter either way: a read's latency rises with what is in
      # flight, so the knee it measures unbounded sits well below that.
      max-in-flight: {initial: 200, min: 150, max: 250}
      # Counts each request turned away as mono.server.request.rejected,
      # since it reaches no span.
      telemetry: !system/ref telemetry.otel-sdk
      options:
        port: 8080
        # A request waits on its command's reply, so a pool of platform
        # threads fills under load and the liveness probe queues behind
        # it until the pod is restarted. On virtual threads a waiting
        # request holds no thread and the probe is answered at once.
        virtual-threads?: true
