system:
  # Channel-based in-process message bus (core.async) — the monolith
  # replaces Pulsar with a LocalProducer/LocalConsumer per channel,
  # so the only external infra is FDB + Keycloak/Postgres. Channel
  # names mirror the Pulsar topic set the microservice deploy uses.
  message-bus:
    bus: !system/component
      system/component-kind: message-bus/local-bus
      channels:
        - banks-command
        - banks-command-response
        - cash-accounts-command
        - cash-accounts-command-response
        - parties-command
        - parties-command-response
        - parties-event
        - transactions-command
        - transactions-command-response
        - payments-command
        - payments-command-response
        - interest-command
        - interest-command-response
        - schemes-payments-event
        - cash-accounts-event
        - schemes-payment-command
        - schemes-payment-command-response
        - idv-command
        - idv-command-response
        - companies-command
        - companies-command-response
        - idv-event
        - idvs-event
        - payee-checks-command
        - payee-checks-command-response
  fdb: !include system/fdb.yml
  avro: !include system/avro.yml
  keycloak: !include system/keycloak.yml
  banks: !include system/bank.yml
  cash-accounts: !include system/cash-account.yml
  parties: !include system/party.yml
  payments: !include system/payment.yml
  interest: !include system/interest.yml
  transactions: !include system/transaction.yml
  idv: !include system/idv.yml
  payee-checks: !include system/payee-check.yml
  webhook: !include system/webhook.yml
  policies: !include system/policy.yml
  cash-account-product-templates: !include system/cash-account-product-templates.yml
  banks-dispatcher: !include system/bank-dispatcher.yml
  cash-accounts-dispatcher: !include system/cash-account-dispatcher.yml
  cash-accounts-relay: !include system/cash-account-relay.yml
  companies-dispatcher: !include system/company-dispatcher.yml
  idvs-relay: !include system/idv-relay.yml
  interest-dispatcher: !include system/interest-dispatcher.yml
  parties-dispatcher: !include system/party-dispatcher.yml
  parties-relay: !include system/party-relay.yml
  payee-checks-dispatcher: !include system/payee-check-dispatcher.yml
  payments-dispatcher: !include system/payment-dispatcher.yml
  transactions-dispatcher: !include system/transaction-dispatcher.yml
  scheduler:
    scheduler: !system/component
      system/component-kind: scheduler/scheduler
  bank-scheduler:
    runner: !system/component
      system/component-kind: bank-scheduler/runner
      record-db: !system/ref fdb.record-db
      record-store: !system/ref fdb.meta-store
      schemas: !system/ref avro.serde
      scheduler: !system/ref scheduler.scheduler
  telemetry: !include system/telemetry.yml
  server:
    handler: !system/required-component
    interceptors: !system/component
      system/component-kind: server/interceptors
      identity-provider: !system/ref keycloak.identity-provider
      identity-providers:
        - !system/ref keycloak.identity-provider
        - !system/ref keycloak.identity-provider-ops
      expected-audiences:
        - queenswood-api-test
        - queenswood-api-live
        - queenswood-console
        - queenswood-app
      user-client-ids:
        - queenswood-console
        - queenswood-app
      audiences-by-status:
        bank-status-test: queenswood-api-test
        bank-status-live: queenswood-api-live
      dispatchers:
        banks: !system/ref banks-dispatcher.dispatcher
        cash-accounts: !system/ref cash-accounts-dispatcher.dispatcher
        parties: !system/ref parties-dispatcher.dispatcher
        payments: !system/ref payments-dispatcher.dispatcher
        interest: !system/ref interest-dispatcher.dispatcher
        transactions: !system/ref transactions-dispatcher.dispatcher
        payee-checks: !system/ref payee-checks-dispatcher.dispatcher
        companies: !system/ref companies-dispatcher.dispatcher
      avro: !system/ref avro.serde
      record-db: !system/ref fdb.record-db
      record-store: !system/ref fdb.meta-store
    jetty-adapter: !system/component
      system/component-kind: server/jetty-adapter
      handler: !system/ref server.handler
      interceptors: !system/ref server.interceptors
      options:
        port: 8080
  clearbank-simulator-server: !include system/clearbank-simulator-server.yml
  clearbank-adapter-server: !include system/clearbank-adapter-server.yml
  clearbank-adapter: !include system/clearbank-adapter.yml
  clearbank-adapter-relay: !include system/clearbank-adapter-relay.yml
  onfido-simulator-server: !include system/onfido-simulator-server.yml
  onfido-adapter-server: !include system/onfido-adapter-server.yml
  onfido-adapter: !include system/onfido-adapter.yml
  onfido-adapter-relay: !include system/onfido-adapter-relay.yml
  uk-companies-house-simulator-server: !include system/uk-companies-house-simulator-server.yml
  uk-companies-house-adapter: !include system/uk-companies-house-adapter.yml
