# Runtime config. Postgres is wherever the environment says it is, and
# the schema is applied at start by the migrator; the platform is the
# instance the bank was seeded against, and its credential arrives the
# way every other service's secrets do.
system:
  jdbc:
    datasource: !system/component
      system/component-kind: jdbc/datasource
      dbtype: postgres
      host: !env DEMO_DIGITAL_BANK_DB_HOST
      port: !long [!or [!env DEMO_DIGITAL_BANK_DB_PORT, 5432]]
      database: !env DEMO_DIGITAL_BANK_DB_NAME
      user: !env DEMO_DIGITAL_BANK_DB_USER
      password: !env DEMO_DIGITAL_BANK_DB_PASSWORD

  migrator:
    # The instance of this component is the datasource it migrated, so
    # the store refs it rather than jdbc.datasource: that is what orders
    # the schema before the first query.
    migrations: !system/component
      system/component-kind: migrator/migrations
      datasource: !system/ref jdbc.datasource
      changelogs:
        - demo-digital-bank-core/changelog.sql

  demo-digital-bank-core:
    store: !system/component
      system/component-kind: demo-digital-bank-core/store
      datasource: !system/ref migrator.migrations

    platform: !system/component
      system/component-kind: demo-digital-bank-core/platform
      url: !env DEMO_DIGITAL_BANK_PLATFORM_URL
      client-id: !env DEMO_DIGITAL_BANK_CLIENT_ID
      client-secret: !env DEMO_DIGITAL_BANK_CLIENT_SECRET
      status: !or [!env DEMO_DIGITAL_BANK_STATUS, test]

    bank: !system/component
      system/component-kind: demo-digital-bank-core/bank
      store: !system/local-ref store
      platform: !system/local-ref platform
      # Until a sender exists, the code every sign-up is asked for.
      sign-up-code: !env DEMO_DIGITAL_BANK_SIGN_UP_CODE

  server:
    handler: !system/required-component

    interceptors: !system/component
      system/component-kind: server/interceptors
      bank: !system/ref demo-digital-bank-core.bank

    jetty-adapter: !system/component
      system/component-kind: server/jetty-adapter
      handler: !system/local-ref handler
      interceptors: !system/local-ref interceptors
      cors:
        origins:
          - !env DEMO_DIGITAL_BANK_APP_ORIGIN
      options:
        port: !long [!or [!env DEMO_DIGITAL_BANK_PORT, 8100]]

  telemetry: !include system/telemetry.yml
