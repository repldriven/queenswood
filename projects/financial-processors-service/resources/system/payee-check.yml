processor: !system/component
  system/component-kind: payee-check/processor
  record-db: !system/ref fdb.record-db
  record-store: !system/ref fdb.meta-store
  schemas: !system/ref avro.serde
  payment-providers: !system/ref payment-provider.providers
  adapter-urls:
    modulr: !env MODULR_ADAPTER_URL
    form3: !env FORM3_ADAPTER_URL
    clearbank: !env CLEARBANK_ADAPTER_URL

command-processor: !system/component
  system/component-kind: command-processor/command-processor
  bus: !system/ref message-bus.bus
  processor: !system/local-ref processor
  command-channel: !keyword payee-checks-command
  command-response-channel: !keyword payee-checks-command-response
