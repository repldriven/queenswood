apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xmanagementplanes.platform.repldriven.com
spec:
  scope: Namespaced
  group: platform.repldriven.com
  names:
    kind: XManagementPlane
    plural: xmanagementplanes
  defaultCompositionRef:
    name: xmanagementplane.gcp
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          description: |
            A Crossplane control plane and the folder it governs: a
            management project, a cluster, the identities that run it,
            and Crossplane and Argo installed on top. Nothing
            bank-shaped -- what runs on the plane afterwards is another
            XRD's business, and Queenswood is one such thing rather
            than the reason this exists.

            The four-character code names the installation, which is
            the folder; this kind builds the plane inside it. See
            ADR-0022 and ADR-0023.
          properties:
            spec:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  pattern: '^[a-z0-9]{4}$'
                  description: |
                    The installation's four-character code. Every name
                    below derives from it, so nothing needs a lookup to
                    place a resource and a second installation cannot
                    collide with the first. See ADR-0023.

                # Folder only, for now. The management project, the
                # durable tier and the instances join this spec as they
                # are built; see docs/recipes/infra/plane-install.md.
                billingAccountId:
                  type: string
                  description: |
                    Billing account for every project in the
                    installation. Optional, and normally absent: the
                    identity holds billing.user on exactly one account,
                    so the binding already settles which is used and a
                    field restating it is a second copy that can
                    disagree.

                    A running plane reads the account from the
                    installation's EnvironmentConfig, as every instance
                    already does, so it can create a project from git
                    alone -- which is what a plane that composes one is
                    for. This field is the override, and the boot
                    plane's only route: it applies the manifest and
                    nothing else, so there is no config on it to read
                    and gcp-plane-apply supplies the account from the
                    identity's own binding.

                    Once a project exists the provider's
                    late-initialisation owns forProvider.billingAccount,
                    so neither source being present leaves billing
                    untouched rather than unsetting it.
                region:
                  type: string
                  description: |
                    Where the installation runs. Taken from the
                    installation's EnvironmentConfig, which states it
                    once for the plane and every instance. Not
                    defaulted: a default is indistinguishable from a
                    deliberate value, so it would silently win over the
                    environment.
                regionCode:
                  type: string
                  description: |
                    The region, abbreviated, for names that carry one --
                    a subnet is per-region and says so. Separate from
                    region because GCP publishes no short form.

                    Taken from the EnvironmentConfig like the other two,
                    and stated here only to override it. The subnet's
                    name carries it, and the kind composing that subnet
                    takes it as a plain field, so no name is derived
                    from it here.
                zone:
                  type: string
                  description: |
                    The cluster is zonal, not regional: one zonal control
                    plane falls under the free allowance, and a plane
                    running Crossplane and Argo does not need three.
                access:
                  type: object
                  description: |
                    Which principals hold which capability inside the
                    installation; see ADR-0023. The capability names are
                    ours, the principals are the organisation's to create
                    and to name, and a folder may be handed to you by one
                    whose groups are named nothing like ours. A capability
                    the organisation does not provide is left out, and
                    nothing is bound for it: an installation stands up
                    with no human bindings at all.
                  properties:
                    platformViewer:
                      type: array
                      description: |
                        Read inside the folder, assembled from predefined
                        viewer roles -- never roles/viewer, which is
                        primitive. The populated one: somebody's job
                        rather than a capability they join for.
                      items: &member
                        type: string
                        pattern: '^(user|group|serviceAccount|domain|principal|principalSet):'
                        description: |
                          A whole IAM member string, not a bare group
                          address: a capability may be answered by a
                          group, by a user in a small organisation, or by
                          a principalSet from a federated directory.
                    platformAdmin:
                      type: array
                      description: |
                        May assume the identity that runs the
                        installation, which holds the administrative
                        rights GCP grants a folder's creator -- so this
                        is administration of the whole folder, arrived at
                        by impersonation. Break-glass.
                      items: *member
                    clusterAdmin:
                      type: array
                      description: |
                        container.admin on the folder. Break-glass: acting
                        on a cluster by hand bypasses what reconciles it.
                      items: *member
                    secretsAdmin:
                      type: array
                      description: |
                        secretmanager.admin on the management project.
                        Break-glass.
                      items: *member
                machineType:
                  type: string
                  default: e2-standard-4
                  description: |
                    What the nodes are. Top-level rather than under
                    management, because management says which project
                    and where its configuration comes from, and this is
                    the shape of the cluster -- the same half of the
                    same node pool that zone is.

                    Each upjet provider pod is a Terraform runtime, and
                    Argo brings five components, so the floor is higher
                    than it looks. Measured rather than assumed now:
                    crossplane-system alone holds around 4.1GB across
                    twenty pods, against the 6GB an e2-standard-2
                    leaves allocatable -- which is not enough, and
                    presents as Argo's repo-server and server failing
                    liveness probes rather than as anything about
                    memory, since every pod there is BestEffort.

                    One larger node rather than two smaller ones. GKE's
                    own daemons cost about the same per node whatever
                    its size, so a small node pays that tax
                    proportionally harder, and a plane needs no
                    redundancy a second node would buy.

                    Immutable, so a value that merely differs replaces
                    the pool, and on this plane that is the pool running
                    the Crossplane doing the replacing.

                    Superseded by cluster.machineType where a manifest
                    states one. Kept because manifests state this, and a
                    field is added rather than repurposed.
                network:
                  type: object
                  default: {}
                  description: |
                    The ranges this plane occupies. Disjoint from an
                    instance's defaults by construction, which is what
                    makes the two safe to leave alone -- and stating
                    them belongs before anything is peered rather than
                    after. A range is immutable, so moving one rebuilds
                    the subnet and the cluster standing on it, which
                    here is the cluster doing the rebuilding.
                  properties:
                    subnetCidr:
                      type: string
                      default: 10.60.0.0/16
                      description: |
                        Where the nodes sit.
                    podsCidr:
                      type: string
                      default: 10.61.0.0/16
                      description: |
                        The secondary range GKE allocates pod addresses
                        from. Sized for pods rather than nodes: every
                        pod takes one.
                    servicesCidr:
                      type: string
                      default: 10.62.0.0/20
                      description: |
                        The secondary range for ClusterIP services.
                    proxyCidr:
                      type: string
                      default: 10.63.0.0/24
                      description: |
                        Where a regional load balancer puts its proxies.
                        Its own subnet because GCP requires one per
                        region reserved for the purpose, and it holds
                        nothing of ours.

                        The plane serves nothing from outside yet, and
                        the cluster carries the Gateway API channel that
                        would use this, so the range is reserved with
                        the other three rather than found to be missing
                        by whatever first wants an address.
                cluster:
                  type: object
                  default: {}
                  description: |
                    The shape of the plane's cluster, stated the way an
                    instance states its own rather than left where only
                    the composition can see it. What runs here is
                    Crossplane, its providers and Argo, so this is a
                    floor for a control plane rather than for a bank.
                  properties:
                    machineType:
                      type: string
                      description: |
                        What the nodes are. Deliberately undefaulted:
                        absent means the top-level machineType, which is
                        where every manifest states this today, and a
                        default here would quietly override each one.
                    nodeCount:
                      type: integer
                      default: 1
                      description: |
                        How many nodes. One is enough for what runs
                        here, and survives an upgrade rather than
                        blocking it: a surge upgrade adds a node, drains
                        the old one and removes it, so the pool is
                        briefly two and every pod on it restarts once.

                        Nothing here holds a PersistentVolume or a
                        PodDisruptionBudget, which are the two things
                        that stall a single node's drain.
                    diskSize:
                      type: integer
                      default: 50
                      description: |
                        Each node's boot disk, in GB. Nothing durable
                        belongs on it: a node is replaced rather than
                        resumed.
                    diskType:
                      type: string
                      default: pd-standard
                      description: |
                        Boot disks only, so the cheapest class is
                        usually right.
                    releaseChannel:
                      type: string
                      default: REGULAR
                      description: |
                        Which GKE release channel upgrades this cluster.
                        RAPID, REGULAR or STABLE.
                    upgradeSettings:
                      type: object
                      default: {}
                      description: |
                        How the node pool is upgraded. Stated rather
                        than left to GKE: unset, the provider observes
                        whatever defaults applied when the pool was made
                        and late-initialises them into the spec, so the
                        behaviour reads as declared while nobody chose
                        it and a later rebuild starts from whatever the
                        defaults are then.
                      properties:
                        strategy:
                          type: string
                          default: SURGE
                          description: |
                            SURGE adds nodes and drains the old ones.
                            BLUE_GREEN builds the replacement pool
                            whole, which costs a second pool's capacity.
                        maxSurge:
                          type: integer
                          default: 1
                          description: |
                            How many nodes may be added beyond
                            nodeCount during an upgrade. One is what
                            lets a single-node pool upgrade at all.
                        maxUnavailable:
                          type: integer
                          default: 0
                          description: |
                            How many nodes may be taken down before
                            their replacements are ready. Zero, so a
                            pool of one is never a pool of none.
                management:
                  type: object
                  properties:
                    providerServiceAccount:
                      type: string
                      default: crossplane-provider-gcp
                      description: |
                        The Kubernetes service account Crossplane's GCP
                        providers run as on the management cluster,
                        pinned by a DeploymentRuntimeConfig. Workload
                        Identity binds to this name, so it cannot be the
                        generated one.
                    projectId:
                      type: string
                      description: |
                        The management project's id. Always supplied: a
                        project id is consumed permanently and cannot be
                        undeleted into usefulness, so a rebuilt plane
                        that invented one would strand the first.
                    adopt:
                      type: string
                      pattern: '^projects/[a-z][a-z0-9-]{4,28}[a-z0-9]$'
                      description: |
                        An existing management project to take over,
                        written projects/<id> -- the prefixed form
                        Crossplane records as the external name.

                        Separate from projectId because creation and
                        adoption cannot share a field. GCP answers
                        permission denied, never not found, for a project
                        id you do not own, so an external name set before
                        the project exists makes the first observation
                        fail and creation never follows.
                    source:
                      type: object
                      default:
                        repoURL: https://github.com/repldriven/queenswood
                        targetRevision: main
                      description: |
                        Where the management plane reconciles its own
                        configuration from -- the provider packages, this
                        API, and the runtime and provider configurations
                        underneath them.

                        Defaulted to this project, and meant to be set
                        by anyone running a fork. The composition
                        travels with the fork, so a hard-coded URL here
                        would have a forked installation build its
                        cluster and then reconcile upstream's manifests
                        onto it. Pinning targetRevision to a tag is the
                        other reason: main is a moving target for a
                        plane that is meant to be durable.

                        Not the manifest naming an installation, which
                        is private and arrives separately.
                      properties:
                        repoURL:
                          type: string
                          default: https://github.com/repldriven/queenswood
                        targetRevision:
                          type: string
                          default: main
                        pathPrefix:
                          type: string
                          default: "."
                          description: |
                            Where this project sits inside that
                            repository. A fork keeps the layout and
                            leaves this alone; a mirror that vendors
                            the project under a directory sets it, and
                            every path below is relative to it.
                    manifestRepoURL:
                      type: string
                      description: |
                        The repository this installation's own manifest
                        is committed to, which the management plane
                        reconciles itself from once it holds a
                        credential for it.

                        Absent where there is none, and then no
                        credential machinery is composed at all: an
                        installation applied only from a boot plane
                        needs nothing to read.

                        Not management.source, which is where the
                        plane's configuration comes from. This is where
                        the record of the installation lives, and the
                        two are different repositories for the reason
                        the plan gives -- one is public and the other
                        is not.
                    bootstrap:
                      type: boolean
                      description: |
                        Whether this plane may install the management
                        plane's own Crossplane and Argo, rather than
                        only watch them.

                        Set by the plane that installs this one, and
                        absent from the committed manifest, so the
                        management plane reconciling itself observes
                        what installed it and never acts on it -- a
                        composition edit would otherwise have Crossplane
                        upgrading itself mid-reconcile, and a delete
                        would need a boot plane raised to recover.

                        The same seam billingAccountId uses: supplied at
                        creation by whoever is creating, and left out of
                        the record afterwards.
                    displayName:
                      type: string
                      description: |
                        Overrides the derived name. Absent by default:
                        a project's display name mirrors its id, so the
                        console and a manifest read alike and meaning
                        lives in labels. Set it where a project is
                        handed to us already named.
                recovery:
                  type: object
                  description: |
                    The project holding what an installation must have
                    after losing everything else -- backups, the key
                    they are encrypted under, and the exports that
                    outlive the databases they came from.

                    Its own project rather than the management one so
                    that the identity able to destroy a primary cannot
                    reach the copy, and rather than an instance's so
                    that a rebuilt instance does not take its own
                    backups with it. Inside the folder rather than
                    beside it: a folder is the installation and its IAM
                    boundary, and creating a project above one needs
                    rights an installation hosted in somebody else's
                    organisation will not have.

                    The plane composes the project and leaves it empty.
                    Each instance composes its own bucket in it and is
                    granted on that bucket alone, so one instance's
                    identity does not reach another's backups.

                    Absent composes nothing, which is an installation
                    not yet keeping anything. Optional only because
                    qw01 predates the field: a manifest minted from
                    queenswood-installation-manifest always carries it.

                    Not audit or evidence, which want a locked
                    retention policy and a different set of readers, so
                    want a project of their own.
                  properties:
                    projectId:
                      type: string
                      description: |
                        Where the id is authored, and the only place.
                        The plane is its one reader -- it is what says
                        which project to compose -- and an instance
                        reads the id off the composed Project rather
                        than from a second copy of it, so the shared
                        config that once held it would now be
                        indirection for a single consumer.

                        Supplied rather than generated, for the reason
                        management.projectId is: a project id is
                        consumed permanently, so a plane that invented
                        one would strand what the last was holding.
                    adopt:
                      type: string
                      pattern: '^projects/[a-z][a-z0-9-]{4,28}[a-z0-9]$'
                      description: |
                        An existing recovery project to take over,
                        written projects/<id>. Separate from projectId
                        for the reason management.adopt is: GCP answers
                        permission denied rather than not found for a
                        project you do not own, so an external name set
                        before the project exists makes the first
                        observation fail and creation never follows.
                    displayName:
                      type: string
                      description: |
                        Overrides the derived name, as
                        management.displayName does.
                    location:
                      type: string
                      description: |
                        Where the buckets live. Defaults to the
                        installation's region. A multi-region survives
                        losing one, and costs more and answers the S3
                        interop endpoint under a region name of its own
                        -- which the backup agent signs over, so it is
                        not free to change later.
            status:
              type: object
              properties:
                managementProjectId:
                  type: string
                  description: The management project, once it exists.
                managementProjectNumber:
                  type: string
                  description: |
                    The management project's number, which GCP assigns.
                    Read back because the default compute service
                    account's address carries it and nothing derives it
                    from the id.
                recoveryProjectId:
                  type: string
                  description: |
                    The recovery project this installation keeps its
                    backups in, echoed back so a reader need not know
                    which of the two places named it.
                clusterEndpoint:
                  type: string
                  description: The management cluster's API endpoint.
                folderId:
                  type: string
                  description: |
                    The folder as folders/<id>, which is the form a
                    parent reference takes and what every later step
                    reads. Comes from the external-name annotation,
                    which holds the resource name rather than the
                    bare number.
