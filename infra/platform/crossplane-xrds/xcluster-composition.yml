apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xcluster.gcp
spec:
  compositeTypeRef:
    apiVersion: platform.repldriven.com/v1alpha1
    kind: XCluster
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          # ===================================================================
          # The identity this instance's nodes run as. Not the default
          # compute service account, which is shared by everything in
          # the project that never chose one and holds whatever the
          # organisation's policy on automatic grants leaves it holding.
          # The pool asks for cloud-platform scopes, so whatever it
          # holds, every workload on the cluster reaches through the
          # metadata server.
          #
          # Delete is withheld. ADR-0024 says down leaves the project,
          # its data, its DNS zone and its identities standing, so an
          # identity outlives the cluster it runs.
          #
          # The label is in the name as well as the environment letter:
          # two nonprod instances in one installation would otherwise
          # both claim sa-<code>-n-nodes, and Crossplane holds every
          # environment's resources in one namespace whatever project
          # each lands in.
          # ===================================================================
          - name: nodes-identity
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ServiceAccount
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  displayName: Queenswood cluster nodes
                  description: Runs this environment's cluster nodes
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "sa-%s-%s-%s-nodes"
                toFieldPath: metadata.name
              - fromFieldPath: spec.projectId
                toFieldPath: spec.forProvider.project
              # The account id is the external name, so it is stated
              # rather than left to default from metadata.name: the node
              # pool below spells the same address, and a generated one
              # would leave it spelling nothing.
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "sa-%s-%s-%s-nodes"
                toFieldPath: metadata.annotations[crossplane.io/external-name]
          # One role rather than the four the older guidance lists.
          # container.defaultNodeServiceAccount is narrower than they
          # are -- monitoring.viewer alone grants project-wide read of
          # every alert policy and dashboard, which a node has no use
          # for -- and it carries autoscaling.sites.writeMetrics, which
          # none of them do and horizontal autoscaling needs. Google
          # maintains it, so a change in what a node requires arrives
          # here rather than leaving a hand-written list stale.
          #
          # Nothing grants the platform identity serviceAccountUser on
          # this account. For an instance the platform identity created
          # the project, which makes it owner of it, and attaching a
          # service account to a node pool is a right an owner already
          # holds. A management plane's project was created by the seed
          # instead, so its own composition grants the binding -- which
          # is a fact about who created a project rather than about
          # clusters, and so stays there.
          - name: nodes-role-default-node-service-account
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/container.defaultNodeServiceAccount
            patches:
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                  strategy: string
                  string:
                    fmt: "%s-%s-%s-nodes-default-node-service-account"
                toFieldPath: metadata.name
              - fromFieldPath: spec.projectId
                toFieldPath: spec.forProvider.project
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.env
                    - fromFieldPath: spec.label
                    - fromFieldPath: spec.projectId
                  strategy: string
                  string:
                    fmt: "serviceAccount:sa-%s-%s-%s-nodes@%s.iam.gserviceaccount.com"
                toFieldPath: spec.forProvider.member
    # =======================================================================
    # The cluster this environment runs on and the pool on it, which is
    # where its bill starts: everything composed above costs nothing
    # standing still.
    #
    # Templated rather than patched, for two reasons. The pool's count is
    # a manifest value and a state at once, and no patch can combine the
    # two, since a map transform must name every key it may see. And a
    # shelved cluster composes neither: patch-and-transform composes a
    # fixed set, where a template can leave both out of the desired state,
    # and Crossplane deletes what is left out, subject to its
    # managementPolicies. See ADR-0029.
    #
    # The composition-resource-names are what identify these to
    # Crossplane, so they stay cluster and nodes and the live cluster and
    # pool are matched rather than rebuilt.
    #
    # Every field is checked before it is used. A Go template renders a
    # missing map key as the string "<no value>" rather than failing,
    # which is a silent failure where policy.fromFieldPath Required in
    # patch-and-transform was a loud one.
    # =======================================================================
    - step: cluster
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $cluster := $xr.spec.cluster | default dict }}
            {{- $upgrade := $cluster.upgradeSettings | default dict }}
            {{- range $f := list "machineType" "nodeCount" "diskSize" "diskType" "releaseChannel" "upgradeSettings" }}
            {{- if not (hasKey $cluster $f) }}
            {{- fail (printf "spec.cluster.%s is absent" $f) }}
            {{- end }}
            {{- end }}
            {{- range $f := list "code" "env" "label" "state" "zone" "regionCode" "projectId" }}
            {{- if not (hasKey $xr.spec $f) }}
            {{- fail (printf "spec.%s is absent" $f) }}
            {{- end }}
            {{- end }}
            {{- /* Both absent on an XR stored before the field existed, and
                   false is what such an XR means: a default reaches an
                   object when something writes it, never on the way
                   out. */}}
            {{- $retain := $xr.spec.retain | default false }}
            {{- $shelved := $cluster.shelved | default false }}
            {{- $name := printf "%s-%s-%s" $xr.spec.code $xr.spec.env $xr.spec.label }}
            {{- $count := 0 }}
            {{- if eq $xr.spec.state "up" }}
            {{- $count = $cluster.nodeCount }}
            {{- end }}
            {{- if not $shelved }}
            {{- $observed := dig "cluster" "resource" "status" "atProvider" dict (.observed.resources | default dict) }}
            # Fully managed unless retain withholds Delete, which is what
            # ADR-0022 leaves anything that rebuilds from its own
            # declaration. Shelving destroys the cluster and leaves the
            # project, its data, the network and the identities.
            #
            # retain is for the caller whose cluster is the one Crossplane
            # itself runs on, and shelving that is refused by the XRD.
            #
            # No nodeConfig here on purpose. It only ever configures the
            # default node pool, which removeDefaultNodePool deletes
            # immediately, and GKE then recomputes node_config on the
            # cluster. The provider sees a diff on a field that can only
            # change by replacing the cluster and refuses to reconcile,
            # leaving it stuck Creating. The real node configuration is on
            # the pool below.
            apiVersion: container.gcp.m.upbound.io/v1beta1
            kind: Cluster
            metadata:
              # No kind prefix: a cluster is never listed beside other
              # kinds, and GKE prefixes every name it derives from one
              # with gke- already.
              name: {{ $name }}
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cluster
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                {{- if not $retain }}
                - Delete
                {{- end }}
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                project: {{ $xr.spec.projectId }}
                # The field this rule was learned from. location is
                # required on Cluster and optional on NodePool, so the
                # same absent zone failed the first loudly and left the
                # second holding a pool it could no longer observe.
                location: {{ $xr.spec.zone }}
                initialNodeCount: 1
                removeDefaultNodePool: true
                # The composite is what protects this, through
                # managementPolicies and the manifest that declares
                # it. A second lock GCP holds outside Crossplane only
                # makes a declared teardown fail halfway.
                deletionProtection: false
                networkRef:
                  name: vpc-{{ $name }}
                subnetworkRef:
                  name: sb-{{ $name }}-{{ $xr.spec.regionCode }}
                ipAllocationPolicy:
                  clusterSecondaryRangeName: pods
                  servicesSecondaryRangeName: services
                addonsConfig:
                  httpLoadBalancing:
                    disabled: false
                # What the proxy-only subnet is for. Upbound's CRD
                # nests this at the top level rather than under
                # networkConfig, and placing it elsewhere is silently
                # dropped.
                gatewayApiConfig:
                  channel: CHANNEL_STANDARD
                releaseChannel:
                  channel: {{ $cluster.releaseChannel }}
                # Workload Identity, so a pod assumes a service account
                # rather than holding a key. The pool belongs to the
                # project rather than to the cluster, so a rebuilt
                # cluster answers to the same bindings.
                workloadIdentityConfig:
                  workloadPool: {{ $xr.spec.projectId }}.svc.id.goog
                # Encryption in transit, for the ten paths inside the
                # cluster that are not TLS: the backup agents to
                # s3proxy, the Gateway to console, api and Keycloak,
                # the services to Kafka and to FoundationDB,
                # FoundationDB between its own processes, Keycloak and
                # the realm exporter to the Cloud SQL proxy, and
                # everything to Jaeger. The control asks whether data
                # in transit is encrypted rather than whether it is
                # TLS, so this answers all ten at once.
                #
                # Both fields or neither: the encryption is a
                # Dataplane V2 feature and inert on LEGACY_DATAPATH,
                # which is what GKE defaults to.
                #
                # Neither can be applied to a live cluster. The
                # dataplane is fixed at creation, so the provider
                # refuses the diff rather than performing it and the
                # refusal lands in LastAsyncOperation -- Synced alone
                # does not say. The cluster takes this when it is next
                # rebuilt; see docs/recipes/infra/instance-rebuild-cluster.md.
                #
                # It forecloses enableFqdnNetworkPolicy, which cannot
                # coexist with inter-node encryption, so egress
                # control has to be a Cloud NAT and CIDRs rather than
                # names. And it does not cover two pods on one node,
                # because that traffic never reaches a network.
                datapathProvider: ADVANCED_DATAPATH
                inTransitEncryptionConfig: IN_TRANSIT_ENCRYPTION_INTER_NODE_TRANSPARENT
              # A kubeconfig for this cluster, written by the provider
              # on every reconcile. It carries the endpoint and the CA
              # and no credential: the token comes from the identity
              # block on whichever provider config reads it.
              writeConnectionSecretToRef:
                name: {{ $name }}-kubeconfig
            ---
            apiVersion: container.gcp.m.upbound.io/v1beta1
            kind: NodePool
            metadata:
              name: np-{{ $name }}-primary
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: nodes
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                {{- if not $retain }}
                - Delete
                {{- end }}
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                cluster: {{ $name }}
                location: {{ $xr.spec.zone }}
                # Owned here so late-initialisation cannot. Left unset,
                # upjet observes the live pool and writes podRange and
                # podIpv4CidrBlock back into the spec -- harmless while
                # the pool exists, since it is only describing what is
                # there. It stops being harmless the moment the pool has
                # to be created again: the CIDR is then sent as a create
                # parameter, and GCP refuses it with "Can only set
                # pod_ipv4_cidr_block if create_pod_range is true",
                # leaving a cluster with no nodes.
                #
                # podRange alone is what is wanted: it names the
                # secondary range the cluster's ipAllocationPolicy
                # already points at, rather than asking for a new one.
                networkConfig:
                  podRange: pods
                project: {{ $xr.spec.projectId }}
                nodeCount: {{ $count | int }}
                # Composed rather than observed, for the same reason as
                # networkConfig above: left unset, upjet writes back
                # whatever GKE defaulted to, so the spec reads as
                # declared while nobody chose it. maxUnavailable 0 keeps
                # a replacement node up before the old one goes.
                upgradeSettings:
                  strategy: {{ $upgrade.strategy }}
                  maxSurge: {{ $upgrade.maxSurge | int }}
                  maxUnavailable: {{ $upgrade.maxUnavailable | int }}
                nodeConfig:
                  machineType: {{ $cluster.machineType }}
                  diskSizeGb: {{ $cluster.diskSize | int }}
                  diskType: {{ $cluster.diskType }}
                  serviceAccount: sa-{{ $name }}-nodes@{{ $xr.spec.projectId }}.iam.gserviceaccount.com
                  oauthScopes:
                    - https://www.googleapis.com/auth/cloud-platform
                  workloadMetadataConfig:
                    mode: GKE_METADATA
            {{- if or $observed.endpoint (dig "masterAuth" "clusterCaCertificate" "" $observed) }}
            ---
            # Both read back from the cluster rather than derived, and
            # absent until it exists. A shelved cluster reports neither,
            # so whatever registers it has nothing to point at.
            apiVersion: platform.repldriven.com/v1alpha1
            kind: XCluster
            status:
              {{- with $observed.endpoint }}
              endpoint: {{ . }}
              {{- end }}
              {{- with dig "masterAuth" "clusterCaCertificate" "" $observed }}
              ca: {{ . }}
              {{- end }}
            {{- end }}
            {{- end }}
    # =======================================================================
    # One binding per principal, which patch-and-transform cannot
    # express: it composes a fixed set of resources and has no way to
    # say "none" for an empty list. So this mirrors the plane's own
    # access step rather than inventing a second shape.
    #
    # Nothing is emitted where no viewers are named, which is an
    # installation that has not decided yet rather than one that has
    # decided nobody.
    # =======================================================================
    # =======================================================================
    # This instance's bucket, in the installation's recovery project.
    # Templated rather than patched because the block is absent until
    # an instance keeps something, and because the name is built from
    # part of another field.
    #
    # One bucket per instance rather than one per installation, so an
    # instance's identity is granted on its own backups and reaches no
    # other's -- which is the whole reason the project sits outside the
    # instance in the first place, and would be given back by a bucket
    # everything shares.
    # =======================================================================
    - step: auto-ready
      functionRef:
        name: function-auto-ready
