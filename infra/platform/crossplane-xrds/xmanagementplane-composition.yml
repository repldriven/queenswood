apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xmanagementplane.gcp
spec:
  compositeTypeRef:
    apiVersion: platform.repldriven.com/v1alpha1
    kind: XManagementPlane
  mode: Pipeline
  pipeline:
    # =======================================================================
    # The installation's EnvironmentConfig, which is where the billing
    # account is stated. Without this the plane can compose a project
    # only from spec.billingAccountId, which the committed manifest
    # deliberately omits -- so a project the plane created reading git
    # would have no billing account, and Cloud Storage in it would not
    # work. Instances have read it from here all along; the plane had
    # no way to.
    #
    # mode Multiple, where the instance's selector is Single. The first
    # plane to apply this composite is a boot plane, which applies the
    # manifest and nothing else -- there is no EnvironmentConfig on it
    # at all, and Single means exactly one, so the step fails and the
    # composite composes nothing rather than falling back. Multiple
    # tolerates none, leaving billing to spec.billingAccountId, which is
    # what gcp-plane-apply supplies at exactly that moment.
    # =======================================================================
    - step: environment
      functionRef:
        name: function-environment-configs
      input:
        apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
        kind: Input
        spec:
          policy:
            resolution: Optional
          environmentConfigs:
            - type: Selector
              selector:
                mode: Multiple
                matchLabels:
                  - type: FromCompositeFieldPath
                    key: installation
                    valueFromFieldPath: spec.code
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          # ===================================================================
          # Delete follows what drives a resource, not what kind it is.
          #
          # Nothing composed here carries it. All of this is the plane's
          # own scaffolding -- the folder and project it lives in, the
          # cluster and its network, the identities, and the bindings
          # that let those identities act. Deleting one orphans the
          # cloud resource rather than destroying it, which is what let
          # this composite adopt what the last one built, and what lets
          # the next one do the same.
          #
          # The bindings are the sharp case. They include the Workload
          # Identity binding Crossplane authenticates with and the
          # folder roles it acts under, so deleting them takes away the
          # means of putting them back, halfway through doing it.
          #
          # What that costs: a role dropped from this file is not
          # revoked. The managed resource goes and the GCP binding
          # stays, so narrowing what an identity may do means removing
          # the binding in GCP as well.
          #
          # The access step is the other way round -- its bindings come
          # from the manifest, so they carry Delete and a principal
          # removed from the access mapping loses what it named.
          # ===================================================================
          # The management project, referenced to the folder rather than
          # patched from its id: folderIdRef resolves the composed
          # Folder by name, so Crossplane orders the two itself.
          # ===================================================================
          - name: management-project
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: Project
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  name: queenswood management
                  # No default VPC. The org policy says the same thing,
                  # and a folder handed to us may not carry it.
                  autoCreateNetwork: false
                  # Provider-side, and already the default. The project
                  # holds the platform: nothing reconciling should be
                  # able to remove it.
                  deletionPolicy: PREVENT
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "prj-%s-c-mgmt"
              # Adoption only. Setting this before the project exists
              # makes observe fail with permission denied, which
              # Crossplane cannot tell from a real error, so it never
              # creates.
              - fromFieldPath: spec.management.adopt
                toFieldPath: metadata.annotations[crossplane.io/external-name]
              - fromFieldPath: spec.management.projectId
                toFieldPath: spec.forProvider.projectId
              # Derived first, then overridden: a later patch wins when
              # its source is set and is skipped when it is absent, so
              # this is how a field gets a default it cannot state.
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "prj-%s-c-mgmt"
              - fromFieldPath: spec.management.displayName
                toFieldPath: spec.forProvider.name
              # The installation's account, then this manifest's if it
              # names one: the same later-patch-wins ordering the
              # display name above uses, so the config supplies it
              # normally and gcp-plane-apply overrides at bootstrap.
              - type: FromEnvironmentFieldPath
                fromFieldPath: billingAccountId
                toFieldPath: spec.forProvider.billingAccount
              - fromFieldPath: spec.billingAccountId
                toFieldPath: spec.forProvider.billingAccount
              # Names the composed Folder, so Crossplane resolves it and
              # orders the two itself rather than the id being threaded
              # through status.
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.folderIdRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "fldr-%s"
              # The folder this plane sits in, now that it does not
              # compose one. Read off the project's resolved reference
              # rather than a folder resource, so status.folderId keeps
              # meaning what it always meant.
              - type: ToCompositeFieldPath
                fromFieldPath: spec.forProvider.folderId
                toFieldPath: status.folderId
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.annotations[crossplane.io/external-name]
                toFieldPath: status.managementProjectId
              # The project's number, which the default compute service
              # account's address carries and nothing else derives.
              # Assigned by GCP, so it is pivoted up here and composed
              # from below rather than stated anywhere.
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.number
                toFieldPath: status.managementProjectNumber
          # ===================================================================
          # APIs the management project needs before anything runs in it.
          # projectRef names the composed Project, so each waits for it
          # without an id being threaded through.
          # ===================================================================
          - name: management-service-iam
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: iam.googleapis.com
                  # Leaving an API enabled on the way down is harmless
                  # and avoids a dependent-resource cascade.
                  disableOnDestroy: false
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "svc-%s-c-iam"
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.projectRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "prj-%s-c-mgmt"
          - name: management-service-iamcredentials
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: iamcredentials.googleapis.com
                  # Leaving an API enabled on the way down is harmless
                  # and avoids a dependent-resource cascade.
                  disableOnDestroy: false
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "svc-%s-c-iamcredentials"
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.projectRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "prj-%s-c-mgmt"
          - name: management-service-serviceusage
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: serviceusage.googleapis.com
                  # Leaving an API enabled on the way down is harmless
                  # and avoids a dependent-resource cascade.
                  disableOnDestroy: false
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "svc-%s-c-serviceusage"
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.projectRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "prj-%s-c-mgmt"
          - name: management-service-resourcemanager
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: cloudresourcemanager.googleapis.com
                  # Leaving an API enabled on the way down is harmless
                  # and avoids a dependent-resource cascade.
                  disableOnDestroy: false
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "svc-%s-c-resourcemanager"
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.projectRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "prj-%s-c-mgmt"
          - name: management-service-compute
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: compute.googleapis.com
                  disableOnDestroy: false
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "svc-%s-c-compute"
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.projectRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "prj-%s-c-mgmt"
          - name: management-service-secretmanager
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: secretmanager.googleapis.com
                  disableOnDestroy: false
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "svc-%s-c-secretmanager"
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.projectRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "prj-%s-c-mgmt"
          # Enabling billing on a project is a call the provider makes
          # from its own project, so the API is enabled here rather than
          # on whatever it bills. Nothing needed it until an instance
          # took its account from the installation's EnvironmentConfig,
          # which is when a 403 naming this project appears against a
          # resource in another one.
          - name: management-service-billing
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: cloudbilling.googleapis.com
                  disableOnDestroy: false
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "svc-%s-c-billing"
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.projectRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "prj-%s-c-mgmt"
          - name: management-service-container
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: container.googleapis.com
                  disableOnDestroy: false
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "svc-%s-c-container"
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.projectRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "prj-%s-c-mgmt"
          # ===================================================================
          # Two APIs the plane enables for itself but never calls
          # against itself. GCP checks an API against the project the
          # caller belongs to as well as the project the resource
          # belongs to, and every call an instance provokes is made by
          # the platform identity, which lives here. So an instance
          # enabling sqladmin in its own project is necessary and not
          # sufficient: without these, the provider is refused before it
          # reaches the instance at all, and the 403 names the
          # management project rather than the one being built.
          #
          # The rule generalises: every API any composite calls is
          # enabled here too. compute, container, iam, resourcemanager
          # and serviceusage were already, because the plane builds
          # itself out of them, which is why this only surfaced when an
          # instance reached for a kind the plane had never used.
          # ===================================================================
          - name: management-service-servicenetworking
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: servicenetworking.googleapis.com
                  disableOnDestroy: false
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "svc-%s-c-servicenetworking"
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.projectRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "prj-%s-c-mgmt"
          - name: management-service-sqladmin
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectService
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  service: sqladmin.googleapis.com
                  disableOnDestroy: false
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "svc-%s-c-sqladmin"
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.projectRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "prj-%s-c-mgmt"
          # ===================================================================
          # The network this plane runs in: one VPC, the subnet its nodes
          # sit in with the secondary ranges GKE allocates pods and
          # services from, and the proxy-only subnet a regional load
          # balancer wants.
          #
          # The same kind an instance composes. env c and label mgmt
          # render vpc-<code>-c-mgmt and sb-<code>-c-mgmt-<regionCode>,
          # which are the names the plane's own VPC and subnet carry, so
          # the composed kind adopts them rather than making a second
          # pair.
          # ===================================================================
          - name: management-network
            base:
              apiVersion: platform.repldriven.com/v1alpha1
              kind: XNetwork
              metadata:
                namespace: crossplane-system
              spec:
                env: c
                label: mgmt
            patches:
              - &plane-child-name
                fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-c-mgmt"
              - &plane-child-code
                policy:
                  fromFieldPath: Required
                fromFieldPath: spec.code
                toFieldPath: spec.code
              - &plane-child-project
                policy:
                  fromFieldPath: Required
                fromFieldPath: spec.management.projectId
                toFieldPath: spec.projectId
              # The installation's region, then this plane's if it names
              # one: the later patch wins, and neither field is defaulted
              # in this XRD, because a default is indistinguishable from
              # a deliberate value and would silently win over the
              # environment. The composed kind defaults both, which is
              # what a plane applied with no EnvironmentConfig falls
              # back to.
              - type: FromEnvironmentFieldPath
                fromFieldPath: region
                toFieldPath: spec.region
              - fromFieldPath: spec.region
                toFieldPath: spec.region
              - &plane-child-region-code-env
                type: FromEnvironmentFieldPath
                fromFieldPath: regionCode
                toFieldPath: spec.regionCode
              - &plane-child-region-code
                fromFieldPath: spec.regionCode
                toFieldPath: spec.regionCode
              # Required, here and on every patch below whose source the
              # XRD defaults rather than the manifest states. A default
              # is absent for a window: Argo applies the XRD and this
              # file in one sync, and the new composition can be
              # selected before the API server serves the regenerated
              # CRD. A skipped patch then composes a resource with a
              # hole in it, which the provider may create and fail to
              # observe -- and no later reconcile recovers that, because
              # the resource exists and is wrong.
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.network.subnetCidr
                toFieldPath: spec.subnetCidr
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.network.podsCidr
                toFieldPath: spec.podsCidr
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.network.servicesCidr
                toFieldPath: spec.servicesCidr
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.network.proxyCidr
                toFieldPath: spec.proxyCidr

          # ===================================================================
          # The cluster Crossplane and Argo run on, the pool that carries
          # them, and the identity that pool runs as. The same kind an
          # instance composes.
          #
          # retain, so the cluster and the pool keep Delete withheld: an
          # instance's cluster is the disposable tier ADR-0022 leaves
          # fully managed, and this one is the ground the controller
          # doing the deleting stands on. Deleting the composite orphans
          # it instead, which is what lets the next composite adopt what
          # the last one built.
          #
          # No state. ADR-0024 makes state an instance's property, so
          # the plane takes the composed kind's default of up and
          # nothing here can scale the pool to zero.
          #
          # The serviceAccountUser binding on the node identity stays
          # below rather than moving into the composed kind: it is a
          # fact about who created this project, not about clusters.
          # ===================================================================
          - name: management-gke
            base:
              apiVersion: platform.repldriven.com/v1alpha1
              kind: XCluster
              metadata:
                namespace: crossplane-system
              spec:
                env: c
                label: mgmt
                retain: true
            patches:
              - *plane-child-name
              - *plane-child-code
              - *plane-child-project
              - type: FromEnvironmentFieldPath
                fromFieldPath: zone
                toFieldPath: spec.zone
              - fromFieldPath: spec.zone
                toFieldPath: spec.zone
              - *plane-child-region-code-env
              - *plane-child-region-code
              # The whole block, which is the same shape on both kinds,
              # and then machineType over the top of it: this XRD leaves
              # cluster.machineType undefaulted so the top-level field
              # can win, and the composed kind defaults it to a size
              # that is not enough for a plane -- so a manifest stating
              # only the top-level field would otherwise reach that
              # default instead.
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.cluster
                toFieldPath: spec.cluster
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.machineType
                toFieldPath: spec.cluster.machineType
              - fromFieldPath: spec.cluster.machineType
                toFieldPath: spec.cluster.machineType
              - type: ToCompositeFieldPath
                fromFieldPath: status.endpoint
                toFieldPath: status.clusterEndpoint
          # ===================================================================
          # Crossplane on the management cluster, installed by the plane
          # that built the cluster. This is the first thing composed
          # here that acts on Kubernetes rather than on GCP, and it
          # reaches the cluster through the helm ProviderConfig
          # gcp-plane-up applies -- a kubeconfig for the endpoint and
          # the CA, and the impersonated identity for the token.
          #
          # The chart version is pinned rather than floating, and
          # scripts/check-versions.sh holds it to the one the boot
          # chart resolves, which is what Renovate bumps.
          #
          # Observe unless the applying plane says otherwise, which only
          # the plane installing this one does. So the management plane,
          # reconciling the composite that describes itself, watches the
          # release that installed it and never acts on it. The base
          # carries the safe value because a patch whose source is
          # absent is skipped, and the committed manifest is what leaves
          # it absent.
          # ===================================================================
          - name: management-crossplane
            base:
              apiVersion: helm.m.crossplane.io/v1beta1
              kind: Release
              metadata:
                namespace: crossplane-system
                # The Kubernetes name carries the installation, because
                # the applying plane holds one per installation. The
                # helm release name does not: it names a release inside
                # one cluster, where there is only ever this one, and
                # the chart derives every resource name from it.
                annotations:
                  crossplane.io/external-name: crossplane
              spec:
                managementPolicies:
                  - Observe
                providerConfigRef:
                  kind: ClusterProviderConfig
                forProvider:
                  namespace: crossplane-system
                  chart:
                    repository: https://charts.crossplane.io/stable
                    name: crossplane
                    version: "2.4.0"
                  # The chart's defaults are both binding on a plane of
                  # this size. Measured over seven days: the core holds
                  # 472m sustained against a 500m limit -- throttled
                  # continuously -- and peaked at 977Mi against 1024Mi.
                  # Requests are the steady state, limits leave room.
                  #
                  # The RBAC manager reserves 256Mi and 100m by default
                  # and uses 24Mi and 2m.
                  values:
                    resourcesCrossplane:
                      requests:
                        cpu: 500m
                        memory: 512Mi
                      limits:
                        cpu: 1000m
                        memory: 2Gi
                    resourcesRBACManager:
                      requests:
                        cpu: 10m
                        memory: 32Mi
                      limits:
                        cpu: 100m
                        memory: 256Mi
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "crossplane-%s-c-mgmt"
              # Both cases are spelled, so setting the field to false is
              # as explicit as leaving it out. map takes a string key,
              # and the field is a boolean, so it is converted first.
              - &plane-release-policies
                fromFieldPath: spec.management.bootstrap
                toFieldPath: spec.managementPolicies
                transforms:
                  - type: convert
                    convert:
                      toType: string
                  - type: map
                    map:
                      "true":
                        - Observe
                        - Create
                        - Update
                        - LateInitialize
                      "false":
                        - Observe
              - &plane-release-config
                fromFieldPath: spec.code
                toFieldPath: spec.providerConfigRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-mgmt"
          # ===================================================================
          # Argo CD on the management cluster, installed the same way and
          # observed on the same terms. What it reconciles from is not
          # here: this puts Argo on the cluster, and pointing it at a
          # repository is its own step.
          #
          # argocd is the namespace and the release name everything else
          # in this repository already assumes -- the chart derives
          # argocd-server and the rest from it, and the bootstrap
          # Applications name that namespace directly.
          # ===================================================================
          - name: management-argo
            base:
              apiVersion: helm.m.crossplane.io/v1beta1
              kind: Release
              metadata:
                namespace: crossplane-system
                annotations:
                  crossplane.io/external-name: argocd
              spec:
                managementPolicies:
                  - Observe
                providerConfigRef:
                  kind: ClusterProviderConfig
                forProvider:
                  namespace: argocd
                  chart:
                    repository: https://argoproj.github.io/argo-helm
                    name: argo-cd
                    version: "10.9.1"
                  # What tells Argo where git is, carried by the
                  # release that installs Argo so that bringing up a
                  # management plane stays one act. The public
                  # repository: nothing here needs a credential.
                  values:
                    # What each component reserves. Measured over seven
                    # days on a running plane: the application
                    # controller peaked at 1842Mi and everything else
                    # under 170Mi, on a node whose pods were BestEffort
                    # and whose scheduler therefore read it as a third
                    # committed while it was full.
                    #
                    # Requests are the point. A memory limit on the
                    # controller would kill it mid-sync at a peak it
                    # legitimately reaches, and nothing else on a plane
                    # competes for that memory -- so the limits below
                    # sit well clear of what was observed rather than
                    # close to it.
                    controller:
                      # Default is 50. A plane serving a provider's
                      # worth of CRDs spends the budget on discovery
                      # alone, and syncs queue behind it.
                      env:
                        - name: ARGOCD_K8S_CLIENT_QPS
                          value: "300"
                      resources:
                        requests:
                          cpu: 150m
                          memory: 1Gi
                        limits:
                          cpu: 1000m
                          memory: 2560Mi
                    repoServer:
                      resources:
                        requests:
                          cpu: 100m
                          memory: 256Mi
                        limits:
                          cpu: 500m
                          memory: 1Gi
                    server:
                      resources:
                        requests:
                          cpu: 50m
                          memory: 128Mi
                        limits:
                          cpu: 300m
                          memory: 512Mi
                    redis:
                      resources:
                        requests:
                          cpu: 25m
                          memory: 64Mi
                        limits:
                          cpu: 200m
                          memory: 256Mi
                    dex:
                      resources:
                        requests:
                          cpu: 25m
                          memory: 64Mi
                        limits:
                          cpu: 200m
                          memory: 256Mi
                    applicationSet:
                      resources:
                        requests:
                          cpu: 25m
                          memory: 64Mi
                        limits:
                          cpu: 200m
                          memory: 256Mi
                    notifications:
                      resources:
                        requests:
                          cpu: 25m
                          memory: 64Mi
                        limits:
                          cpu: 200m
                          memory: 256Mi
                    extraObjects:
                      - apiVersion: argoproj.io/v1alpha1
                        kind: Application
                        metadata:
                          name: management-plane
                          namespace: argocd
                          finalizers:
                            - resources-finalizer.argocd.argoproj.io
                        spec:
                          project: default
                          source:
                            # Both patched from the composite. The
                            # literals are what an unpatched render
                            # shows and never reach a cluster.
                            repoURL: ""
                            targetRevision: ""
                            path: ""
                            helm:
                              # valuesObject rather than parameters, so
                              # the patches below address named keys.
                              # Both are filled from the composite;
                              # the values here are what an unpatched
                              # render would show, and never reach a
                              # cluster.
                              valuesObject:
                                code: ""
                                managementProjectId: ""
                                repoURL: ""
                                targetRevision: ""
                                pathPrefix: ""
                                manifestRepoURL: ""
                          destination:
                            server: https://kubernetes.default.svc
                          syncPolicy:
                            automated:
                              prune: true
                              selfHeal: true
                            # Long enough to outlast a package install.
                            # The provider configurations are of kinds
                            # those packages register, and Argo reports
                            # the packages applied well before they are
                            # installed.
                            retry:
                              limit: 10
                              backoff:
                                duration: 30s
                                factor: 2
                                maxDuration: 10m
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "argocd-%s-c-mgmt"
              # One index, because extraObjects is a list and this is
              # its only member. Everything past it is a named key.
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.values.extraObjects[0].spec.source.helm.valuesObject.code
              - fromFieldPath: spec.management.projectId
                toFieldPath: spec.forProvider.values.extraObjects[0].spec.source.helm.valuesObject.managementProjectId
              # Twice each: the root Application reads its own source,
              # and the chart's child Applications read the values it
              # passes them. One installation, one answer to where its
              # configuration comes from.
              #
              # Required, unlike every other patch here. Absence is
              # meaningful for billingAccountId and bootstrap, so those
              # are skipped and the base wins -- there is no
              # installation whose configuration comes from nowhere, so
              # a missing source here is a schema that was never
              # applied, and it should say so rather than compose an
              # empty URL nothing complains about.
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.management.source.repoURL
                toFieldPath: spec.forProvider.values.extraObjects[0].spec.source.repoURL
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.management.source.repoURL
                toFieldPath: spec.forProvider.values.extraObjects[0].spec.source.helm.valuesObject.repoURL
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.management.source.targetRevision
                toFieldPath: spec.forProvider.values.extraObjects[0].spec.source.targetRevision
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.management.source.targetRevision
                toFieldPath: spec.forProvider.values.extraObjects[0].spec.source.helm.valuesObject.targetRevision
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.management.source.pathPrefix
                toFieldPath: spec.forProvider.values.extraObjects[0].spec.source.path
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s/infra/helm/management-plane"
                  # A prefix of "." would otherwise hand Argo
                  # ./infra/... and leave normalising it to Argo.
                  - type: string
                    string:
                      type: TrimPrefix
                      trim: "./"
              - policy:
                  fromFieldPath: Required
                fromFieldPath: spec.management.source.pathPrefix
                toFieldPath: spec.forProvider.values.extraObjects[0].spec.source.helm.valuesObject.pathPrefix
              # Not Required: an installation with no manifest
              # repository composes no credential machinery, which is
              # what an empty value means to the chart.
              - fromFieldPath: spec.management.manifestRepoURL
                toFieldPath: spec.forProvider.values.extraObjects[0].spec.source.helm.valuesObject.manifestRepoURL
              - *plane-release-policies
              - *plane-release-config
          # ===================================================================
          # The platform's own identity. Created here, assumed by pods on
          # the management cluster through Workload Identity, and never
          # held by anyone -- the same property the bootstrap identity
          # has, arrived at differently.
          #
          # What it may do follows below, folder-scoped and
          # project-scoped.
          # ===================================================================
          - name: platform-identity
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ServiceAccount
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  displayName: Queenswood platform
                  description: Runs the management plane
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "sa-%s-platform"
              - fromFieldPath: spec.management.projectId
                toFieldPath: spec.forProvider.project
              # The account id is the external name, so it is stated
              # rather than generated: the Workload Identity member
              # string below has to spell the same address.
              - fromFieldPath: spec.code
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "sa-%s-platform"
          - name: platform-identity-workload-identity
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ServiceAccountIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/iam.workloadIdentityUser
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "sa-%s-platform-wi"
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.serviceAccountIdRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "sa-%s-platform"
              # serviceAccount:<project>.svc.id.goog[<namespace>/<ksa>]
              - fromFieldPath: spec.management.projectId
                toFieldPath: spec.forProvider.member
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "serviceAccount:%s.svc.id.goog[crossplane-system/crossplane-provider-gcp]"
          # ===================================================================
          # What the platform identity may do inside the installation --
          # which is everything this composition does, once the
          # management plane is the thing running it rather than the
          # boot plane.
          #
          # A fifth principal beside the four capabilities below, and
          # the reason it is composed here rather than there: its role
          # set is fixed and derived from what an installation builds,
          # where a capability's is keyed off whoever the manifest
          # names.
          #
          # Assembled from predefined roles rather than folderAdmin,
          # which is what GCP granted the boot identity for creating the
          # folder and is more than this should hold. Billing is not
          # here at all: the account sits above the folder, so
          # plane-billing-role binds it as a person.
          #
          # The member is spelled rather than referenced, as the
          # Workload Identity binding above spells it, and for the same
          # reason -- the account id is the identity's external name, so
          # both addresses are derivable from the code and the project.
          # ===================================================================
          # Creating a project makes the identity its owner, so an
          # instance project is administered by having built it rather
          # than by a folder-wide grant for every kind it holds.
          - name: platform-role-folder-project-creator
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: FolderIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/resourcemanager.projectCreator
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-platform-folder-project-creator"
              - &platform-folder-ref
                fromFieldPath: spec.code
                toFieldPath: spec.forProvider.folderRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "fldr-%s"
              # Two variables, so one patch: the account id is the
              # identity's external name and the project is where it
              # lives, and a second patch to the same field would
              # overwrite the first rather than complete it.
              - &platform-member
                type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.management.projectId
                  strategy: string
                  string:
                    fmt: "serviceAccount:sa-%s-platform@%s.iam.gserviceaccount.com"
                toFieldPath: spec.forProvider.member
          # Binds the four capabilities the access step composes, which
          # is the one role here that acts on people rather than on
          # infrastructure. Folder-scoped, so nothing it can grant
          # reaches outside the installation.
          - name: platform-role-folder-iam-admin
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: FolderIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/resourcemanager.folderIamAdmin
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-platform-folder-iam-admin"
              - *platform-folder-ref
              - *platform-member
          - name: platform-role-folder-compute-admin
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: FolderIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/compute.admin
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-platform-folder-compute-admin"
              - *platform-folder-ref
              - *platform-member
          - name: platform-role-folder-container-admin
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: FolderIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/container.admin
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-platform-folder-container-admin"
              - *platform-folder-ref
              - *platform-member
          - name: platform-role-folder-dns-admin
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: FolderIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/dns.admin
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-platform-folder-dns-admin"
              - *platform-folder-ref
              - *platform-member
          - name: platform-role-folder-cloudsql-admin
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: FolderIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/cloudsql.admin
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-platform-folder-cloudsql-admin"
              - *platform-folder-ref
              - *platform-member
          # Folder-scoped, though the durable bucket is in the
          # management project: a folder binding inherits into every
          # project under it, so one grant covers that bucket and
          # whatever an instance later holds, where the project form
          # would cover only the first.
          - name: platform-role-folder-storage-admin
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: FolderIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/storage.admin
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-platform-folder-storage-admin"
              - *platform-folder-ref
              - *platform-member
          # Org policy administration is not here, and cannot be: GCP
          # answers "Role roles/orgpolicy.policyAdmin is not supported
          # for this resource" at both folder and project scope, so it
          # is granted at the organisation, by a person, alongside the
          # billing role. See docs/plan/cloud-just-migration.md.
          # ===================================================================
          # Project-scoped, because what it governs is: Secret Manager
          # holds the durable tier's secrets in the management project.
          #
          # Named by id rather than by a reference to the composed
          # Project, as the access step's own project binding is -- the
          # literal is the form proven against this provider version.
          # ===================================================================
          - name: platform-role-project-secretmanager-admin
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/secretmanager.admin
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-platform-project-secretmanager-admin"
              - fromFieldPath: spec.management.projectId
                toFieldPath: spec.forProvider.project
              - *platform-member
          # ===================================================================
          # A second identity, for reading Secret Manager and nothing
          # else. The platform identity could do it -- it already holds
          # secretmanager.admin -- but it can also create projects and
          # administer every cluster in the folder, so an operator that
          # only needs to read a secret would be holding the whole
          # installation.
          #
          # secretAccessor rather than admin: reading a version is all
          # this does. Writing one is a person's act, from the
          # secretsAdmin capability.
          # ===================================================================
          # ===================================================================
          # The identity the cluster's nodes run as. Not the default
          # compute service account, which is the point: that account is
          # shared by everything in the project that never chose one, and
          # holds whatever the organisation's policy on automatic grants
          # leaves it holding -- nothing here, Editor in an organisation
          # that does not enforce the policy. The node pool asks for
          # cloud-platform scopes, so whatever it holds, every workload
          # on the cluster reaches through the metadata server.
          #
          # The roles below are what a GKE node needs to report itself
          # and nothing more. Whether logs and metrics are worth
          # shipping is a separate question, settled on the cluster's
          # logging and monitoring configuration rather than here: this
          # identity makes the choice available rather than making it.
          #
          # artifactregistry.reader is not among them. Every image this
          # plane runs comes from a public registry.
          # ===================================================================
          # ===================================================================
          # Reading a pod's logs, and nothing else. container.viewer does
          # not carry container.pods.getLogs, and the only predefined
          # role that does -- container.developer -- also grants exec,
          # port-forward and every write. Debugging a workload should not
          # require the power to change it.
          #
          # A project custom role rather than an organisation one, so an
          # installation built in an organisation we do not own needs
          # nothing from whoever does. The cost is that it grants on this
          # project alone; an instance project wants its own.
          #
          # Two spellings of one name: a GCP custom role id takes letters,
          # numbers, underscores and periods, and a Kubernetes name takes
          # hyphens and not underscores. The id is the external name.
          # ===================================================================
          - name: pod-log-reader-role
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectIAMCustomRole
              metadata:
                namespace: crossplane-system
                annotations:
                  crossplane.io/external-name: rl_pod_log_reader
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  title: Pod log reader
                  description: Reads container logs through the Kubernetes API, and changes nothing
                  permissions:
                    - container.pods.getLogs
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-rl-pod-log-reader"
              - fromFieldPath: spec.management.projectId
                toFieldPath: spec.forProvider.project
          # ===================================================================
          # The two the composition cannot run without, and could not
          # grant itself. Every ProjectIAMMember here needs
          # projects.setIamPolicy and every ProjectService needs
          # services.enable, and no folder role the platform identity
          # holds carries either -- so both work today only because the
          # boot plane owns the project it built.
          #
          # The circularity is why they are worth naming: the binding
          # that would repair a missing projects.setIamPolicy is itself
          # a ProjectIAMMember, so a plane that lost it could not grant
          # it back, and the boot plane that could is discarded at the
          # end of the pivot.
          # ===================================================================
          - name: platform-role-project-iam-admin
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/resourcemanager.projectIamAdmin
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-platform-project-iam-admin"
              - fromFieldPath: spec.management.projectId
                toFieldPath: spec.forProvider.project
              - *platform-member
          - name: platform-role-project-service-usage-admin
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/serviceusage.serviceUsageAdmin
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-platform-project-service-usage-admin"
              - fromFieldPath: spec.management.projectId
                toFieldPath: spec.forProvider.project
              - *platform-member
          # The composition creates three service accounts in this
          # project and could not do so on its own: no folder role it
          # holds carries iam.serviceAccounts.create, and it works today
          # only because the boot plane owns the project it built.
          - name: platform-role-project-service-account-admin
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/iam.serviceAccountAdmin
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-platform-project-service-account-admin"
              - fromFieldPath: spec.management.projectId
                toFieldPath: spec.forProvider.project
              - *platform-member
          # The platform identity has to be able to maintain a role this
          # composition creates.
          - name: platform-role-project-role-admin
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/iam.roleAdmin
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-platform-project-role-admin"
              - fromFieldPath: spec.management.projectId
                toFieldPath: spec.forProvider.project
              - *platform-member
          # The right to attach the node identity to a node pool. The
          # composed kind that makes that identity grants it nothing
          # here, because an instance's project was created by the
          # platform identity and an owner already holds this: the
          # plane's project was created by the seed, so the binding is
          # explicit and stays with the plane.
          #
          # The slot is named for the account, as the resource is: a
          # composed resource's name is how Crossplane tells one from
          # another, and changing the slot is the only way to build one
          # under a new metadata.name -- the composite records the old
          # one, and deleting the object just rebuilds it from that
          # record.
          #
          # The default compute service account gets the same right, and
          # for a reason that only shows up when a cluster is created
          # from this plane rather than from a boot plane: creating one
          # creates a default node pool first, whatever
          # removeDefaultNodePool does to it immediately afterwards, and
          # that pool runs as this account. Attaching it is an actAs, so
          # without this GCP refuses the create -- "the user does not
          # have access to service account <number>-compute@..." -- and
          # the refusal is in the managed resource's LastAsyncOperation
          # while the composite reads Synced.
          #
          # An instance never needs it: the platform identity created
          # that project, so it is owner there and holds actAs on
          # everything in it already. It did not create this one, the
          # seed did.
          - name: management-default-compute-user
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ServiceAccountIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/iam.serviceAccountUser
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "sa-%s-c-default-compute-user"
              # Required, so the binding is not composed at all until
              # the number is observed. A skipped patch would otherwise
              # name a service account that does not exist.
              - policy:
                  fromFieldPath: Required
                type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.management.projectId
                    - fromFieldPath: status.managementProjectNumber
                  strategy: string
                  string:
                    fmt: "projects/%s/serviceAccounts/%s-compute@developer.gserviceaccount.com"
                toFieldPath: spec.forProvider.serviceAccountId
              - *platform-member
          - name: management-nodes-user
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ServiceAccountIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/iam.serviceAccountUser
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "sa-%s-c-mgmt-nodes-user"
              # Resolved by name, across the composite that makes it:
              # a reference finds any managed resource in the namespace,
              # so neither composite has to know the other exists.
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.serviceAccountIdRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "sa-%s-c-mgmt-nodes"
              - *platform-member
          - name: secrets-identity
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ServiceAccount
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  displayName: Queenswood secrets reader
                  description: Reads Secret Manager for external-secrets
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "sa-%s-c-secrets"
              - fromFieldPath: spec.management.projectId
                toFieldPath: spec.forProvider.project
              - fromFieldPath: spec.code
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "sa-%s-c-secrets"
          - name: management-secrets-identity-wi
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ServiceAccountIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/iam.workloadIdentityUser
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "sa-%s-c-secrets-wi"
              - fromFieldPath: spec.code
                toFieldPath: spec.forProvider.serviceAccountIdRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "sa-%s-c-secrets"
              # The chart installs into its own namespace and names its
              # service account after itself.
              - fromFieldPath: spec.management.projectId
                toFieldPath: spec.forProvider.member
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "serviceAccount:%s.svc.id.goog[external-secrets/external-secrets]"
          # The container, not the value. A version is written by a
          # person holding secretsAdmin, from a key GitHub issued once
          # -- so what exists is declared and what it holds never
          # touches git. No Delete, like everything else here: losing
          # this is losing the plane's way into its own manifest.
          - name: github-app-secret
            base:
              apiVersion: secretmanager.gcp.m.upbound.io/v1beta1
              kind: Secret
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  replication:
                    auto: {}
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "sec-%s-c-github-app"
              # The secret's id is its external name -- there is no
              # secretId field -- and both the recipe that writes a
              # version and the ExternalSecret that reads one spell it,
              # so it is stated rather than left to default from the
              # Kubernetes name.
              - fromFieldPath: spec.code
                toFieldPath: metadata.annotations[crossplane.io/external-name]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "sec-%s-c-github-app"
              - fromFieldPath: spec.management.projectId
                toFieldPath: spec.forProvider.project
          - name: secrets-role-project-secret-accessor
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ProjectIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/secretmanager.secretAccessor
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-secrets-project-secret-accessor"
              - fromFieldPath: spec.management.projectId
                toFieldPath: spec.forProvider.project
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.management.projectId
                  strategy: string
                  string:
                    fmt: "serviceAccount:sa-%s-c-secrets@%s.iam.gserviceaccount.com"
                toFieldPath: spec.forProvider.member
    # =======================================================================
    # What each capability may do inside the installation, and nothing
    # about who holds it -- that is the manifest's access mapping, and
    # the principals in it belong to whoever owns the directory.
    # Organisation scope is bound by gcp-groups-bind; everything here is
    # folder or project scoped, so it belongs beside what it applies to.
    #
    # A separate step because the resources vary: none for a capability
    # the organisation does not provide, one per member per role where it
    # does. Patch-and-transform composes a fixed set.
    # =======================================================================
          # ===================================================================
          # Argo's own identity, and the first GCP power Argo has ever
          # had. Until now it read git and applied to the cluster it
          # runs on, which needs no cloud identity at all. Reaching an
          # instance's cluster does.
          #
          # What it may do lives on the instance rather than here: the
          # instance composition grants this account container.developer
          # on its own project, so Argo's reach grows one project at a
          # time and each grant is visible where the environment is
          # declared. container.developer rather than container.admin --
          # it reaches Kubernetes objects inside a cluster and cannot
          # create or delete the cluster itself, which stays with the
          # platform identity.
          # ===================================================================
          - name: argo-identity
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ServiceAccount
              metadata:
                namespace: crossplane-system
                labels:
                  # Published for an instance to find, rather than
                  # descriptive. An instance binds this account on its
                  # own project and needs the member string GCP minted
                  # here, which cannot travel as a reference. No
                  # installation in the value: a plane serves one, so
                  # this account is a singleton on the cluster and the
                  # label alone identifies it. The value is this
                  # resource's composition slot name, so the consumer's
                  # selector and the producer are one grep.
                  platform.repldriven.com/component: argo-identity
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  displayName: Queenswood Argo CD
                  description: Deploys workloads onto instance clusters
            patches:
              - &argo-name
                fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "sa-%s-c-argo"
              - &argo-project
                fromFieldPath: spec.management.projectId
                toFieldPath: spec.forProvider.project
              - *argo-name
          # Both halves of Workload Identity, and both Argo components
          # that need one. The controller applies, so without it nothing
          # deploys. The server reads for the UI, and a console that
          # cannot see an instance's resources is how somebody ends up
          # on the cluster by hand.
          - name: argo-identity-wi-controller
            base: &argo-wi-base
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ServiceAccountIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/iam.workloadIdentityUser
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "sa-%s-c-argo-wi-controller"
              - &argo-wi-ref
                fromFieldPath: spec.code
                toFieldPath: spec.forProvider.serviceAccountIdRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "sa-%s-c-argo"
              - fromFieldPath: spec.management.projectId
                toFieldPath: spec.forProvider.member
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "serviceAccount:%s.svc.id.goog[argocd/argocd-application-controller]"
          - name: argo-identity-wi-server
            base:
              apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
              kind: ServiceAccountIAMMember
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  role: roles/iam.workloadIdentityUser
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "sa-%s-c-argo-wi-server"
              - *argo-wi-ref
              - fromFieldPath: spec.management.projectId
                toFieldPath: spec.forProvider.member
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "serviceAccount:%s.svc.id.goog[argocd/argocd-server]"
          # ===================================================================
          # The Kubernetes half, and the reason it is composed rather
          # than set in Argo's own chart values: the Release that
          # installs Argo is Observe here, so only a boot plane can
          # change it. Annotating the service account is what a running
          # plane can do about its own Argo, and it is why
          # provider-kubernetes exists on this plane.
          #
          # An annotation the chart does not set, so nothing else claims
          # the field. Without it a token minted for these accounts is
          # exchangeable for nothing.
          # ===================================================================
          - name: argo-ksa-controller
            base: &argo-ksa-base
              apiVersion: kubernetes.m.crossplane.io/v1alpha1
              kind: Object
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ServiceAccount
                    metadata:
                      name: argocd-application-controller
                      namespace: argocd
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argo-ksa-controller"
              - &argo-ksa-annotation
                type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.code
                    - fromFieldPath: spec.management.projectId
                  strategy: string
                  string:
                    fmt: "sa-%s-c-argo@%s.iam.gserviceaccount.com"
                toFieldPath: spec.forProvider.manifest.metadata.annotations[iam.gke.io/gcp-service-account]
          - name: argo-ksa-server
            base:
              apiVersion: kubernetes.m.crossplane.io/v1alpha1
              kind: Object
              metadata:
                namespace: crossplane-system
              spec:
                managementPolicies:
                  - Observe
                  - Create
                  - Update
                  - LateInitialize
                providerConfigRef:
                  kind: ClusterProviderConfig
                  name: default
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ServiceAccount
                    metadata:
                      name: argocd-server
                      namespace: argocd
            patches:
              - fromFieldPath: spec.code
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argo-ksa-server"
              - *argo-ksa-annotation
    # =======================================================================
    # The recovery project: backups, the key they are encrypted under,
    # and the exports that outlive the databases they came from. Beside
    # the management project rather than inside it, so the identity
    # that reconciles the platform is not also the one that can empty
    # what the platform would be rebuilt from. Inside the folder rather
    # than above it: creating a project at the organisation needs
    # rights an installation hosted in somebody else's will not have.
    #
    # The plane composes the project and leaves it empty. Each instance
    # composes its own bucket and its own backup key in it, so one
    # instance's identity is granted on its own backups and reaches no
    # other's.
    #
    # Templated rather than patched because the id is stated once for
    # the installation, in its EnvironmentConfig, and both composites
    # resolve it the same way -- environment first, then the manifest's
    # own field if it names one. A Required patch could switch the
    # block off when one source is absent but not when either is, which
    # is what "stated in either place" needs.
    # =======================================================================
    - step: recovery
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $code := $xr.spec.code }}
            {{- $env := index .context "apiextensions.crossplane.io/environment" | default dict }}
            {{- $recovery := dig "recovery" dict $xr.spec }}
            {{- /* This manifest's own field, and nowhere else. The plane
                   is the only thing that reads it -- it is what says
                   which project to compose -- so it is authored here
                   beside management.projectId, the other id minted once
                   and then permanent. An instance reads the id off the
                   Project this composes rather than from a second copy
                   of it. */}}
            {{- $project := dig "projectId" "" $recovery }}
            {{- if $project }}
            ---
            apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
            kind: Project
            metadata:
              name: {{ printf "prj-%s-c-recovery" $code }}
              namespace: crossplane-system
              labels:
                # Published for an instance to find, as the Argo
                # identity is. An instance puts its backups bucket in
                # this project and borrows the bucket's suffix from the
                # id. A singleton on the plane, so the slot name alone
                # tells it from the other project composed here.
                platform.repldriven.com/component: recovery-project
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: recovery-project
                {{- with dig "adopt" "" $recovery }}
                # Adoption only. Set before the project exists, the
                # first observation fails with permission denied --
                # which Crossplane cannot tell from a real error, so it
                # never creates.
                crossplane.io/external-name: {{ . | quote }}
                {{- end }}
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                projectId: {{ $project | quote }}
                name: {{ dig "displayName" (printf "prj-%s-c-recovery" $code) $recovery | quote }}
                autoCreateNetwork: false
                deletionPolicy: PREVENT
                folderIdRef:
                  name: {{ printf "fldr-%s" $code | quote }}
                {{- $billing := dig "billingAccountId" (dig "billingAccountId" "" $env) $xr.spec }}
                {{- with $billing }}
                billingAccount: {{ . | quote }}
                {{- end }}
            ---
            # Cloud Storage in it. Enabled by default on a new project,
            # and declared anyway so nothing depends on that holding.
            apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
            kind: ProjectService
            metadata:
              name: {{ printf "svc-%s-c-recovery-storage" $code }}
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: recovery-service-storage
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                project: {{ $project | quote }}
                service: storage.googleapis.com
                # Leaving an API enabled on the way down is harmless and
                # avoids a dependent-resource cascade.
                disableOnDestroy: false
            ---
            # Secret Manager in it, for the key each instance's backups
            # are encrypted under. Not enabled by default on a new
            # project, unlike Cloud Storage: the entry reconciles as a
            # 403 naming the API rather than as anything about the
            # entry, and the composite goes on reporting Ready because
            # every other resource in it is.
            apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
            kind: ProjectService
            metadata:
              name: {{ printf "svc-%s-c-recovery-secretmanager" $code }}
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: recovery-service-secretmanager
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                project: {{ $project | quote }}
                service: secretmanager.googleapis.com
                disableOnDestroy: false
            {{- $region := dig "region" (dig "region" "" $env) $xr.spec }}
            {{- if $region }}
            {{- /* The plane's own records: what a hibernated or lost plane
                   held, written by `just plane-record`. Here rather than
                   in the management project for the reason the project
                   is: the plane is what these describe. The suffix is
                   the recovery project's, as an instance's backups
                   bucket borrows it. */}}
            {{- $bucket := printf "bkt-%s-c-mgmt-records-%s" $code (last (splitList "-" $project)) }}
            ---
            apiVersion: storage.gcp.m.upbound.io/v1beta1
            kind: Bucket
            metadata:
              name: {{ $bucket }}
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: recovery-plane-records
                crossplane.io/external-name: {{ $bucket }}
            spec:
              # Without Delete, like the project it sits in: deleting
              # the managed resource orphans the records rather than
              # emptying them.
              managementPolicies:
                - Observe
                - Create
                - Update
                - LateInitialize
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                project: {{ $project | quote }}
                location: {{ $region | upper | quote }}
                storageClass: STANDARD
                uniformBucketLevelAccess: true
                publicAccessPrevention: enforced
                # Every record is written under a prefix of its own and
                # never overwritten, so a delete is the only loss, and
                # this keeps one recoverable for a week.
                softDeletePolicy:
                  retentionDurationSeconds: 604800
            {{- end }}
            ---
            apiVersion: platform.repldriven.com/v1alpha1
            kind: XManagementPlane
            status:
              recoveryProjectId: {{ $project | quote }}
            {{- end }}
    - step: access
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource }}
            {{- $code := $xr.spec.code }}
            {{- /* The installation's mapping, overridden per capability by
                   this manifest's own field where it names one. Stated
                   once for the subsidiary, the plane and every instance,
                   because it is one mapping and each binds the subset it
                   can. */}}
            {{- $envAccess := dig "access" dict (index .context "apiextensions.crossplane.io/environment" | default dict) }}
            {{- $ownAccess := dig "access" dict $xr.spec }}
            {{- $project := dig "management" "projectId" "" $xr.spec }}
            {{- /* platformViewer appears twice. Its folder-scoped roles
                   are predefined; the project-scoped one is a custom
                   role carrying container.pods.getLogs, which
                   container.viewer lacks and only container.developer
                   otherwise provides -- along with exec and every
                   write. A project custom role may be granted only on
                   its own project, so it cannot join the folder entry.

                   A comment cannot go inside the list expression
                   below: a template action does not nest inside
                   another action's operand, and the whole step fails
                   to parse. */}}
            {{- $capabilities := list
                  (dict "key" "platformAdmin" "kind" "ServiceAccountIAMMember" "roles" (list
                    "roles/iam.serviceAccountTokenCreator"))
                  (dict "key" "secretsAdmin" "kind" "ProjectIAMMember" "roles" (list
                    "roles/secretmanager.admin"))
                  (dict "key" "platformViewer" "kind" "ProjectIAMMember" "roles" (list
                    (printf "projects/%s/roles/rl_pod_log_reader" $project))) }}
            {{- range $capability := $capabilities }}
            {{- range $member := dig $capability.key (dig $capability.key list $envAccess) $ownAccess }}
            {{- range $role := $capability.roles }}
            {{- /* Hashed, not indexed: a member removed from the middle of
                   the list would otherwise renumber the ones after it, and
                   Crossplane would delete and recreate live bindings. */}}
            {{- /* A custom role is named projects/<id>/roles/<name>, so
                   the last segment is what identifies it -- a slug
                   built from the whole string would carry slashes and
                   not be a Kubernetes name. */}}
            {{- $slug := printf "%s-%s"
                  ($role | splitList "/" | last | replace "." "-" | replace "_" "-" | lower)
                  (sha256sum $member | trunc 8) }}
            {{- $resource := printf "access-%s-%s" (kebabcase $capability.key) $slug }}
            ---
            apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
            kind: {{ $capability.kind }}
            metadata:
              name: {{ printf "%s-%s" $code $resource }}
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $resource }}
            spec:
              # With Delete, unlike everything the step above composes:
              # a principal dropped from the access mapping has to lose
              # the binding in GCP, not just the resource naming it.
              managementPolicies:
                - Observe
                - Create
                - Update
                - LateInitialize
                - Delete
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                role: {{ $role | quote }}
                member: {{ $member | quote }}
            {{- if eq $capability.kind "ProjectIAMMember" }}
                project: {{ $project | quote }}
            {{- else if eq $capability.kind "ServiceAccountIAMMember" }}
                serviceAccountIdRef:
                  name: {{ printf "sa-%s-platform" $code | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- /* secretsAdmin again, on the recovery project. It is a
                   second project and a binding on the management one
                   reaches nothing in it, so without this the entries
                   the instances compose there are containers nobody
                   may write a version to.

                   Two narrow roles rather than the secretmanager.admin
                   the management project grants: viewer sees the
                   container, secretVersionAdder adds to it, and
                   neither carries versions.access -- so whoever writes
                   a backup key here cannot read one back, which is the
                   shape an instance's own entries already take. */}}
            {{- $recoveryProject := dig "recovery" "projectId" "" $xr.spec }}
            {{- if $recoveryProject }}
            {{- range $member := dig "secretsAdmin" (dig "secretsAdmin" list $envAccess) $ownAccess }}
            {{- range $role := (list "roles/secretmanager.viewer" "roles/secretmanager.secretVersionAdder") }}
            {{- $slug := printf "%s-%s"
                  ($role | splitList "/" | last | replace "." "-" | lower)
                  (sha256sum $member | trunc 8) }}
            {{- $resource := printf "access-recovery-secrets-admin-%s" $slug }}
            ---
            apiVersion: cloudplatform.gcp.m.upbound.io/v1beta1
            kind: ProjectIAMMember
            metadata:
              name: {{ printf "%s-%s" $code $resource }}
              namespace: crossplane-system
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: {{ $resource }}
            spec:
              managementPolicies:
                - Observe
                - Create
                - Update
                - LateInitialize
                - Delete
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                project: {{ $recoveryProject | quote }}
                role: {{ $role | quote }}
                member: {{ $member | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
    # =======================================================================
    # Readiness for whatever the template steps composed. Last, and not
    # optional: patch-and-transform sets readiness only for the resources
    # it composes itself, and go-templating sets none at all, so without
    # this the access bindings are never ready in the desired state. The
    # composite then sits at Creating however healthy GCP is -- every
    # managed resource Ready, nine unready names in the message, and a
    # wait on the composite that can only time out.
    # =======================================================================
    - step: auto-ready
      functionRef:
        name: function-auto-ready
