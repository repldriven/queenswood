apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xqueenswoodinstances.queenswood.repldriven.com
spec:
  scope: Namespaced
  group: queenswood.repldriven.com
  names:
    kind: XQueenswoodInstance
    plural: xqueenswoodinstances
  defaultCompositionRef:
    name: xqueenswoodinstance.gcp
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          description: |
            One environment of the bank inside an installation: its own
            project, network, cluster and database, and in time the
            workloads that run on it.

            Its own composite rather than a field on the plane's,
            because a composite is a unit of replacement and rebuilding
            a control plane should not reach a production database. See
            ADR-0024. The plane still reconciles this -- it is what
            reconciles everything -- and the group says who owns the
            kind rather than who runs it.

            The installation is the folder, named by code; this is one
            environment inside it.
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: >-
                    !has(self.cluster) || !has(self.cluster.shelved) || !self.cluster.shelved || self.state == 'down'
                  message: an instance is shelved only when down
              required:
                - code
                - env
                - label
                - projectId
              properties:
                code:
                  type: string
                  pattern: '^[a-z0-9]{4}$'
                  description: |
                    The installation's four-character code -- the same
                    string the plane's manifest carries. Every name
                    derives from it, and it is how this instance finds
                    the folder it belongs in without being told the
                    numeric id. See ADR-0023.
                env:
                  type: string
                  pattern: '^[dnp]$'
                  description: |
                    One letter: d dev, n nonprod, p prod. Not b or c --
                    those are the bootstrap and common tiers, which no
                    instance occupies.

                    A test environment is nonprod with a label saying
                    so. Adding a letter means amending cloud-naming
                    first, which asks for a paragraph rather than a
                    pull request.
                label:
                  type: string
                  pattern: '^[a-z][a-z0-9-]{0,12}$'
                  description: |
                    What this environment is for, within its tier:
                    test, uat, prod. Follows env in every name the
                    composition builds.
                state:
                  type: string
                  enum:
                    - up
                    - down
                  default: up
                  description: |
                    Whether this environment is running. Off is a
                    desired state rather than an absence of one:
                    Crossplane reconciles toward what is declared and
                    has no notion of stopped, so down is spelled and
                    reconciled like anything else. See ADR-0022.

                    down is the node pool at zero. The cluster, the
                    project, its data, the network and the identities
                    stand; what stops is everything that runs on a node,
                    which is where the bill is. In time it also takes
                    CloudSQL to activationPolicy NEVER -- stopping the
                    database rather than deleting it, because the
                    project is durable and keeps what it holds.

                    An instance is created up and stopped afterwards.
                    Cloud SQL refuses to create an instance already
                    stopped -- 400 invalidOperation, "This operation is
                    not valid for this instance" -- so a manifest that
                    says down before the database exists composes an
                    instance that never finishes. Nothing here can work
                    around it: even a templating step that withheld the
                    field until the instance existed would still have
                    created it running and then stopped it, so the
                    behaviour would be the same and only the error
                    would be kinder.

                    draining is not here. ADR-0024 says an instance may
                    ship with up and down before the ordered teardown is
                    trustworthy, and its precondition -- an unattended
                    Keycloak restore -- is not met.

                    Defaulted rather than required, because the
                    manifests that set it live in another repository and
                    a newly required field invalidates them all at once.
                region:
                  type: string
                  description: |
                    Where this environment runs. Taken from the
                    installation's EnvironmentConfig, which states it
                    once for every instance; set here only to put one
                    instance somewhere else. Not defaulted: a default
                    is indistinguishable from a deliberate value, so it
                    would silently win over the environment.

                    The plane's region has no authority over an
                    instance's -- what the plane reconciles is API
                    calls, which are not regional -- so both read the
                    installation's rather than one reading the other.
                regionCode:
                  type: string
                  description: |
                    The region, abbreviated, as it appears in the name
                    of anything regional. GCP publishes no short form,
                    so it is stated rather than derived -- in the
                    installation's EnvironmentConfig, and here only to
                    override it for one instance.
                zone:
                  type: string
                  description: |
                    Where the cluster's control plane and its nodes sit.
                    Taken from the installation's EnvironmentConfig; set
                    here only to put one instance elsewhere.
                    Zonal rather than regional: a regional cluster
                    replicates the node count into every zone it spans,
                    so the same pool costs three times as much, and an
                    environment that survives a zone going away is not
                    what a test instance is for.

                    Not defaulted for the same reason region is not,
                    even though no name carries it: moving it rebuilds
                    the cluster, so it is stated rather than assumed.
                access:
                  type: object
                  default: {}
                  description: |
                    Who may look at this environment. Per instance
                    rather than inherited from the plane, because the
                    plane's access mapping is on its own composite and
                    neither composite reaches into the other -- and
                    because a nonprod environment and a production one
                    should not have to share an answer.
                  properties:
                    platformViewer:
                      type: array
                      description: |
                        Principals granted the pod-log-reader role in
                        this project, as whole IAM member strings.

                        The role exists because no predefined one fits:
                        container.viewer does not carry
                        container.pods.getLogs, and container.developer
                        does but also grants exec, port-forward and
                        every write. The plane composes the same role
                        for its own project; an instance's clusters are
                        in a different one, so reading a log there
                        meant joining clusterAdmin until now.

                        Empty binds nothing, which is what an
                        installation with no named viewers wants.
                      items:
                        type: string
                        pattern: '^(user|group|serviceAccount|domain):.+$'
                    platformAdmin:
                      type: array
                      description: |
                        Who administers this instance, as whole IAM
                        member strings.

                        Holds the rights a person needs and no
                        automation ever will. Creating the OAuth client
                        Google sign-in runs on is a console act with no
                        API behind it -- Google exposes none for a web
                        client with a chosen redirect URI -- so the job
                        cannot be given to an identity, and the right
                        has to sit with whoever does it.

                        Separate from platformViewer because creating a
                        client mints a credential that speaks for this
                        installation to Google, and a capability called
                        viewer should not.
                      items:
                        type: string
                        pattern: '^(user|group|serviceAccount|domain):.+$'
                    secretsAdmin:
                      type: array
                      description: |
                        Who writes this instance's secret versions, as
                        whole IAM member strings.

                        The composite composes each Secret Manager entry
                        as a container and never a value, so somebody has
                        to put the version in -- and until this existed
                        nobody could, because the plane's secretsAdmin
                        binds on the management project and an
                        instance's entries are in its own.

                        Two roles, and deliberately not
                        secretmanager.admin the way the plane's does it:
                        viewer to see the container, secretVersionAdder
                        to add to it. That is the whole act. It carries
                        no versions.access, so a person who writes a
                        secret cannot read one back, and it destroys
                        nothing -- rotation is a new version, and the
                        entries are composed with no Delete precisely so
                        that losing one is not a thing anybody can do.

                        Empty binds nothing, which leaves the entries
                        unwritable and their consumers holding an empty
                        Secret.
                      items:
                        type: string
                        pattern: '^(user|group|serviceAccount|domain):.+$'
                network:
                  type: object
                  default: {}
                  description: |
                    The ranges this environment occupies. Identical in
                    every instance by default, which is safe only while
                    the VPCs are isolated: the day two instances peer,
                    or one peers with the plane, they collide. A range
                    is immutable, so moving one rebuilds the subnet and
                    the cluster -- state them per instance before that
                    day rather than after it.
                  properties:
                    subnetCidr:
                      type: string
                      default: 10.10.0.0/16
                      description: |
                        Where the nodes sit.
                    podsCidr:
                      type: string
                      default: 10.20.0.0/16
                      description: |
                        The secondary range GKE allocates pod addresses
                        from. Sized for pods rather than nodes: every
                        pod takes one.
                    servicesCidr:
                      type: string
                      default: 10.30.0.0/20
                      description: |
                        The secondary range for ClusterIP services.
                    proxyCidr:
                      type: string
                      default: 10.40.0.0/24
                      description: |
                        Where a regional load balancer puts its
                        proxies. Its own subnet because GCP requires one
                        per region reserved for the purpose.
                    psaPrefixLength:
                      type: integer
                      default: 16
                      description: |
                        How much address space this VPC lends Google for
                        private services access. Cloud SQL is allocated
                        from it, and so is anything else reached
                        privately, so it is sized for the tenants rather
                        than for the database.
                cluster:
                  type: object
                  default: {}
                  description: |
                    The shape of the cluster. Grouped rather than flat
                    because an instance has more than one thing with a
                    size: diskSize alone would not say whose.
                  properties:
                    machineType:
                      type: string
                      default: e2-standard-2
                      description: |
                        What the nodes are. Immutable, so changing it
                        replaces the pool and restarts everything on the
                        cluster.

                        The floor for the bank rather than a measured
                        answer. An empty cluster already requests about
                        a third of a node's CPU for system daemons, so
                        the usable share is smaller than the shape
                        suggests.
                    nodeCount:
                      type: integer
                      default: 3
                      description: |
                        How many nodes when the instance is up. down is
                        zero regardless, which is why this is a count
                        rather than a desired state.
                    diskSize:
                      type: integer
                      default: 50
                      description: |
                        Each node's boot disk, in GB. Nothing durable
                        belongs on it: a node is replaced rather than
                        resumed, so anything stateful takes a
                        PersistentVolume.
                    diskType:
                      type: string
                      default: pd-standard
                      description: |
                        Boot disks only, so the cheapest class is
                        usually right.
                    releaseChannel:
                      type: string
                      default: REGULAR
                      description: |
                        Which GKE release channel upgrades this cluster.
                        RAPID, REGULAR or STABLE.
                    upgradeSettings:
                      type: object
                      default: {}
                      description: |
                        How the node pool is upgraded. Stated rather
                        than left to GKE: unset, the provider observes
                        whatever defaults applied when the pool was made
                        and late-initialises them into the spec, so the
                        behaviour reads as declared while nobody chose
                        it and a later rebuild starts from whatever the
                        defaults are then.
                      properties:
                        strategy:
                          type: string
                          default: SURGE
                          description: |
                            SURGE adds nodes and drains the old ones.
                            BLUE_GREEN builds the replacement pool
                            whole, which costs a second pool's capacity
                            for the length of the upgrade.
                        maxSurge:
                          type: integer
                          default: 1
                          description: |
                            How many nodes may be added beyond
                            nodeCount while upgrading.
                        maxUnavailable:
                          type: integer
                          default: 0
                          description: |
                            How many nodes may be taken down before
                            their replacements are ready.
                    shelved:
                      type: boolean
                      default: false
                      description: |
                        Whether the cluster exists at all. True deletes
                        the cluster and its pool, and everything on them
                        -- FoundationDB's volumes included, so its data
                        comes back from a backup rather than from a disk.
                        The project, the network, the identities, the
                        database, the address, the secrets and the
                        backups stand.

                        Not a value of state, and not spelled like one:
                        down is reversible and loses nothing, and this
                        destroys what it stops. Only an instance already
                        down may be shelved, and the workloads come off
                        the cluster first, or their disks and load
                        balancers outlive it. See ADR-0029 and the
                        instance-shelve recipe.
                keycloak:
                  type: object
                  default: {}
                  description: |
                    What Keycloak runs on. Named for what owns it rather
                    than for the kind: FoundationDB is the bank's own
                    store and takes a section of its own when it
                    arrives, and neither should be "the database".
                  properties:
                    database:
                      type: object
                      default: {}
                      properties:
                        tier:
                          type: string
                          default: db-custom-1-3840
                          description: |
                            One vCPU and 3840MB, the smallest shape
                            ENTERPRISE accepts -- ENTERPRISE_PLUS
                            refuses a custom shape entirely.
                        version:
                          type: string
                          default: POSTGRES_18
                          description: |
                            Immutable downward: Cloud SQL upgrades a
                            major version in place and never returns.
                        edition:
                          type: string
                          default: ENTERPRISE
                          description: |
                            ENTERPRISE or ENTERPRISE_PLUS. The latter
                            takes only named machine shapes.
                        diskSize:
                          type: integer
                          default: 10
                          description: |
                            In GB, and a floor rather than a ceiling:
                            diskAutoresize grows it and nothing shrinks
                            it again.
                        diskType:
                          type: string
                          default: PD_HDD
                          description: |
                            PD_HDD or PD_SSD. Keycloak's working set is
                            small and mostly cached.
                        availabilityType:
                          type: string
                          default: ZONAL
                          description: |
                            ZONAL or REGIONAL. REGIONAL keeps a standby
                            in a second zone and roughly doubles the
                            cost, and is the difference between an
                            environment that survives a zone and one
                            that does not.
                        backupEnabled:
                          type: boolean
                          default: true
                          description: |
                            Cloud SQL's own scheduled backup, which is
                            separate from anything FoundationDB does.
                        pointInTimeRecovery:
                          type: boolean
                          default: false
                          description: |
                            Write-ahead log retention, so a restore can
                            name a moment rather than a backup. Costs
                            storage continuously.
                        client:
                          type: object
                          default: {}
                          description: |
                            The Kubernetes service account that reaches
                            this database, which the composition binds
                            to the cloud identity it composes for it.
                            Kubernetes rather than a cloud's vocabulary
                            on purpose: every cloud has a mechanism for
                            trusting one, and none of them agree on what
                            it is called.

                            Whatever creates that account decides these
                            two strings, so they belong beside the
                            Application that installs it rather than in
                            the composition, which would otherwise hold
                            a copy that a rename elsewhere makes wrong
                            without making anything say so.
                          properties:
                            namespace:
                              type: string
                              default: queenswood
                            serviceAccount:
                              type: string
                              default: queenswood-cloudsql-proxy
                            grantServiceAccount:
                              type: string
                              default: queenswood-sql-grant
                              description: |
                                The account the grant Job runs as, which
                                is not the workload's: giving a database
                                its user's rights is not something that
                                user should be able to do.
                ingress:
                  type: object
                  default: {}
                  description: |
                    Where this instance is reached from the internet:
                    an address, the names that resolve to it, and the
                    certificates that terminate them. Absent composes
                    none of it, which is an instance that runs and is
                    not published -- a valid state, and the one every
                    instance starts in.

                    Not "apex". An apex is the root of a zone, and this
                    sits well below one.
                  properties:
                    domain:
                      type: string
                      description: |
                        This instance's own name, fully qualified, with
                        no trailing dot -- test.example.com. Every
                        service it publishes sits beneath it, so one
                        wildcard certificate covers all of them and one
                        DNS authorization covers both.
                    zone:
                      type: object
                      description: |
                        The zone the records are written into, which
                        the plane holds rather than this instance --
                        the zone outlives every instance in the
                        installation.

                        Stated rather than derived. Two composites have
                        to spell one name and only one of them makes
                        it, so the other is told.
                      properties:
                        name:
                          type: string
                          description: The ManagedZone's name on the plane.
                        project:
                          type: string
                          description: |
                            The project holding the zone, which is the
                            management project rather than this
                            instance's.
                    subdomains:
                      type: array
                      default:
                        - api
                        - console
                        - keycloak
                      items:
                        type: string
                      description: |
                        Names beneath the domain, each an A record to
                        the same address. What answers on each is the
                        chart's business; that they resolve is this
                        composite's.

                        The domain itself gets no record. Nothing
                        serves it over HTTPS, and giving it to the
                        console would be a second origin for an SPA
                        whose redirect URIs a realm import makes
                        permanent.
                projectId:
                  type: string
                  pattern: '^[a-z][a-z0-9-]{4,28}[a-z0-9]$'
                  description: |
                    The project's id, generated once and then carried
                    here. A project id is consumed permanently and
                    cannot be undeleted into usefulness, so a composite
                    that invented one on every reconcile would strand
                    the last.

                    prj-<code>-<env>-<label>-<suffix>, the suffix six
                    hex characters because a project id is globally
                    unique.
                recovery:
                  type: object
                  description: |
                    Where this instance keeps what it would be rebuilt
                    from. The plane composes the project and leaves it
                    empty; each instance composes its own bucket in it,
                    so one instance's identity is granted on its own
                    backups and reaches no other's.

                    Normally left absent: the id is read off the
                    Project the plane composed, found by the label it
                    publishes, so nothing has to be told what the
                    plane already knows. This is the override, for an
                    instance keeping its backups somewhere else.

                    The composite is never read -- only a resource it
                    labelled, which is the distinction this XRD already
                    draws for the folder. What the label finds is a
                    singleton, because a plane serves one installation.

                    Named in neither place composes no bucket, which is
                    an instance keeping nothing.
                  properties:
                    projectId:
                      type: string
                      pattern: '^[a-z][a-z0-9-]{4,28}[a-z0-9]$'
                      description: |
                        The installation's recovery project, as
                        `management`'s manifest spells it.
                    location:
                      type: string
                      description: |
                        Where the bucket lives, defaulting to this
                        instance's region. A backup in the region it
                        backs up does not survive losing that region; a
                        multi-region costs more and answers the S3
                        interop endpoint under a region name of its
                        own, which the backup agent signs over and so
                        is not free to change later.
                adopt:
                  type: string
                  pattern: '^projects/[a-z][a-z0-9-]{4,28}[a-z0-9]$'
                  description: |
                    An existing project to take over, written
                    projects/<id> -- the prefixed form Crossplane
                    records as the external name.

                    Separate from projectId because creation and
                    adoption cannot share a field: GCP answers
                    permission denied, never not found, for a project
                    id you do not own, so an external name set before
                    the project exists makes the first observation fail
                    and creation never follows.
                displayName:
                  type: string
                  description: |
                    What the project is called for humans. Defaults to
                    its id without the suffix.
                billingAccountId:
                  type: string
                  description: |
                    The billing account to charge, where this instance
                    is charged somewhere other than the rest of the
                    installation. Normally absent: the account comes
                    from the installation's EnvironmentConfig, and this
                    overrides it.

                    The platform identity holds billing.user on the
                    account rather than the composition granting it:
                    an account sits above the folder, so the grant is
                    made once by an administrator of it. See
                    plane-billing-role.
            status:
              type: object
              properties:
                backupsBucket:
                  type: string
                  description: |
                    This instance's bucket in the installation's
                    recovery project. A workload writing to it cannot
                    derive the name: the suffix belongs to that project
                    rather than to this instance.
                backupServiceAccount:
                  type: string
                  description: |
                    The identity the S3-to-GCS proxy runs as, which the
                    chart's service account annotation has to spell.
                fdbBackupKeySecret:
                  type: string
                  description: |
                    The Secret Manager entry holding the key this
                    instance's backups are encrypted under, in the
                    recovery project. A container with no version until
                    somebody writes one.
                projectId:
                  type: string
                  description: |
                    The project as Crossplane records it,
                    projects/<id>. Read back rather than committed.
                databaseConnectionName:
                  type: string
                  description: |
                    project:region:instance, which is what a Cloud SQL
                    client is pointed at rather than an address. Read
                    back rather than committed.
                clusterCa:
                  type: string
                  description: |
                    The cluster's certificate authority, base64 as GKE
                    records it. Read back rather than committed, and
                    public rather than secret -- it is what a client
                    checks the API server against, not anything that
                    authenticates one.

                    Here because Argo's registration needs it and a
                    patch reads from the composite, so it travels up
                    from the cluster and back down to the Secret.
                clusterEndpoint:
                  type: string
                  description: |
                    The cluster's API server address. Read back rather
                    than committed, and the one thing here anything
                    outside the composite needs -- a kubeconfig for it
                    is written to a Secret beside the composed cluster,
                    which is what provider-helm reads when the workloads
                    arrive.
