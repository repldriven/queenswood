# The instance, as cloud-naming spells it. Every name here derives from
# the three together, and has to spell what the instance composition
# spelled -- the Secret Manager entries in particular, which are matched
# literally.
code: ""
env: ""
label: ""

# The project those entries live in. An instance's own, not the
# management project: the composite enables Secret Manager here and
# grants the instance's secrets identity accessor on this project.
projectId: ""

# The installation's recovery project, where this instance's backups
# and the key they are encrypted under live. A different project, so it
# needs a store of its own: the instance's secrets identity is granted
# on that one entry rather than project-wide. Empty renders neither the
# store nor what reads through it.
recoveryProjectId: ""

keycloak:
  # Keycloak's files-plaintext vault, materialised from Secret Manager.
  # Each key becomes a file in the mount named <realm>_<key>, so the
  # queenswood realm's ${vault.google-client-secret} reads
  # queenswood_google-client-secret.
  #
  # The name and the realm both have to match what the queenswood chart
  # mounts and imports -- keycloak.vault.secretName and keycloak.realm
  # there.
  vault:
    enabled: true
    secretName: queenswood-keycloak-vault
    realm: queenswood

  # Keycloak's bootstrap admin, materialised from Secret Manager so the
  # credential outlives the cluster. The name has to match what the
  # queenswood chart puts in `spec.bootstrapAdmin.user.secret` and what
  # the realm-import Job reads.
  #
  # Not `queenswood-keycloak-admin`, which is a different credential
  # entirely: the signing pair for the `queenswood-admin` client, an
  # Opaque Secret the queenswood chart declares and its bootstrap Job
  # fills. Pointed at that one, this materialises nothing -- a Secret's
  # type is immutable, so it fails as `could not update secret` -- and
  # would replace the pair rather than fail if the types ever agreed.
  # The queenswood chart refuses the collision outright.
  bootstrapAdmin:
    enabled: true
    secretName: queenswood-keycloak-bootstrap-admin

mail:
  # The submission provider's password, materialised from
  # sec-<instance>-smtp under `password`. The name has to match the
  # queenswood chart's `mail.smtp.passwordSecret`. Enable once the entry
  # holds a version.
  smtp:
    enabled: false
    secretName: queenswood-smtp

fdb:
  backup:
    # Its own Secret, mounted beside the one holding the pair FDB
    # presents to the proxy. No release prefix, because the FDB
    # operator mounts it too and a subchart cannot see the release
    # name.
    key:
      enabled: true
      secretName: fdb-backup-encryption-key
