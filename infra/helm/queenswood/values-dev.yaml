# Dev overrides for kind + Tilt.
#
# Tilt rewrites every image ref in the rendered manifest to the tag
# of the image it just built, so `image.tag` here is only a
# placeholder. `pullPolicy: Never` keeps kubelet from racing Tilt to
# pull from ghcr.io; Tilt loads the freshly built image into kind
# directly.

image:
  tag: "dev"
  pullPolicy: Never

# Invitation emails land in Mailpit rather than leaving the cluster.
mail:
  catcher:
    enabled: true
