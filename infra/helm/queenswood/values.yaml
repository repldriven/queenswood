# -- Container image registry + tag shared by every Queenswood service.
# The image NAME is taken from the service entry's key in `services` below
# (e.g. {{ image.registry }}/api-service:{{ image.tag }}).
image:
  registry: ghcr.io/repldriven/queenswood
  tag: "0.0.0"
  pullPolicy: IfNotPresent
  pullSecrets: []

# -- Required secrets.
secrets:
  # The Keycloak admin client secret matches the realm-import JSON's
  # `queenswood-admin` client. Used by bank-api / bootstrap to mint
  # admin tokens against the Keycloak Admin REST API (creating per-
  # org service-account clients on org-create). Override at install:
  #   --set secrets.keycloakAdminClientSecret=...
  keycloakAdminClientSecret: ""

# -- Keycloak: the identity this bank runs on. Folded into this chart
# rather than beside it because almost all of it is Queenswood's own --
# the realms, the console client, the admin client whose signing key
# the bootstrap Job registers -- and because the issuer has to be one
# string that both Keycloak and everything verifying its tokens agree
# on. Two charts made that an agreement between two values files; one
# chart makes it a derivation. See `_helpers.tpl`.
keycloak:
  # dev | operator | external -- see queenswood.keycloakMode.
  mode: dev

  realm: queenswood
  # Second realm hosting Queenswood operator users. Same Keycloak
  # instance, separate realm. bank-api wires a second identity-provider
  # pointed at this realm so it still accepts operator JWTs; there is
  # no operator SPA in this chart any more, so the realm currently has
  # no first-party browser client.
  opsRealm: queenswood-ops
  adminClientId: queenswood-admin
  # Public client id the console SPA uses for Authorization
  # Code + PKCE. Must match the `clientId` of the corresponding
  # `clients[]` entry in `files/keycloak-realm.json`.
  consoleClientId: queenswood-console
  # Operator-realm client id retained for the second identity-provider.
  opsClientId: queenswood-app

  # All four derived from the mode and the hostname when left empty,
  # which is how the issuer stays a single string. Set one only to
  # point at a Keycloak this chart does not run.
  baseUrl: ""
  issuer: ""
  expectedIssuer: ""
  opsExpectedIssuer: ""

  # Image for whichever Keycloak this chart runs. One value for both
  # modes: the operator is expected to run the version it manages, so a
  # second pin here would be a second thing to move in step.
  image: quay.io/keycloak/keycloak:26.7.0

  # Where Keycloak is published. The subdomain is fixed; the domain is
  # supplied, because where this installation lives is not the chart's
  # to know, and supplying it moves the issuer.
  host:
    subdomain: keycloak
    domain: ""

  # The console SPA's deployed origin, added to the `queenswood-console`
  # client when the realm is imported. A whole URI, and empty adds
  # nothing -- a realm is imported once and never overwritten, so a
  # guessed origin is permanent.
  consoleRedirectUri: ""

  # The operator app's deployed origin, added to the `queenswood-app`
  # client in the ops realm the same way. Empty by default and adds
  # nothing when empty, because this chart deploys no operator SPA and
  # so has no hostname to fall back to.
  opsRedirectUri: ""

  # The Google OAuth client the realm's `google` identity provider
  # authenticates as. Created by hand in the Cloud console -- Google
  # exposes no API for a web client with a chosen redirect URI -- so the
  # id is supplied rather than derived. Empty leaves the realm's
  # committed placeholder alone.
  #
  # Only the id. Its secret reaches Keycloak through the file vault
  # below, so nothing about the client is committed at all.
  googleClientId: ""

  # The identity provider that id belongs to, and the last segment of
  # the redirect URI Google is configured with. Renaming one without the
  # other returns `redirect_uri_mismatch`, and only once the user has
  # already left for Google.
  googleIdpAlias: google

  # A HealthCheckPolicy overriding the default `/`-on-the-serving-port
  # probe, which Keycloak answers 302 to. The kind is GKE's, so this is
  # off here and on in values-gcp.yaml.
  healthCheck:
    enabled: false
    port: 9000
    requestPath: /health/ready

  # -- operator mode: the instance the Keycloak Operator manages.
  instances: 1
  database:
    # Which database on `postgres` below. The server is instance-scoped
    # and Keycloak is one user of it.
    name: keycloak
    # Secret holding a `username` key and nothing else. No password
    # exists: the user is an IAM principal and the connection presents
    # a token.
    secretName: queenswood-keycloak-conn

  # In-cluster pods resolve the published hostname to the internal
  # Service, so the `iss` claim round-trips without leaving the cluster.
  # Only meaningful once there is a published hostname.
  coredns:
    rewrite:
      enabled: false
      namespace: kube-system
      configMapName: coredns-custom

  # Keycloak's files-plaintext vault. Each key is a file in `dir` named
  # <realm>_<key>, so the queenswood realm's ${vault.google-client-secret}
  # reads queenswood_google-client-secret. The Secret is created out of
  # band (`just gcp-keycloak-vault-secret`) and never lives in git.
  #
  # The volume is optional, so enabling the vault before the Secret
  # exists leaves Keycloak running with the expression unresolved rather
  # than wedging the pod on a missing mount.
  # Name of a Secret carrying `username` and `password` for Keycloak's
  # bootstrap admin, supplied rather than generated. Empty falls back to
  # the operator's `<release>-keycloak-initial-admin`, which is reborn
  # with the cluster while the database keeps the credential it was
  # created with -- so a rebuild leaves a realm nothing can administer.
  # queenswood-config materialises this one from Secret Manager, as
  # `<release>-keycloak-bootstrap-admin`. Not `<release>-keycloak-admin`,
  # which holds the queenswood-admin client's signing pair -- the chart
  # refuses that name rather than let one Secret carry two credentials.
  bootstrapAdmin:
    secretName: ""
  vault:
    enabled: false
    secretName: queenswood-keycloak-vault
    dir: /opt/keycloak/data/vault

  # -- dev mode: bundled single-pod Keycloak for any standalone install
  # of this chart (local kind/k3s, the published OCI artifact). Runs
  # start-dev with an embedded H2 database, under the `/keycloak/` path
  # so the SPA's same-origin proxy carries a consistent prefix.
  dev:
    # Keycloak's master-realm bootstrap admin. Dev-only credentials.
    adminUser: admin
    adminPassword: admin

    # The local origins the committed realms no longer carry. The realm
    # pair a deployment imports lists no `localhost` redirect URI, so
    # nothing there widens a deployed realm by accident; the dev bundle
    # serves both SPAs on the developer's own machine and needs them,
    # so the template adds these at render time instead.
    #
    # The console is on 8081: that is the port
    # `console.keycloakPublicUrl` falls back to
    # (`http://localhost:8081/keycloak`) and the one the documented
    # `kubectl port-forward svc/<release>-console 8081:8080` opens, so
    # the SPA's origin and the authority it asks Keycloak for are the
    # same string. The operator app takes 8082, the other port this
    # bundle's own comment names; the chart deploys no operator SPA, so
    # nothing else claims it.
    #
    # The Vite ports (5173 console, 5174 operator app) belong to the
    # host SPAs run outside the cluster, and stay in the test realm
    # pair only.
    consoleRedirectUris:
      - "http://localhost:8081/*"
    opsRedirectUris:
      - "http://localhost:8082/*"

  # Admin REST credentials the bootstrap Job uses to push the generated
  # admin client secret into Keycloak. Derived from the mode when empty:
  # the operator mints one for its own instance, and the dev instance
  # has none.
  adminSecret:
    name: ""
    usernameKey: username
    passwordKey: password

  # Services that call the Admin REST API and therefore need the admin
  # client's signing key mounted. `bank` issues a per-bank service-
  # account client on creation and runs in the operational group, which
  # is why that service is on the list. Everything else gets nothing --
  # previously every service carried the credential whether or not it
  # had any use for it.
  consumers:
    - api-service
    - operational-processors-service
    - monolith-service

  # -- Realm import and export. The application's own Jobs, which
  # happen to speak Keycloak's Admin API and CLI -- they sit beside the
  # migrator and bootstrap Jobs for that reason, not in a Keycloak silo.
  #
  # `realms` on the import is a target, not a mode. It names the export
  # this environment's realms should come from
  # (`keycloak/realms/<YYYY>/<MM>/<DD>/<HHMMSSZ>`, or `LATEST`), recorded
  # by the export at teardown. Empty imports the committed definitions
  # instead, which is right for an environment that has never been torn
  # down and wrong for one that has -- restoring FDB beside a freshly
  # minted realm duplicates the bank.
  realmImport:
    realms: ""
    bucket: ""
    project: ""
    # Made by `just gcp-keycloak-restore-sa-create` -- needs only object
    # read on the backup bucket. Named for GCP because this Job is: it
    # shells out to `gcloud storage`. See values-gcp.yaml.
    gcpServiceAccount: ""
    # Needs curl and jq: it POSTs the realm to Keycloak's Admin API and
    # checks the restored user ids over the same API. No kubectl -- the
    # operator's import CR is not used, so the Job touches no Kubernetes
    # API at all.
    toolsImage: alpine/k8s:1.30.14
    gcloudImage: ""
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

  # Scheduled realm export, using Keycloak's own tooling rather than a
  # database dump -- see templates/job-realm-export.yaml for why.
  realmExport:
    enabled: false
    # Hourly. The export is realm JSON, tens of kilobytes, so frequency
    # costs little; what it buys is a smaller window of lost realm
    # changes between a teardown and the export that precedes it.
    schedule: "0 * * * *"
    bucket: ""
    project: ""
    # The instance composite's backup identity, which the s3proxy also
    # runs as: both write this instance's backups to the same bucket, so
    # a second account would carry the same grants and draw no boundary.
    # The composite binds Workload Identity to this CronJob's own
    # Kubernetes service account by name.
    gcpServiceAccount: ""
    # Empty means the image the Keycloak instance runs, so the export is
    # always produced by the version that wrote the data.
    keycloakImage: ""
    gcloudImage: ""
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

# -- Relational database for whatever in this release wants one.
# Instance-scoped rather than Keycloak's: a Cloud SQL instance hosts
# many databases and the proxy in front of it is shared, so a second
# consumer names another database rather than standing up another proxy.
#
#   off | local | cloudsql -- see queenswood.postgresProvider.
postgres:
  provider: "off"
  port: 5432
  local:
    image: postgres:18
    storage: 1Gi
    user: keycloak
    # Dev-only default. Anything real uses `cloudsql`, where no
    # password exists at all.
    password: keycloak-dev-password
  cloudsql:
    proxy:
      image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.24.1
      # `<project>:<region>:<instance>` -- surfaced on the CloudSQL
      # DatabaseInstance MR's `status.atProvider.connectionName`.
      connectionName: ""
      # Service account email bound to the Kubernetes account via
      # Workload Identity, and the database user's name once the
      # `.gserviceaccount.com` suffix is dropped. The instance
      # composite grants it `roles/cloudsql.client`,
      # `roles/cloudsql.instanceUser` and the
      # `iam.workloadIdentityUser` binding back to that account.
      serviceAccount: ""
      # The Kubernetes account the proxy runs as. Stated rather than
      # derived from the release name, because the instance manifest
      # names the same pair to bind Workload Identity to it and cannot
      # know what an Argo Application is called. Both sides spell this
      # constant or neither reports anything wrong.
      kubernetesServiceAccount: queenswood-cloudsql-proxy
    # Giving the database user its rights inside the database, which IAM
    # authentication does not carry with it -- see the grant Job. Its own
    # account, not the proxy's: editing an instance's users is not
    # something a workload should be able to do.
    grant:
      enabled: true
      kubernetesServiceAccount: queenswood-sql-grant
      serviceAccount: ""
      gcloudImage: ""
      # The full intended set, because assign-roles replaces rather than
      # adds. `cloudsqlsuperuser` is broader than one database needs; it
      # is what the Admin API can grant without a database session, and
      # narrowing it means a second identity connecting as a superuser
      # to run scoped SQL.
      databaseRoles:
        - cloudsqlsuperuser
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "200m"
          memory: "256Mi"

otel:
  endpoint: ""

# ---------------------------------------------------------------------
# All-in-one Jaeger for the kind dev loop. Receives OTLP/HTTP on 4318 and
# serves its UI on 16686. Storage is in-memory. Production sets
# enabled=false and points otel.endpoint at a real collector.
jaeger:
  enabled: true
  image: jaegertracing/jaeger:2.20.0
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# -- One-shot migrator Job. Applies FDB record metadata (via
# fdb/meta-store-write) and creates the Kafka topics. Runs first;
# bootstrap Job waits on its completion before seeding domain records.
migrator:
  enabled: true
  resources:
    limits: { cpu: "1000m", memory: "1Gi" }
    requests: { cpu: "100m", memory: "512Mi" }

# -- One-shot bootstrap Job. Idempotently seeds the platform and micro
# Policy records and the four cash-account-product templates. There is
# no organization to seed -- a user's first login creates their own
# bank. Runs after the migrator Job; service Deployments block on this
# Job (kubectl wait) before starting their main container, so the
# whole chain is migrator → bootstrap → services.
bootstrap:
  enabled: true
  resources:
    limits: { cpu: "1000m", memory: "1Gi" }
    requests: { cpu: "100m", memory: "512Mi" }

# -- Public Gateway for the console SPA (which proxies `/v1/*` to
# bank-api internally). When `gcp.enabled` is true the templates
# emit a Gateway with gatewayClassName gke-l7-regional-external-managed,
# a NamedAddress reference to a regional Address, an annotation
# binding it to a Certificate Manager CertificateMap, plus two
# HTTPRoutes (production traffic + an HTTP->HTTPS redirect). When
# false the Gateway uses `className` and serves plain HTTP for
# non-GKE setups.
gateway:
  enabled: false
  className: ""
  host: api.local
  # Second hostname the public Gateway terminates on, routed to the
  # console SPA. Kept distinct from `host` so the SPA can keep
  # its keycloak-js redirectUris + post-logout origins clean.
  consoleHost: console.api.local
  # Third hostname, routed to bank-api. Its own origin so CORS stays an
  # explicit allowlist and the API shares no origin with browser JS.
  apiHost: api.api.local
  gcp:
    enabled: false
    # Regional Address provisioned in infra/gcp/networking.yml.
    staticIpName: queenswood-ingress-ip
    # Certificate Manager certs to bind to the HTTPS listener.
    # Comma-separated for multiple. Cert provisioned in
    # infra/gcp/certificates.yml.
    certManagerCerts: queenswood-cert

# -- Human-identity SPA. nginx in the pod proxies `/v1/*` to bank-api
# and serves a synthesised /env.js so the SPA picks up its Keycloak
# URL at runtime. Image name is `console`.
console:
  enabled: true
  port: 8080
  replicas: 1
  apiUpstream: "http://{{ .Release.Name }}-api-service:8080"
  # In-cluster Service the nginx `/keycloak/*` reverse-proxies to so
  # the SPA stays same-origin. Empty means whichever Keycloak this
  # release runs, which is one Service name in either mode.
  keycloakUpstream: ""
  # Public URL of the realm endpoint the browser calls. Empty derives it
  # from the issuer, so publishing Keycloak moves this with everything
  # else; without a published hostname it falls back to the SPA's own
  # same-origin `/keycloak` path, so a bare `helm install` still works
  # after one `kubectl port-forward svc/<release>-console 8081:8080`.
  # Set it only to point at a Keycloak this chart does not run.
  keycloakPublicUrl: ""
  # Optional federated IdP alias. When set (e.g. "google"), the SPA
  # skips Keycloak's own login form and redirects straight to that
  # provider. Empty by default so the realm's login screen renders;
  # set to "google" in production values for a one-click Sign-In-
  # with-Google flow.
  keycloakIdpHint: ""
  resources:
    limits: { cpu: "200m", memory: "128Mi" }
    requests: { cpu: "50m", memory: "64Mi" }

# ---------------------------------------------------------------------
# Per-service settings. Each key maps to one Deployment + (if http=true)
# one Service. Set enabled: false to skip a service.
# Image name is the same as the key.
# ---------------------------------------------------------------------
services:
  api-service:
    enabled: true
    http: true
    port: 8080
    replicas: 1
    resources:
      limits: { cpu: "1000m", memory: "1500Mi" }
      requests: { cpu: "200m", memory: "768Mi" }

  # Money path: payment, transaction, interest, payee-check processors
  # in one JVM. Payee-check invokes the ClearBank adapter for
  # Confirmation of Payee, hence CLEARBANK_ADAPTER_URL.
  financial-processors-service:
    enabled: true
    replicas: 1
    resources:
      limits: { cpu: "1500m", memory: "2Gi" }
      requests: { cpu: "300m", memory: "1Gi" }
    extraEnv:
      CLEARBANK_ADAPTER_URL: "http://{{ .Release.Name }}-external-adapters-service:8082"

  # Provisioning + identity: bank, party, cash-account, product, idv
  # processors in one JVM. Bank provisioning issues service-account
  # clients, hence the Keycloak env (from the shared env block).
  operational-processors-service:
    enabled: true
    replicas: 1
    resources:
      limits: { cpu: "1000m", memory: "1536Mi" }
      requests: { cpu: "200m", memory: "768Mi" }

  # Work that must have exactly one dispatcher, whatever else scales:
  # the changelog runners that own every store's cursor, and the Quartz
  # scheduler that registers a trigger per enabled job. Both would
  # double-act on a second replica, so this stays at 1 — scale the
  # relay tier by sharding stores across deployments, not by adding
  # replicas here. Keeping them together is what leaves every other
  # group free of the constraint.
  exclusive-dispatchers-service:
    enabled: true
    replicas: 1
    resources:
      limits: { cpu: "1000m", memory: "1536Mi" }
      requests: { cpu: "200m", memory: "768Mi" }

  # Every external-vendor adapter and the simulators that stand in for
  # those vendors, in one JVM: ClearBank (8081 simulator / 8082
  # adapter), Onfido (8083 / 8084), Companies House (8085 simulator,
  # bus-only adapter). Adapters reach their simulator over localhost, so
  # there is no cross-pod wait and no webhook registration race. The
  # `_URL` env vars stay so a deployment can point an adapter at the
  # real vendor instead. Port 8082 is the probe target because it is
  # the one financial-processors calls (Confirmation of Payee).
  external-adapters-service:
    enabled: true
    http: true
    port: 8082
    extraPorts:
      - name: clearbank-sim
        port: 8081
      - name: onfido-sim
        port: 8083
      - name: onfido
        port: 8084
      - name: companies-sim
        port: 8085
    replicas: 1
    resources:
      limits: { cpu: "1500m", memory: "2Gi" }
      requests: { cpu: "300m", memory: "1Gi" }
    extraEnv:
      CLEARBANK_SIMULATOR_URL: "http://localhost:8081"
      CLEARBANK_ADAPTER_PUBLIC_URL: "http://localhost:8082"
      ONFIDO_URL: "http://localhost:8083"
      IDV_ONFIDO_ADAPTER_PUBLIC_URL: "http://localhost:8084"
      COMPANIES_HOUSE_URL: "http://localhost:8085"

# ---------------------------------------------------------------------
# FDB cluster managed by the FDB Kubernetes operator. The version MUST
# match the FDB client (libfdb_c) baked into the service image (7.3.75).
# Defaults are sized for a single-node dev cluster (kind/k3s); raise
# processCounts and resources for production.
# ---------------------------------------------------------------------
fdb:
  enabled: true
  version: "7.3.75"
  # Passed to every general process. Two are worth setting anywhere the
  # container limit is below FoundationDB's own defaults, which is
  # everywhere: --cache_memory sizes the page cache, which defaults to
  # 2GiB regardless of how much data exists, and --memory is the total
  # the process holds itself to, defaulting to 8GiB. Left unset, a
  # storage server allocates toward figures nothing told it it could
  # not have, and the kernel ends it with exit 137 and no explanation.
  # Keep both below `resources.limits.memory`.
  customParameters: []
  storageEngine: "ssd-redwood-1"
  processCounts:
    cluster_controller: 1
    storage: 1
    log: 1
    stateless: -1
  storage:
    storageClass: ""
    size: "4Gi"
  # Per-process resource caps. The operator default is ~8Gi per pod,
  # which doesn't fit a kind/k3s single-node cluster. Bump for prod.
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  # Continuous backup to object storage. Off by default: a local kind
  # install has no bucket to write to, and the credentials only exist
  # in a cloud environment. See templates/fdb-backup.yaml.
  backup:
    enabled: false
    # The S3-compatible endpoint, which is the in-cluster proxy rather
    # than storage.googleapis.com. Empty resolves to the proxy's own
    # Service. See templates/s3proxy.yaml for why the agents do not
    # reach GCS directly.
    endpoint: ""
    # Plaintext, and now a pod-to-pod hop: FDB's blobstore cannot be
    # given a CA through the operator, so the leg that crosses a
    # network is the proxy's own HTTPS to GCS, made by a client whose
    # trust store works. The files are encrypted either way.
    port: 80
    # An access key id is not a secret -- it names which credential is
    # being presented. The matching secret is generated in the cluster
    # and never stated here.
    accessKeyId: queenswood
    # S3-to-GCS proxy. The agents speak the only protocol they know and
    # the proxy speaks GCS, authenticating by Workload Identity, so no
    # exportable Google credential exists anywhere in the path and the
    # organisation's ban on service-account keys stops being something
    # to get exempted from.
    proxy:
      image: andrewgaul/s3proxy:4.0.0
      # The project the bucket is in, which is the recovery project
      # rather than this instance's. Set per instance.
      projectId: ""
      # Named by the composite, and what the proxy's identity is bound
      # to. Empty disables the annotation, for a cluster with no
      # Workload Identity.
      serviceAccount: ""
      replicas: 1
      resources:
        requests:
          cpu: "100m"
          memory: "512Mi"
        limits:
          cpu: "1000m"
          memory: "1Gi"
    bucket: ""
    # The bucket's region, which the SigV4 signature is computed over.
    region: ""
    # <service>/<backup-type>[/<generation>], the bucket's convention.
    # No environment segment: the bucket belongs to one project, the
    # project to one environment, and that environment to this system
    # alone. A project hosting a second system would need a <system>
    # segment in front -- this is a path, so it takes one. fdbbackup
    # appends the whole thing to its own `backups/` and `data/` roots
    # rather than treating it as a bucket prefix, so objects land under
    # `data/<backupName>/`.
    #
    # `gcp-up` overrides this with a third segment naming the cluster
    # generation, because a folder holds one backup and version numbers
    # restart with each cluster. The type stays a segment of its own:
    # it is what let Keycloak's `keycloak/export` (database dump) and
    # `keycloak/realms` (realm export) coexist rather than collide. The
    # two-segment default here is the single-generation case -- a
    # standalone install that is never rebuilt.
    backupName: fdb/continuous
    # No secretAccessKey and no encryptionKey. The first is generated in
    # the cluster, the second is read from Secret Manager by an
    # ExternalSecret -- neither reaches a values file, which under Argo
    # means neither reaches the repo-server or git.
    # Extra blobstore URL parameters (e.g. request timeouts), beyond
    # the region and secure_connection the template always sets.
    urlParameters: []
    agentCount: 2
    # FDB paces a snapshot across this whole window rather than writing
    # it at once, and a backup is not restorable until its first
    # snapshot completes -- so this is how long a fresh cluster is
    # unprotected, not just how often a full copy lands. An hour suits a
    # test environment's data volume; raise it where the write
    # amplification of frequent full copies costs more than the exposure.
    snapshotPeriodSeconds: 3600
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
  # Restore before anything writes. A target, not a mode: the version
  # says where this cluster's data should come from, so leaving it set
  # is safe -- the Job's name embeds it, and re-applying the same value
  # resolves to the same completed Job. Empty means no restore, which is
  # what a fresh environment with no prior backup wants.
  # `just gcp-fdb-export` records the version to use.
  restore:
    # The mode, where the fields below are the target. Inferring the
    # mode from whether a target was set made the two inseparable: the
    # values could not be left in place as a record of where this
    # cluster's data came from without also being live, and commenting
    # them out left a null `restore:` key that Helm reads as deleting
    # the block, so `fdbRestoreRequested` dereferenced a nil and the
    # whole chart stopped rendering.
    #
    # False by default, and it stays false afterwards. A rebuilt
    # cluster comes up empty, so a stale target left enabled is a
    # silent restore to whenever that was.
    #
    # Enabled with no `backupName` reads from `backup.backupName`,
    # which is right only where there has been one generation -- after
    # a rebuild that is the new and empty container.
    enabled: false
    version: ""
    # Container the restore reads from, which is NOT the one this
    # cluster backs up to. A rebuilt cluster starts its version numbers
    # again from near zero, so two generations sharing a container
    # leave `fdbbackup describe` picking by version number -- and the
    # older generation's numbers are the higher ones. It reported a
    # restore point belonging to a cluster two rebuilds back. Empty
    # falls back to backup.backupName, which is right only for an
    # environment that has never been rebuilt.
    backupName: ""
    # Defaults to foundationdb/foundationdb:<fdb.version>. Needs
    # fdbrestore and fdbcli, which the official image carries.
    image: ""
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "1000m"
        memory: "1Gi"

# Sub-chart: FDB Kubernetes Operator (CRDs + controller).
# nameOverride forces lowercase resource names — the chart derives
# them from `.Chart.Name` which (because we alias the dependency as
# `fdbOperator`) would otherwise produce mixed-case names that fail
# RFC-1123 validation on apply.
#
# Replace the default initContainers map (which ships entries for
# FDB 7.1, 7.3, and 7.4) with the single 7.4 entry we actually use.
# Otherwise each FDB pod pulls all three monitor images (~600MB
# total) on first install when only 7.4 is referenced by
# `fdb.version` above -- the unused 7.1 and 7.3 pulls just slow
# `helm install` down without anyone ever running them.
# -- Keycloak Operator, vendored upstream and installed cluster-wide,
# exactly as fdbOperator below. Needed only in `keycloak.mode: operator`;
# a cluster that already runs one turns this off.
keycloakOperator:
  enabled: false

fdbOperator:
  enabled: true
  nameOverride: fdb-operator
  # `fdbbackup start`, `status` and `discontinue` run in the operator
  # pod, not in an agent, so the operator needs the blobstore
  # credentials and the encryption key too -- see
  # templates/fdb-backup.yaml for why the Secret has no release prefix.
  # Mounted optional and set unconditionally so an install with
  # `fdb.backup.enabled: false` still starts.
  extraEnv:
    - name: FDB_BLOB_CREDENTIALS
      value: /var/backup-credentials/credentials
  volumes:
    - name: backup-credentials
      secret:
        secretName: fdb-backup-credentials
        optional: true
    - name: backup-key
      secret:
        secretName: fdb-backup-encryption-key
        optional: true
  volumeMounts:
    - name: backup-credentials
      mountPath: /var/backup-credentials
    - name: backup-key
      mountPath: /var/backup-key
  # Helm merges submap entries rather than replacing the map, so
  # we have to explicitly null the unused 7.1 and 7.3 keys to keep
  # only the 7.4 monitor binaries the chart actually uses.
  initContainers:
    "7.1": null
    # 7.3.75 rather than 7.4.x: fdb-kubernetes-monitor:7.4.6 is published
    # amd64-only, so on an arm64 node the operator's fdbcli runs under
    # Rosetta and `configure new` never executes — the cluster is created
    # but never configured. The 7.3.75 image is multi-arch.
    "7.3":
      image:
        repository: foundationdb/fdb-kubernetes-monitor
        tag: 7.3.75
        pullPolicy: IfNotPresent
    "7.4": null

# ---------------------------------------------------------------------
# Single-broker Kafka (KRaft, no ZooKeeper) for the kind dev loop. Production
# sets enabled=false and points services at an external broker.
kafka:
  enabled: true
  image: apache/kafka:4.3.1
  # Read only when enabled=false: external broker address (host:port).
  bootstrapServers: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
