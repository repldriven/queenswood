# A local cluster's sign-in: the `dev` / `dev` user the console signs in
# as, and the operator client load tests sign in as, added to the dev
# bundle's realm at render time and so present from the realm's first
# import. Passed by the readme's install and the kind
# recipes, and by no deployment -- the render fails if it meets any
# Keycloak mode but `dev`.

keycloak:
  dev:
    user:
      username: dev
      password: dev
      email: dev@queenswood.local
    # The operator client `just perf-run` creates its test bank with.
    operator:
      clientId: queenswood-perf
      secret: queenswood-perf-local-secret

# SigNoz's root user as a pair to type rather than one generated in the
# cluster, and the same pair `just telemetry-start` gives the monolith
# loop's SigNoz.
signoz:
  signoz:
    env:
      signoz_user_root_email: dev@example.com
      # A map, as the default is, with its valueFrom removed: a string
      # over a map still wins, but Helm warns on every install.
      signoz_user_root_password:
        value: Queenswood-dev-1
        valueFrom: null

# FoundationDB told its own limits. Its defaults -- a 2GiB page cache
# and 8GiB in all -- exceed the chart's 1Gi container, so a sustained
# load test grows the storage server until the kernel kills it.
fdb:
  customParameters:
    - cache_memory=512MiB
    - memory=1536MiB
  resources:
    limits:
      memory: 2Gi
  # The sidecar and init container hold a few tens of MB between
  # upgrades, and kind's FDB is rebuilt rather than upgraded, so they
  # reserve a fraction of a process here.
  sidecarResources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"
  # Two copies of the data and of each commit's log, as a deployment on
  # three nodes keeps. kind is one node, so each pod is its own fault
  # domain here: the copies are written and waited on, and protect
  # nothing.
  redundancyMode: double
  faultDomain:
    key: foundationdb.org/none
  # A process per role, since each fdbserver uses one core: three storage
  # servers sharing the keys, three logs, and the stateless roles -- two
  # commit proxies, a GRV proxy, a resolver, the master and the
  # ratekeeper -- on processes of their own rather than beside storage.
  processCounts:
    cluster_controller: 1
    storage: 3
    log: 3
    stateless: 6
  databaseConfiguration:
    logs: 3
    commit_proxies: 2
    grv_proxies: 1
    resolvers: 1

# The operator reconciles the cluster and then idles. Its chart reserves
# half a core, which kind's one node needs for the load test's Job once
# three brokers and thirteen FDB processes have their share.
fdbOperator:
  resources:
    requests:
      cpu: 100m

# Three brokers, every topic kept on all three and a send waiting on two,
# each with a volume, as a deployment on three nodes runs. On kind's one
# node they share it.
kafka:
  replicas: 3
  storage:
    size: 8Gi
