# Cluster-wide install of the official Keycloak Operator.
#
# Vendored VERBATIM from keycloak-k8s-resources, tag 26.7.4, as
# `kubectl kustomize` output over kubernetes/cluster-wide/ -- which
# upstream now ships and which does what this chart used to patch by
# hand: ClusterRole/ClusterRoleBinding instead of namespaced Roles,
# JOSDK_ALL_NAMESPACES on both controllers, no Namespace resource,
# and namespace `keycloak-operator`. Four deviations became none.
#
# The kustomize step is not optional: the raw kubernetes.yml leaves
# ServiceAccount subjects without a namespace, and upstream's
# NamespaceTransformer fills them in. Applied raw, the operator gets
# no permissions and silently reconciles nothing.
#
# One upstream quirk is kept as-is rather than patched:
# keycloak-operator-clusterrole-binding names its subject in
# namespace `keycloak` (the transformer does not rewrite an
# explicitly set one), so it binds to nothing. It grants only
# config.openshift.io/ingresses, which does not exist on GKE, so
# the binding is inert either way -- not worth a deviation that
# every future upgrade would have to reapply.
#
# CRDs live under crds/ so Helm installs them ahead of templates.
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    app.quarkus.io/build-timestamp: 2026-09-16 - 14:55:12 +0000
    app.quarkus.io/quarkus-version: 3.33.3.2
    app.quarkus.io/vcs-uri: https://github.com/keycloak/keycloak.git
  labels:
    app.kubernetes.io/managed-by: quarkus
    app.kubernetes.io/name: keycloak-operator
    app.kubernetes.io/version: 26.7.4
  name: keycloak-operator
  namespace: {{ .Release.Namespace }}
