apiVersion: v2
name: keycloak-operator
description: |
  Thin Helm-chart wrapper around the official Keycloak Operator's
  vendored YAML (release tag 26.7.4) — the operator and its
  ClusterRoles and bindings live under `templates/`, and the four
  upstream CRDs (`Keycloak`, `KeycloakRealmImport`,
  `KeycloakOIDCClient`, `KeycloakSAMLClient`) live under `crds/` so
  Helm installs them ahead of the rest. There are no values; it is a
  subchart of `queenswood`, enabled by `keycloakOperator.enabled`,
  exactly as `fdb-operator` is.

  One deviation from upstream's cluster-wide kustomize output: every
  `namespace: keycloak-operator` is templated to the release namespace,
  so the operator runs wherever the chart is installed. The rights it
  manages a `Keycloak` with are cluster-scoped, so that `Keycloak` may
  be in any namespace.
type: application
version: 0.1.5
appVersion: "26.7.4"
