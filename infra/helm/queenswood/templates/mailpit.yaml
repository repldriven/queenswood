{{- if .Values.mail.catcher.enabled }}
# Mailpit for the kind dev loop: SMTP in on 1025 with no TLS and no
# authentication, the inbox and its API on 8025. In-memory storage --
# messages are lost on restart.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mailpit
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
    app.kubernetes.io/component: mailpit
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: ui
      port: 8025
      targetPort: 8025
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-mailpit
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
    app.kubernetes.io/component: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: mailpit
  template:
    metadata:
      labels:
        {{- include "queenswood.podLabels" . | nindent 8 }}
        app.kubernetes.io/component: mailpit
    spec:
      containers:
        - name: mailpit
          image: {{ .Values.mail.catcher.image | quote }}
          env:
            - name: MP_SMTP_AUTH_ACCEPT_ANY
              value: "true"
            - name: MP_SMTP_AUTH_ALLOW_INSECURE
              value: "true"
          ports:
            - name: smtp
              containerPort: 1025
            - name: ui
              containerPort: 8025
          resources:
            {{- toYaml .Values.mail.catcher.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 1025
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8025
            initialDelaySeconds: 10
            periodSeconds: 10
{{- end }}
