{{- if .Values.console.enabled }}
---
# Human-identity SPA. Standalone template (TCP probes, no FDB
# volumes, no bootstrap dependency) — the SPA only proxies to
# bank-api at runtime, so a TCP-only probe is sufficient.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-console
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ default 1 .Values.console.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        {{- include "queenswood.podLabels" . | nindent 8 }}
        app.kubernetes.io/component: console
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: console
          image: "{{ .Values.image.registry }}/console:{{ include "queenswood.imageTag" . }}"
          imagePullPolicy: {{ include "queenswood.imagePullPolicy" $ }}
          ports:
            - name: http
              containerPort: {{ .Values.console.port }}
              protocol: TCP
          env:
            # nginx upstreams. KEYCLOAK_UPSTREAM is what the
            # `/keycloak/*` location reverse-proxies to; defaults to
            # the bundled dev Keycloak's Service in-cluster.
            - name: API_UPSTREAM
              value: {{ tpl .Values.console.apiUpstream . | quote }}
            - name: KEYCLOAK_UPSTREAM
              value: {{ default (printf "http://%s:8080" (include "queenswood.keycloakServiceName" .)) (tpl .Values.console.keycloakUpstream .) | quote }}
            # Runtime config the SPA reads via /env.js. Derived from
            # the issuer where Keycloak is published, and the SPA's own
            # same-origin `/keycloak` path where it is not.
            - name: KEYCLOAK_URL
              value: {{ include "queenswood.consoleKeycloakUrl" . | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.keycloak.consoleClientId | quote }}
            - name: KEYCLOAK_IDP_HINT
              value: {{ .Values.console.keycloakIdpHint | quote }}
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          {{- with .Values.console.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-console
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: console
  ports:
    - name: http
      port: {{ .Values.console.port }}
      targetPort: http
      protocol: TCP
{{- end }}
