{{- if .Values.kafka.enabled }}
{{- $replicas := int .Values.kafka.replicas }}
{{- $name := printf "%s-kafka" .Release.Name }}
{{- $headless := printf "%s-kafka-headless" .Release.Name }}
{{- /* Three copies once there are three brokers to hold them, and a send
       acknowledged by two: one broker may then be lost with nothing
       acknowledged lost and the topic still writable. Fewer brokers keep
       one copy per broker and wait on all of them. */}}
{{- $copies := min $replicas 3 }}
{{- $inSync := ternary 2 1 (ge $replicas 3) }}
# Kafka in KRaft mode (no ZooKeeper), every broker also a controller,
# using the same apache/kafka image the scenario tests run against. One
# broker by default, for the kind dev loop; `kafka.replicas: 3` is a
# cluster that replicates. Production may instead set kafka.enabled=false
# and point services at an external broker via kafka.bootstrapServers.
#
# Ephemeral unless `kafka.storage.size` is set: a restarted broker then
# starts empty, and the services recreate each topic with one partition.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
---
# Each broker's own name. A client bootstraps on the Service above and is
# then told to reach the partition's leader by the name it advertises,
# and the controllers find each other by the same names -- before any of
# them is ready, hence publishNotReadyAddresses.
apiVersion: v1
kind: Service
metadata:
  name: {{ $headless }}
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  serviceName: {{ $headless }}
  replicas: {{ $replicas }}
  # Parallel, not OrderedReady: no broker is ready until a majority of
  # the controllers has started, so starting them in turn never ends.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: kafka
  template:
    metadata:
      labels:
        {{- include "queenswood.podLabels" . | nindent 8 }}
        app.kubernetes.io/component: kafka
    spec:
      # The image runs as uid 1000, and a fresh volume is root's.
      securityContext:
        fsGroup: 1000
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.kafka.spread }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: kafka
      containers:
        - name: kafka
          image: {{ .Values.kafka.image | quote }}
          ports:
            - name: kafka
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # The pod's ordinal, so each broker keeps its id across
            # restarts and the voters below can be listed ahead of time.
            - name: KAFKA_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
            # One id for every broker of the cluster: a broker formats its
            # own storage on first start, and one formatted under another
            # id is refused by the rest.
            - name: CLUSTER_ID
              value: {{ .Values.kafka.clusterId | quote }}
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "{{- range $i := until $replicas }}{{ if $i }},{{ end }}{{ $i }}@{{ $name }}-{{ $i }}.{{ $headless }}:9093{{- end }}"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            # Clients bootstrap on the Service name and are sent on to a
            # broker by name, so each advertises its own or they
            # reconnect to an unreachable address.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://$(POD_NAME).{{ $headless }}:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            # What a topic gets where it names no replication factor,
            # which is every topic the platform declares.
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: {{ $copies | quote }}
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: {{ $inSync | quote }}
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: {{ $copies | quote }}
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: {{ $copies | quote }}
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: {{ $inSync | quote }}
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            # A directory below the mount: a fresh ext4 volume holds
            # lost+found, which a broker refuses to start beside.
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data/logs"
            - name: KAFKA_HEAP_OPTS
              value: {{ .Values.kafka.heapOpts | quote }}
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
      {{- if not .Values.kafka.storage.size }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.kafka.storage.size }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.kafka.storage.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.kafka.storage.size | quote }}
  {{- end }}
{{- end }}
