{{- /*
  The credential each adapter presents to its provider, one Secret
  apiece, generated in the cluster where the simulators stand in for the
  providers. The adapter and the simulator read the same Secret, each
  the halves it holds: the adapter signs with what the simulator
  verifies with, as it would against the vendor.

  Rendered only with `external-simulators-service`. An installation
  that runs against the vendors disables that service, renders none of
  this, and fills the same Secrets -- same names, same keys -- from
  Secret Manager through ExternalSecrets in queenswood-config.

  Not rendered with data, for the reason templates/secret-keycloak.yaml
  gives, and kept nowhere else: a simulator's credential grants nothing
  outside the cluster and is regenerated with it, the rotatable case in
  docs/recipes/infra/external-secrets.md. The Job writes a Secret only
  while it is empty, so a credential outlives an upgrade.
*/}}
{{- define "queenswood.providerCredentialSecrets" -}}
modulr-api form3-api clearbank-client-key clearbank-provider-key
{{- end -}}

{{- define "queenswood.providerCredentialsPodSpec" -}}
restartPolicy: OnFailure
serviceAccountName: {{ .Release.Name }}-provider-credentials
initContainers:
  # openssl, because alpine/k8s carries kubectl but not openssl. Every
  # credential is generated afresh; only the empty Secrets take one.
  - name: generate
    image: {{ .Values.tools.openssl.image | quote }}
    command:
      - sh
      - -c
      - |
        set -eu
        cd /keys
        mkdir -p modulr-api form3-api clearbank-client-key clearbank-provider-key
        openssl rand -hex 16 | tr -d '\n' > modulr-api/key-id
        openssl rand -base64 32 | tr -d '\n' > modulr-api/secret
        cat /proc/sys/kernel/random/uuid | tr -d '\n' > form3-api/key-id
        for d in form3-api clearbank-client-key clearbank-provider-key; do
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out "$d/private-key" 2>/dev/null
          openssl pkey -in "$d/private-key" -pubout -out "$d/public-key"
        done
        echo "generated every provider credential"
    volumeMounts:
      - name: keys
        mountPath: /keys
containers:
  - name: store
    image: {{ .Values.tools.k8s.image | quote }}
    env:
      - name: RELEASE
        value: {{ .Release.Name | quote }}
      - name: SECRETS
        value: {{ include "queenswood.providerCredentialSecrets" . | quote }}
    command:
      - sh
      - -c
      - |
        set -eu
        for name in $SECRETS; do
          secret="$RELEASE-$name"
          existing=$(kubectl get secret "$secret" \
            -o jsonpath='{.data}' 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "{}" ]; then
            echo "carrying forward $secret"
            continue
          fi
          data=""
          for f in /keys/"$name"/*; do
            data="$data\"$(basename "$f")\":\"$(base64 -w0 < "$f")\","
          done
          kubectl patch secret "$secret" --type merge \
            -p "{\"data\":{${data%,}}}" > /dev/null
          echo "stored a generated credential in $secret"
        done
    volumeMounts:
      - name: keys
        mountPath: /keys
volumes:
  - name: keys
    emptyDir:
      medium: Memory
{{- end -}}

{{- $simulators := index .Values.services "external-simulators-service" }}
{{- if and $simulators $simulators.enabled }}
{{- $name := printf "%s-provider-credentials" .Release.Name }}
{{- range $secret := splitList " " (include "queenswood.providerCredentialSecrets" .) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-%s" $.Release.Name $secret }}
  labels:
    {{- include "queenswood.labels" $ | nindent 4 }}
type: Opaque
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
rules:
  # resourceNames, so this is a grant on these Secrets rather than on
  # secrets. No `create`: the Secrets are rendered above.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- range $secret := splitList " " (include "queenswood.providerCredentialSecrets" .) }}
      - {{ printf "%s-%s" $.Release.Name $secret | quote }}
      {{- end }}
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
# The name hashes the pod spec, so anything changing what the Job runs
# changes its name. A pod template is immutable once the Job exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%s" $name (include "queenswood.providerCredentialsPodSpec" . | sha256sum | trunc 10) }}
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
    app.kubernetes.io/component: provider-credentials
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "queenswood.podLabels" . | nindent 8 }}
        app.kubernetes.io/component: provider-credentials
    spec:
      {{- include "queenswood.providerCredentialsPodSpec" . | nindent 6 }}
{{- end }}
