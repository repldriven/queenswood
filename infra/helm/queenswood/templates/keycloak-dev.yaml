{{- if eq (include "queenswood.keycloakMode" .) "dev" }}
{{- /*
  Dev-only Keycloak. Single replica, `start-dev` (embedded H2 DB),
  with the realm JSON from files/keycloak-realm.json imported at
  startup. The Service name matches the default
  `keycloak.baseUrl` so bank-api's existing config resolves
  without override. `keycloak.mode: operator` runs the
  operator-managed instance instead, on the same Service name.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-keycloak-dev-realm
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
data:
  # Both realms mount under /opt/keycloak/data/import/; Keycloak's
  # --import-realm scans the directory and imports each .json file
  # found, so the queenswood (orgs) and queenswood-ops (operators)
  # realms come up side-by-side on a single Keycloak instance.
  #
  # The committed realms carry no `localhost` redirect URI -- a
  # deployed realm must not be widened by an origin no deployment
  # reaches -- so this bundle, which does serve both SPAs on the
  # developer's own machine, adds them here at render time. Only in
  # this template: the operator-mode Job imports the files as they are
  # and reconciles the deployed origins over the Admin API instead.
  realm.json: |-
{{ include "queenswood.devRealmWithRedirects"
     (dict "realm" (.Files.Get "files/keycloak-realm.json")
           "clientId" .Values.keycloak.consoleClientId
           "uris" .Values.keycloak.dev.consoleRedirectUris) | indent 4 }}
  realm-ops.json: |-
{{ include "queenswood.devRealmWithRedirects"
     (dict "realm" (.Files.Get "files/keycloak-realm-ops.json")
           "clientId" .Values.keycloak.opsClientId
           "uris" .Values.keycloak.dev.opsRedirectUris) | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  # Brand theme for the Keycloak login page. CSS-only override of
  # the keycloak.v2 base theme; layout stays Keycloak's default.
  # Mounted via subPath into /opt/keycloak/themes/queenswood/login.
  name: {{ .Release.Name }}-keycloak-dev-theme
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
data:
  theme.properties: |-
{{ .Files.Get "files/keycloak-theme/login/theme.properties" | indent 4 }}
  styles.css: |-
{{ .Files.Get "files/keycloak-theme/login/resources/css/styles.css" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  # The same name the operator publishes for its own instance, so
  # nothing reaching Keycloak has to know which mode is running.
  name: {{ include "queenswood.keycloakServiceName" . }}
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: keycloak-dev
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-keycloak-dev
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: keycloak-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: keycloak-dev
    spec:
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image | quote }}
          imagePullPolicy: IfNotPresent
          args: ["start-dev", "--import-realm"]
          env:
            # Bootstrap master-realm admin (Keycloak's own admin
            # console). Dev-only credentials; do not use in any
            # non-local environment.
            - name: KEYCLOAK_ADMIN
              value: {{ .Values.keycloak.dev.adminUser | quote }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: {{ .Values.keycloak.dev.adminPassword | quote }}
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"
            # Trust X-Forwarded-Proto + X-Forwarded-Host from the SPA
            # nginx so Keycloak generates discovery URLs, redirect
            # URLs, and the JWT `iss` claim based on the SPA's
            # public origin (http://localhost:8081 / 8082) rather
            # than its own in-cluster Service name. HOSTNAME_STRICT
            # =false relaxes Keycloak's default requirement that
            # requests match a configured hostname -- safe for the
            # dev bundle, off in operator mode (the
            # sets a fixed hostname there).
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            # Run Keycloak under the `/keycloak/` path so the same-
            # origin SPA proxy works without rewriting URLs in the
            # discovery doc. Keycloak doesn't honour X-Forwarded-
            # Prefix; the only supported way to carry a path prefix
            # into generated URLs is `--http-relative-path`. nginx
            # forwards `/keycloak/realms/...` unchanged to upstream;
            # Keycloak knows it's at /keycloak/ and builds URLs to
            # match.
            - name: KC_HTTP_RELATIVE_PATH
              value: "/keycloak"
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9000
              name: management
          readinessProbe:
            # KC_HTTP_RELATIVE_PATH=/keycloak applies to the
            # management port too, so the health endpoints move
            # from /health/* to /keycloak/health/*.
            httpGet:
              path: /keycloak/health/ready
              port: 9000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /keycloak/health/live
              port: 9000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
            # The queenswood login theme. Two subPath mounts so the
            # theme tree gets the directory shape Keycloak's loader
            # expects (theme.properties at the login/ root,
            # resources/css/styles.css for the CSS override).
            - name: kc-theme
              mountPath: /opt/keycloak/themes/queenswood/login/theme.properties
              subPath: theme.properties
              readOnly: true
            - name: kc-theme
              mountPath: /opt/keycloak/themes/queenswood/login/resources/css/styles.css
              subPath: styles.css
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: realm-import
          configMap:
            name: {{ .Release.Name }}-keycloak-dev-realm
        - name: kc-theme
          configMap:
            name: {{ .Release.Name }}-keycloak-dev-theme
{{- end }}
