{{- if .Values.fdb.enabled }}
apiVersion: apps.foundationdb.org/v1beta2
kind: FoundationDBCluster
metadata:
  name: {{ .Release.Name }}-fdb
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
spec:
  version: {{ .Values.fdb.version | quote }}
  databaseConfiguration:
    storage_engine: {{ .Values.fdb.storageEngine | quote }}
    redundancy_mode: single
    {{- with .Values.fdb.databaseConfiguration }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  processCounts:
    {{- toYaml .Values.fdb.processCounts | nindent 4 }}
  processes:
    general:
      {{- /* Arguments to fdbserver itself, as distinct from the
             container's limits below. Without them the process takes
             FoundationDB's defaults -- a 2GiB page cache sized by
             configuration rather than by dataset, inside whatever the
             limit happens to be -- and is killed by the kernel rather
             than exiting with something a reader can act on. */}}
      {{- with .Values.fdb.customParameters }}
      customParameters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          {{- with .Values.fdb.storage.storageClass }}
          storageClassName: {{ . | quote }}
          {{- end }}
          resources:
            requests:
              storage: {{ .Values.fdb.storage.size | quote }}
      podTemplate:
        spec:
          # The FDB sidecar uses this SA to patch its own pod's
          # locality annotations; without it the operator never
          # finds an eligible coordinator. RBAC is in
          # rbac-fdb-pod.yaml.
          serviceAccountName: {{ .Release.Name }}-fdb-pod
          # fdbserver runs as uid/gid 4059. A fresh ext4 PVC is
          # owned root:root 0755, so without an fsGroup the
          # process can't write its data dir and crash-loops with
          # `Fatal Error: File could not be written`. fsGroup
          # tells kubelet to chgrp the volume to 4059 on mount.
          securityContext:
            fsGroup: 4059
          # Per-process resource caps. The FDB operator's default
          # request is ~8Gi per pod which doesn't fit a kind node;
          # override per environment via `fdb.resources` in values.
          # `containers` is deliberately outside the resources guard:
          # anything added under it (volumeMounts, env, securityContext)
          # must not silently vanish for an environment that sets no
          # caps.
          containers:
            - name: foundationdb
              {{- with .Values.fdb.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
            {{- with .Values.fdb.resources }}
            - name: foundationdb-kubernetes-sidecar
              resources:
                {{- toYaml . | nindent 16 }}
            {{- end }}
          {{- with .Values.fdb.resources }}
          initContainers:
            - name: foundationdb-kubernetes-init
              resources:
                {{- toYaml . | nindent 16 }}
          {{- end }}
  routing:
    headlessService: true
{{- end }}
