{{- if eq (include "queenswood.keycloakMode" .) "operator" }}
{{- /*
  Realm import, from a backup when one is named and from the chart's
  committed definitions otherwise. One mechanism, not two.

  The realm is POSTed to Keycloak's own Admin API rather than handed
  to the operator's `KeycloakRealmImport`. Three reasons, each learned
  the hard way:

  - the CRD declares a subset of the realm schema and rejects the
    rest, so an operator even one release behind the server refuses
    every export it produces -- and only on the restore path, since
    the committed JSON happens to use fewer fields
  - the operator imports from a separate process that does not join
    the cache cluster, so the running server serves a realm it cannot
    yet see; checks made straight after the import read 404 for users
    that appear moments later
  - a realm that already exists is silently not overwritten, where a
    POST answers 409 and can be acted on

  Keycloak accepts its own export by definition, and the server that
  performs the import is the one that serves it, so there is nothing
  to translate and no cache to lag. A realm still cannot be
  overwritten, so whichever definition arrives first wins permanently
  -- which is why the source is chosen before anything is created.

  That decision is what protects identity. FDB references the Keycloak
  subject, so a realm rebuilt from the committed JSON rather than from
  the backup mints new user ids, and the bank silently duplicates
  itself around them (issue #356). A restored FDB beside a fresh realm
  is worse than no restore at all: a missing realm is obvious, an
  orphaned bank is not.

  Three consequences follow, and each is enforced below rather than
  assumed:

  - a requested backup that cannot be fetched fails the Job; it never
    falls back to the committed JSON, because falling back is exactly
    the silent duplication
  - a requested restore arriving at a realm that already exists fails
    loudly, because the operator cannot import over it and a skip here
    is the most expensive outcome there is
  - a completed restore is recorded on the realm itself, so re-running
    this Job against an already-restored realm is quiet rather than
    fatal
*/ -}}
{{- $realm := .Files.Get "files/keycloak-realm.json" -}}
{{- $opsRealm := .Files.Get "files/keycloak-realm-ops.json" -}}
{{- /* Keyed by realm name, because the Job reads /chart/<realm>-realm.json */ -}}
{{- $realmFiles := dict (printf "%s-realm.json" ($realm | fromJson).realm) $realm (printf "%s-realm.json" ($opsRealm | fromJson).realm) $opsRealm -}}
{{- $realms := list ($realm | fromJson).realm ($opsRealm | fromJson).realm -}}
{{- $restore := .Values.keycloak.realmImport.realms | default "" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-realm-source
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
data:
  {{- range $name, $content := $realmFiles }}
  {{ $name }}: |
{{ $content | indent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-realm-import
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
  annotations:
    {{- if $restore }}
    iam.gke.io/gcp-service-account: {{ required "restore.gcpServiceAccount must be set when restore.realms is (just gcp-keycloak-restore-sa-create makes it)" .Values.keycloak.realmImport.gcpServiceAccount | quote }}
    {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  # Content-addressed: a Job's pod template is immutable, so the name
  # has to change whenever anything it runs on does. Re-applying the
  # same chart and the same backup resolves to the same completed Job.
  {{- /* The console redirect and the Google client id are in the hash
         because the Job reconciles them, and a Job is immutable:
         without them, changing the console's hostname or the OAuth
         client leaves the same name, the same completed Job, and
         nothing to apply the change -- while Argo tries to patch an
         immutable spec and fails the sync for every resource beside
         it. What the Job acts on belongs in what names it -- and so
         does what it reads: the bootstrap admin Secret is named in
         two env vars, so an instance adopting a supplied credential
         changed this template and left the name alone, and the sync
         wedged until somebody deleted the Job by hand. */}}
  name: {{ .Release.Name }}-realm-import-{{ printf "%s|%s|%s|%s|%s|%s|%s|%s|%s" $restore .Chart.Version (get $realmFiles "queenswood-realm.json") (get $realmFiles "queenswood-ops-realm.json") (include "queenswood.consoleRedirectUri" .) (include "queenswood.opsRedirectUri" .) .Values.keycloak.googleClientId .Values.keycloak.googleIdpAlias (include "queenswood.keycloakBootstrapAdminSecret" .) | sha256sum | trunc 8 }}
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-realm-import
spec:
  backoffLimit: 3
  template:
    metadata:
      # Deliberately not `queenswood.podLabels`, which carries
      # `helm.sh/chart`: the component label is what the queenswood
      # chart's bootstrap Job selects on, and it must not move with a
      # chart version.
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: keycloak-realm-import
    spec:
      # Never, not OnFailure: OnFailure restarts the container inside
      # one pod, so each attempt overwrites the last one's log and the
      # pod is garbage-collected the moment the Job gives up. Three
      # failures were diagnosed by rebuilding a copy of this Job to
      # watch it fail again, because the evidence had already been
      # deleted. Never leaves one pod per attempt, and their logs
      # outlive the Job.
      restartPolicy: Never
      serviceAccountName: {{ .Release.Name }}-realm-import
      {{- if $restore }}
      initContainers:
        # Fetches the named export. Its failure is the Job's failure --
        # there is deliberately no path from "the backup could not be
        # read" to "import the committed JSON instead".
        - name: fetch-backup
          image: {{ .Values.keycloak.realmImport.gcloudImage | quote }}
          command:
            - sh
            - -c
            - |
              set -e
              PREFIX="$RESTORE"
              if [ "$PREFIX" = "LATEST" ]; then
                PREFIX=$(gcloud storage cat "gs://$BUCKET/keycloak/realms/LATEST" \
                  --project="$PROJECT" | head -1)
                echo "LATEST resolves to $PREFIX"
              fi
              if [ -z "$PREFIX" ]; then
                echo "no export to restore from under gs://$BUCKET/keycloak/realms/" >&2
                exit 1
              fi
              for realm in $REALMS; do
                echo "fetching gs://$BUCKET/$PREFIX/$realm-realm.json"
                gcloud storage cp "gs://$BUCKET/$PREFIX/$realm-realm.json" \
                  "/source/$realm-realm.json" --project="$PROJECT"
              done
              # Written last: the import step reads this to know which
              # export it is applying, and records it on the realm.
              printf '%s' "$PREFIX" > /source/PREFIX
          env:
            - name: RESTORE
              value: {{ $restore | quote }}
            - name: PROJECT
              value: {{ required "restore.project must be set when restore.realms is" .Values.keycloak.realmImport.project | quote }}
            - name: BUCKET
              value: {{ required "restore.bucket must be set when restore.realms is" .Values.keycloak.realmImport.bucket | quote }}
            - name: REALMS
              value: {{ join " " $realms | quote }}
          volumeMounts:
            - name: source
              mountPath: /source
      {{- end }}
      containers:
        - name: import
          image: {{ .Values.keycloak.realmImport.toolsImage | quote }}
          command:
            - sh
            - -c
            - |
              set -e

              for i in $(seq 1 120); do
                if curl -sf "$KC/realms/master/.well-known/openid-configuration" \
                     >/dev/null 2>&1; then break; fi
                echo "waiting for Keycloak ($i/120)"
                sleep 5
              done

              token() {
                curl -sf -X POST \
                  "$KC/realms/master/protocol/openid-connect/token" \
                  -d grant_type=password -d client_id=admin-cli \
                  --data-urlencode "username=$ADMIN_USER" \
                  --data-urlencode "password=$ADMIN_PASSWORD" \
                  | jq -r '.access_token // empty'
              }
              TOK=$(token || true)
              if [ -z "$TOK" ]; then
                echo "could not obtain a Keycloak admin token" >&2
                exit 1
              fi

              api() {
                curl -s -H "Authorization: Bearer $TOK" "$@"
              }
              # An SPA's deployed origin, applied to its client on every
              # run rather than only at import. A realm is created once
              # and never overwritten, so a hostname that changes later
              # -- a new environment, a second origin -- would otherwise
              # reach the realm not at all, and the fix would be a click
              # nobody can review. Idempotent: it adds what is missing
              # and returns when it is not.
              #
              # $1 realm, $2 client id, $3 the whole URI. Both SPAs go
              # through here: the console in the orgs realm and the
              # operator app in the ops realm.
              reconcile_redirect() {
                [ -n "$3" ] || return 0
                cid=$(api "$KC/admin/realms/$1/clients?clientId=$2" \
                  | jq -r '.[0].id // ""')
                if [ -z "$cid" ]; then
                  echo "no client '$2' in realm '$1'; nothing to reconcile"
                  return 0
                fi
                cur=$(api "$KC/admin/realms/$1/clients/$cid")
                if echo "$cur" | jq -e --arg u "$3" \
                     '(.redirectUris // []) | index($u)' >/dev/null; then
                  return 0
                fi
                echo "$cur" | jq --arg u "$3" \
                    '.redirectUris = (((.redirectUris // []) + [$u]) | unique)' \
                  | curl -sf -X PUT -H "Authorization: Bearer $TOK" \
                      -H 'Content-Type: application/json' -d @- \
                      -o /dev/null "$KC/admin/realms/$1/clients/$cid"
                echo "added $3 to '$2' in realm '$1'"
              }

              # The Google OAuth client id, applied to an existing realm
              # for the same reason: the realm carries a placeholder and
              # is never overwritten, so the id an environment actually
              # signs in through has to arrive over the Admin API.
              #
              # Only the id. The secret stays the committed vault
              # expression, which the representation returns masked --
              # writing back what was read would replace it with
              # asterisks, and Google would refuse the client with the
              # realm looking entirely correct. It is restored from the
              # definition instead.
              #
              # $2 is that definition. Called only where the realm was
              # not restored, so it is always the chart's own.
              reconcile_google_client_id() {
                [ -n "$GOOGLE_CLIENT_ID" ] || return 0
                idp="$KC/admin/realms/$1/identity-provider/instances/$GOOGLE_IDP_ALIAS"
                cur=$(api "$idp")
                if ! echo "$cur" | jq -e '.alias // empty' >/dev/null 2>&1; then
                  echo "no identity provider '$GOOGLE_IDP_ALIAS' in realm '$1'; nothing to reconcile"
                  return 0
                fi
                if [ "$(echo "$cur" | jq -r '.config.clientId // ""')" = "$GOOGLE_CLIENT_ID" ]; then
                  return 0
                fi
                secret=$(jq -r --arg a "$GOOGLE_IDP_ALIAS" \
                  '((.identityProviders // [])[]
                     | select(.alias == $a) | .config.clientSecret) // ""' "$2")
                echo "$cur" \
                  | jq --arg id "$GOOGLE_CLIENT_ID" --arg s "$secret" \
                      '.config.clientId = $id
                       | if $s == "" then . else .config.clientSecret = $s end' \
                  | curl -sf -X PUT -H "Authorization: Bearer $TOK" \
                      -H 'Content-Type: application/json' -d @- \
                      -o /dev/null "$idp"
                echo "set the google client id on '$GOOGLE_IDP_ALIAS' in realm '$1'"
              }

              # `|| true` so a transport error reads as "no status" and
              # is judged by the caller, rather than killing the script
              # under `set -e` with curl's exit code and no explanation.
              status_of() {
                curl -s -o /dev/null -w '%{http_code}' \
                  -H "Authorization: Bearer $TOK" "$KC/admin/realms/$1" \
                  || true
              }

              # An `if`, not `[ -f x ] && y`: under `set -e` a failed
              # test is the exit status of the whole AND-OR list, so
              # the shell would leave here whenever the file is absent
              # -- which is every non-restoring run.
              RESTORED_FROM=""
              if [ -f /source/PREFIX ]; then
                RESTORED_FROM=$(cat /source/PREFIX)
              fi

              for realm in $REALMS; do

                if [ -n "$RESTORED_FROM" ]; then
                  src="/source/$realm-realm.json"
                  origin="backup ($RESTORED_FROM)"
                else
                  src="/chart/$realm-realm.json"
                  origin="the chart's committed definition"
                fi

                if [ "$(status_of "$realm")" = "200" ]; then
                  if [ -z "$RESTORED_FROM" ]; then
                    echo "realm '$realm' exists; nothing to import"
                    reconcile_redirect "$realm" "$CONSOLE_CLIENT_ID" \
                      "$CONSOLE_REDIRECT_URI"
                    reconcile_redirect "$realm" "$OPS_CLIENT_ID" \
                      "$OPS_REDIRECT_URI"
                    # Only the realm the console signs in through. The
                    # operator realm's own google provider carries a
                    # literal placeholder secret rather than a vault
                    # expression, so giving it this id would leave a
                    # provider that looks configured and cannot
                    # authenticate.
                    if [ "$realm" = "$GOOGLE_REALM" ]; then
                      reconcile_google_client_id "$realm" "$src"
                    fi
                    continue
                  fi
                  # Set by this Job after a successful restore. Equal
                  # means the restore already landed and this is a
                  # re-run; anything else means the realm was built
                  # from something other than the backup we were told
                  # to restore, and the operator cannot import over it.
                  was=$(api "$KC/admin/realms/$realm" \
                    | jq -r '.attributes["queenswood.restoredFrom"] // ""')
                  if [ "$was" = "$RESTORED_FROM" ]; then
                    echo "realm '$realm' already restored from $RESTORED_FROM"
                    continue
                  fi
                  echo "FATAL: a restore from $RESTORED_FROM was requested," >&2
                  echo "but realm '$realm' already exists${was:+, restored from $was}." >&2
                  echo "The operator imports realms and never overwrites them, so" >&2
                  echo "this restore cannot be applied. Skipping it silently would" >&2
                  echo "leave a realm whose user ids no longer match FDB." >&2
                  exit 1
                fi

                echo "importing realm '$realm' from $origin"

                # The console's deployed origin is added here rather
                # than carried in the realm definition. Keycloak honours
                # `*` only as a trailing wildcard on the path, so the
                # host must be literal, and a literal host in a shared
                # file would pin both the environment and the registrar
                # domain. Applied to whichever source, so a backup taken
                # against one domain restores into another.
                #
                # Supplied whole rather than composed from a domain: the
                # console is another chart's, its hostname is that
                # chart's to state, and a realm is imported once and
                # never overwritten -- so a guessed host here is
                # permanent. Empty adds nothing, which is what a console
                # with no public origin yet wants.
                #
                # The Google client id rides the same transform, so a
                # realm created here starts with the id the environment
                # signs in through rather than the placeholder, and the
                # reconcile above has nothing left to do.
                gid=""
                if [ "$realm" = "$GOOGLE_REALM" ]; then
                  gid="$GOOGLE_CLIENT_ID"
                fi
                jq --arg uri "$CONSOLE_REDIRECT_URI" \
                   --arg console "$CONSOLE_CLIENT_ID" \
                   --arg opsuri "$OPS_REDIRECT_URI" \
                   --arg ops "$OPS_CLIENT_ID" \
                   --arg gid "$gid" \
                   --arg alias "$GOOGLE_IDP_ALIAS" '
                  def add_redirect($id; $u):
                    if $u == "" then . else
                      .clients = ((.clients // []) | map(
                        if .clientId == $id
                        then .redirectUris = (((.redirectUris // []) + [$u]) | unique)
                        else . end))
                    end;
                  add_redirect($console; $uri)
                  | add_redirect($ops; $opsuri)
                  | (if $gid == "" then . else
                    .identityProviders = ((.identityProviders // []) | map(
                      if .alias == $alias then .config.clientId = $gid else . end))
                   end)
                ' "$src" > /tmp/$realm.json

                # Performed by the running server, so the realm it
                # creates is the realm it serves -- no second process,
                # no cache to lag behind, and nothing translated
                # through a schema that is not Keycloak's own.
                code=$(curl -s -o /tmp/$realm.err -w '%{http_code}' \
                  -X POST "$KC/admin/realms" \
                  -H "Authorization: Bearer $TOK" \
                  -H 'Content-Type: application/json' \
                  --data @/tmp/$realm.json || true)
                case "$code" in
                  201) ;;
                  409)
                    # Only reachable as a race: the guard above found
                    # no realm moments ago. Loud either way -- a realm
                    # is never overwritten, so a restore arriving
                    # second has not been applied.
                    echo "realm '$realm' appeared while importing it; not overwritten" >&2
                    exit 1 ;;
                  *)
                    echo "importing realm '$realm' failed: HTTP ${code:-none}" >&2
                    head -c 600 /tmp/$realm.err >&2
                    echo >&2
                    exit 1 ;;
                esac


                if [ -z "$RESTORED_FROM" ]; then
                  echo "imported realm '$realm'"
                  continue
                fi

                # The import can outlast the token that started it.
                TOK=$(token || true)
                if [ -z "$TOK" ]; then
                  echo "could not obtain a token to verify the restore" >&2
                  exit 1
                fi

                # Identity continuity, proved rather than assumed. FDB
                # references these ids; an import that dropped users, or
                # that Keycloak declined, leaves a realm that looks
                # restored and duplicates the bank on first login.
                missing=0
                total=0
                for id in $(jq -r '(.users // [])[].id' "$src"); do
                  total=$((total + 1))
                  code=$(curl -s -o /dev/null -w '%{http_code}' \
                    -H "Authorization: Bearer $TOK" \
                    "$KC/admin/realms/$realm/users/$id" || true)
                  if [ "$code" != "200" ]; then
                    echo "user id $id is absent after the import" >&2
                    missing=$((missing + 1))
                  fi
                done
                if [ "$missing" -gt 0 ]; then
                  echo "$missing of $total user ids did not survive the restore of '$realm'" >&2
                  exit 1
                fi

                # The federated identity link is what makes Google
                # sign-in resolve to the restored user rather than mint
                # a new one, and it is the part of the round trip most
                # easily lost -- the admin REST partial export drops
                # users entirely.
                for id in $(jq -r '(.users // [])[]
                              | select((.federatedIdentities // []) | length > 0)
                              | .id' "$src"); do
                  n=$(api "$KC/admin/realms/$realm/users/$id/federated-identity" \
                    | jq 'length' 2>/dev/null || echo 0)
                  if [ "${n:-0}" -lt 1 ]; then
                    echo "federated identity links lost for user $id" >&2
                    exit 1
                  fi
                done

                # Recorded on the realm, so a later run of this Job can
                # tell "already restored" from "built from something
                # else" without keeping state of its own.
                api "$KC/admin/realms/$realm" \
                  | jq --arg p "$RESTORED_FROM" \
                      '.attributes = ((.attributes // {}) + {"queenswood.restoredFrom": $p})' \
                  | curl -sf -X PUT -H "Authorization: Bearer $TOK" \
                      -H 'Content-Type: application/json' -d @- \
                      -o /dev/null "$KC/admin/realms/$realm"

                echo "restored realm '$realm' from $RESTORED_FROM; $total user ids intact"
              done
          env:
            - name: RELEASE
              value: {{ .Release.Name | quote }}
            - name: REALMS
              value: {{ join " " $realms | quote }}
            - name: CONSOLE_REDIRECT_URI
              value: {{ include "queenswood.consoleRedirectUri" . | quote }}
            - name: CONSOLE_CLIENT_ID
              value: {{ .Values.keycloak.consoleClientId | quote }}
            - name: OPS_REDIRECT_URI
              value: {{ include "queenswood.opsRedirectUri" . | quote }}
            - name: OPS_CLIENT_ID
              value: {{ .Values.keycloak.opsClientId | quote }}
            - name: GOOGLE_CLIENT_ID
              value: {{ .Values.keycloak.googleClientId | quote }}
            - name: GOOGLE_IDP_ALIAS
              value: {{ .Values.keycloak.googleIdpAlias | quote }}
            - name: GOOGLE_REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: KC
              value: "http://{{ .Release.Name }}-keycloak-service:8080"
            {{- /* The supplied bootstrap admin where there is one, and
                   the operator's generated Secret otherwise. The two
                   have to agree: the operator's is reborn with the
                   cluster while the database keeps what it was created
                   with, so on a rebuild only the supplied one still
                   opens the realm. */}}
            {{- $adminSecret := include "queenswood.keycloakBootstrapAdminSecret" . }}
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $adminSecret | quote }}
                  key: username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $adminSecret | quote }}
                  key: password
          volumeMounts:
            - name: chart
              mountPath: /chart
            - name: source
              mountPath: /source
          {{- with .Values.keycloak.realmImport.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: chart
          configMap:
            name: {{ .Release.Name }}-realm-source
        - name: source
          emptyDir: {}
{{- end }}
