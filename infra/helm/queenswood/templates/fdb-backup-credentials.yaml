{{- /*
  The secret half of the pair FDB presents to the proxy, generated in
  the cluster and written into the Secret both sides read.

  Not rendered by the chart. Argo renders with `helm template`, where
  `lookup` returns nothing, so a value minted in a template is a fresh
  value on every render -- which the agents would sign with and the
  proxy would reject, once, on the next sync. That is the same fault
  the Keycloak signing key had; see templates/secret-keycloak.yaml.

  Not in Secret Manager either. It grants nothing in GCP and can be
  regenerated by deleting this Job and the key, which is the rotatable
  case in docs/recipes/infra/external-secrets.md: keep no copy anywhere.

  The access key id is not generated. It names which credential is
  being presented rather than proving anything, so it stays a value --
  which is what lets the FoundationDBBackup's accountName be rendered
  at all, since a generated one would not be known at render time.
*/ -}}
{{- define "queenswood.fdbBackupCredentialsPodSpec" -}}
restartPolicy: OnFailure
serviceAccountName: {{ .Release.Name }}-fdb-backup-credentials
containers:
  - name: generate
    image: alpine/k8s:1.37.0
    env:
      - name: KC_SECRET
        value: fdb-backup-credentials
      - name: ACCESS_KEY_ID
        value: {{ .Values.fdb.backup.accessKeyId | quote }}
      # Keyed without the port: fdbbackup strips it before looking the
      # account up.
      - name: CREDENTIALS_KEY
        value: {{ printf "%s@%s" .Values.fdb.backup.accessKeyId (include "queenswood.fdbBackupEndpoint" .) | quote }}
    command:
      - sh
      - -c
      - |
        set -eu
        existing=$(kubectl get secret "$KC_SECRET" \
          -o jsonpath='{.data.secret-access-key}' 2>/dev/null || true)
        if [ -n "$existing" ]; then
          echo "carrying forward the pair in $KC_SECRET"
          exit 0
        fi
        # tr -dc drops the padding and the characters SigV4's
        # canonical form would make ambiguous.
        SECRET=$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 40)
        if [ ${#SECRET} -ne 40 ]; then
          echo "could not generate a 40-character secret" >&2
          exit 1
        fi
        CREDS=$(printf '{"accounts":{"%s":{"secret":"%s"}}}' \
          "$CREDENTIALS_KEY" "$SECRET")
        kubectl patch secret "$KC_SECRET" --type merge -p "$(
          printf '{"data":{"secret-access-key":"%s","credentials":"%s"}}' \
            "$(printf '%s' "$SECRET" | base64 -w0)" \
            "$(printf '%s' "$CREDS" | base64 -w0)")" > /dev/null
        echo "generated the pair and stored it in $KC_SECRET"
{{- end -}}

{{- if and .Values.fdb.enabled .Values.fdb.backup.enabled }}
{{- $name := printf "%s-fdb-backup-credentials" .Release.Name -}}
{{- $secretName := "fdb-backup-credentials" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
rules:
  # resourceNames, so this is a grant on one Secret rather than on
  # secrets. No `create`: the Secret is rendered by the chart, and
  # resourceNames does not restrict create in any case.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secretName | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
# The name hashes the pod spec, so anything changing what the Job runs
# changes its name. A pod template is immutable once the Job exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%s" $name (include "queenswood.fdbBackupCredentialsPodSpec" . | sha256sum | trunc 10) }}
  labels:
    {{- include "queenswood.labels" . | nindent 4 }}
    app.kubernetes.io/component: fdb-backup-credentials
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "queenswood.podLabels" . | nindent 8 }}
        app.kubernetes.io/component: fdb-backup-credentials
    spec:
      {{- include "queenswood.fdbBackupCredentialsPodSpec" . | nindent 6 }}
{{- end }}
