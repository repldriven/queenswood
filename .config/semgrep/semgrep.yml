# Queenswood's semgrep rules, run after mono's (imported to
# .mono/.config/semgrep/semgrep.yml) by the pre-commit hook and by
# `just lint-branch`. What is here needs this workspace's namespaces or
# brick layout; a rule any Polylith workspace could run is mono's.
rules:
  - id: fdb-outside-store
    languages: [generic]
    severity: ERROR
    message: >-
      FDB required outside `store.clj`: a brick's persistence is confined
      to its store, which is what keeps the layers above it free of
      transaction plumbing (tdd/processor-bricks.md). Move the
      FDB-touching code into `store.clj` and call the new `store/*` fn,
      passing `txn`. A brick that owns no store and legitimately drives
      FDB itself puts `;; nosemgrep: fdb-outside-store — <reason>` on
      the line immediately above the require — semgrep reads only that
      one line, so the reason has to fit on it.
    pattern-regex: 'com\.repldriven\.queenswood\.fdb\.interface'
    paths:
      include:
        - "/components/*/src/**"
      exclude:
        - "store.clj"
        - "/components/fdb/**"

  - id: domain-requires-fdb-or-store
    languages: [generic]
    severity: ERROR
    message: >-
      `domain.clj` requires FDB or a store: domain code is pure — it
      takes plain data and returns plain data or a rejection
      (tdd/processor-bricks.md). The caller in `core.clj` does the read
      and passes the result in; a value needing schema translation is
      translated in `store.clj`.
    pattern-regex: 'com\.repldriven\.queenswood\.(?:[a-z0-9-]+\.store|fdb\.interface)'
    paths:
      include:
        - "/components/*/src/**/domain.clj"

  - id: domain-schema-conversion
    languages: [generic]
    severity: ERROR
    message: >-
      Schema type-conversion in `domain.clj`: domain works on
      Clojure-shaped maps, and conversion to and from FDB record types
      happens at the storage boundary in `store.clj`
      (tdd/processor-bricks.md).
    pattern-regex: '\bschema/[A-Za-z][A-Za-z0-9_]*->[A-Za-z]'
    paths:
      include:
        - "/components/*/src/**/domain.clj"

  - id: no-changelog-watcher
    languages: [generic]
    severity: ERROR
    message: >-
      `watcher.clj`: reactive work reaches a brick as an event off the
      changelog relay and is handled in `events.clj` (ADR-0021). A
      watcher runs domain work inside the changelog checkpoint
      transaction, which is what the relay exists to stop.
    pattern-regex: '\(ns\s'
    paths:
      include:
        - "**/watcher.clj"

  - id: provider-name-in-domain
    languages: [generic]
    severity: ERROR
    message: >-
      A provider's key as a string or keyword outside the bricks named
      after it: which provider answers is the bank's choice, resolved
      through its `<kind>-provider/providers` entry, never a branch on a
      key in a domain brick (tdd/bank-providers.md). Read what varies from
      the provider's declaration instead. An example or a fixture that
      names a key puts `;; nosemgrep: provider-name-in-domain — <reason>`
      on the line immediately above it.
    pattern-regex: '(?i)[":](modulr|form3|clearbank|zyphe|onfido)\b'
    paths:
      include:
        - "/components/*/src/**"
        - "/bases/*/src/**"
      exclude:
        - "/components/modulr-*/**"
        - "/components/form3-*/**"
        - "/components/clearbank-*/**"
        - "/components/zyphe-*/**"
        - "/components/onfido-*/**"
        - "/components/test-*/**"
        - "/components/schema/**"
        - "/bases/modulr-*/**"
        - "/bases/form3-*/**"
        - "/bases/clearbank-*/**"
        - "/bases/zyphe-*/**"
        - "/bases/onfido-*/**"
        - "/bases/external-adapters/**"
        - "/bases/monolith/**"

  - id: brick-test-drives-pipeline
    languages: [generic]
    severity: ERROR
    message: >-
      A brick test drives the command pipeline or the bus: it sends a
      command or an event, or subscribes to a channel. A brick test proves
      the brick's own functions and store; driving the pipeline is a
      scenario (tdd/scenario-testing.md). Call the brick's core or domain
      function instead, or move the case to test-scenarios or
      test-api-scenarios. A site that must stay puts
      `;; nosemgrep: brick-test-drives-pipeline` on the line immediately
      above it, with its reason on the comment line above that.
    pattern-regex: '(#''?)?\b(processor/process|commands/dispatch|message-bus/send|message-bus/subscribe|event/publish)\b'
    paths:
      include:
        - "/components/*/test/**"
        - "/bases/*/test/**"
      exclude:
        - "/components/test-*/**"
        - "/components/changelog-relay/**"
