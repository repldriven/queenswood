# Queenswood's semgrep rules, run after mono's (imported to
# .mono/.config/semgrep/semgrep.yml) by the pre-commit hook and by
# `just lint-branch`. What is here needs this workspace's namespaces or
# brick layout; a rule any Polylith workspace could run is mono's.
rules:
  - id: fdb-outside-store
    languages: [generic]
    severity: ERROR
    message: >-
      FDB required outside `store.clj`: a brick's persistence is confined
      to its store, which is what keeps the layers above it free of
      transaction plumbing (tdd/processor-bricks.md). Move the
      FDB-touching code into `store.clj` and call the new `store/*` fn,
      passing `txn`. A brick that owns no store and legitimately drives
      FDB itself puts `;; nosemgrep: fdb-outside-store — <reason>` on
      the line immediately above the require — semgrep reads only that
      one line, so the reason has to fit on it.
    pattern-regex: 'com\.repldriven\.queenswood\.fdb\.interface'
    paths:
      include:
        - "/components/*/src/**"
      exclude:
        - "store.clj"
        - "/components/fdb/**"

  - id: domain-requires-fdb-or-store
    languages: [generic]
    severity: ERROR
    message: >-
      `domain.clj` requires FDB or a store: domain code is pure — it
      takes plain data and returns plain data or a rejection
      (tdd/processor-bricks.md). The caller in `core.clj` does the read
      and passes the result in; a value needing schema translation is
      translated in `store.clj`.
    pattern-regex: 'com\.repldriven\.queenswood\.(?:[a-z0-9-]+\.store|fdb\.interface)'
    paths:
      include:
        - "/components/*/src/**/domain.clj"

  - id: domain-schema-conversion
    languages: [generic]
    severity: ERROR
    message: >-
      Schema type-conversion in `domain.clj`: domain works on
      Clojure-shaped maps, and conversion to and from FDB record types
      happens at the storage boundary in `store.clj`
      (tdd/processor-bricks.md).
    pattern-regex: '\bschema/[A-Za-z][A-Za-z0-9_]*->[A-Za-z]'
    paths:
      include:
        - "/components/*/src/**/domain.clj"

  - id: no-changelog-watcher
    languages: [generic]
    severity: ERROR
    message: >-
      `watcher.clj`: reactive work reaches a brick as an event off the
      changelog relay and is handled in `events.clj` (ADR-0021). A
      watcher runs domain work inside the changelog checkpoint
      transaction, which is what the relay exists to stop.
    pattern-regex: '\(ns\s'
    paths:
      include:
        - "**/watcher.clj"
