name: GitHub Pages

# The site is the docs of a release, deployed once per release. The
# Release workflow dispatches this on the tag `v<version>` it has just
# written, so the deployment's ref is the release and the run's actor is
# `github-actions[bot]`. A dispatch by anyone else, or on any other ref,
# deploys nothing; a rerun keeps the original actor, so rerunning a
# failed deploy still works. The environment admits only `v*` tags.
on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      github.actor == 'github-actions[bot]'
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # versions.json is the single source for the native toolchain. The
      # steps below read it rather than repeating the numbers, so CI cannot
      # drift from the nix devshell.
      - name: Read pinned toolchain versions
        id: versions
        run: |
          {
            echo "fdb=$(jq -r '.foundationdb.version' versions.json)"
            echo "protoc=$(jq -r '.protoc.version' versions.json)"
            echo "protoc_gen_clojure=$(jq -r '."protoc-gen-clojure".version' versions.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest

      - name: Setup Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ steps.versions.outputs.protoc }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc-gen-clojure
        env:
          VERSION: ${{ steps.versions.outputs.protoc_gen_clojure }}
        run: |
          sudo curl -L "https://github.com/protojure/protoc-plugin/releases/download/v${VERSION}/protoc-gen-clojure" -o /usr/local/bin/protoc-gen-clojure
          sudo chmod +x /usr/local/bin/protoc-gen-clojure

      - name: Install FoundationDB client library
        env:
          VERSION: ${{ steps.versions.outputs.fdb }}
        run: |
          curl -LO "https://github.com/apple/foundationdb/releases/download/${VERSION}/foundationdb-clients_${VERSION}-1_amd64.deb"
          sudo dpkg -i "foundationdb-clients_${VERSION}-1_amd64.deb"

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-

      - name: Prep and export OpenAPI spec
        run: |
          clojure -X:deps prep :aliases '[:dev]'
          clojure -Sdeps '{:aliases {:dev {:main-opts []}}}' -M:dev -m com.repldriven.queenswood.api.export-spec docs/openapi.yaml

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
