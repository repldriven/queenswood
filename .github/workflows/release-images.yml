name: Release Images

# Builds the Queenswood images a push invalidated and pushes them to
# ghcr.io with the `:latest` tag. Runs from `main` (push) or manual
# trigger, which builds all of them.
#
# Fans out by architecture, not by service. Each matrix arm runs natively
# on a runner of the right arch, so nothing builds under QEMU, and calls
# `docker buildx bake` once for every selected target on that one runner:
# a single invocation shares the Clojure base layer and the Maven
# `--mount=type=cache` across them, which a matrix-per-service does not.
# Each arm pushes `:latest-<arch>`, and the `manifest` job stitches the
# per-arch tags into one multi-arch `:latest` with
# `docker buildx imagetools create`.
#
# First-run setup: GHCR packages are private by default. After the first
# successful run, visit
#   https://github.com/users/<owner>/packages/container/<service>/settings
# for each service and flip the visibility to "public". Pulls into the
# kind cluster rely on public access.

on:
  push:
    branches: [main]
  workflow_dispatch:

# `latest` is a single moving tag — serialise concurrent runs to
# avoid two pushes racing to update the same image tag.
concurrency:
  group: release-images-latest
  cancel-in-progress: false

permissions:
  contents: read
  packages: write       # push images to ghcr.io

jobs:
  # Which images the push invalidated.
  changes:
    runs-on: ubuntu-latest

    outputs:
      # Space-separated bake targets, consumed by both jobs below.
      targets: ${{ steps.targets.outputs.targets }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The classifier diffs against `github.event.before`, which has
          # to be in the local history.
          fetch-depth: 0

      # Bucket definitions live in the script, shared with test.yml. The
      # service Dockerfile is `COPY . .` minus its own
      # Dockerfile.dockerignore: a console edit invalidates the JVM build
      # context, but not the uberjar, which carries no console or ui code.
      - name: Classify changed paths
        id: decide
        env:
          ALL: ${{ github.event_name == 'workflow_dispatch' }}
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: ./scripts/ci-changed-paths.sh

      - name: Compose bake targets
        id: targets
        env:
          SERVICES: ${{ steps.decide.outputs.services }}
          CONSOLE: ${{ steps.decide.outputs.console }}
        run: |
          targets=()
          # bake's `services` matrix is one target per deployable project.
          if [[ "$SERVICES" == "true" ]]; then
            targets+=( $(ls projects/) )
          fi
          if [[ "$CONSOLE" == "true" ]]; then
            targets+=( console )
          fi
          echo "targets=${targets[*]}" >> "$GITHUB_OUTPUT"
          echo "building: ${targets[*]:-<nothing>}"

  build:
    needs: changes
    if: needs.changes.outputs.targets != ''
    strategy:
      # An amd64 failure shouldn't kill the arm64 run (or vice versa);
      # better to push one arch's `:latest-<arch>` and skip the
      # manifest step than to lose both.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runs-on: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The console image bundles docs/, part of which is mono's.
      - name: Import mono's share
        run: ./scripts/mono-import.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Native arch per runner means MULTI_ARCH stays unset (bake's
      # `platforms_default = []` lets BuildKit fall back to the host
      # platform) — no QEMU emulation, no cross-arch JVM compile
      # penalty.
      #
      # Tag with the arch suffix so the two arms don't clobber each
      # other. The `manifest` job below stitches `:latest-amd64` +
      # `:latest-arm64` into the canonical `:latest`.
      #
      # `cache-from`/`cache-to=type=gha` scoped per arch so each
      # runner has its own layer cache.
      - name: Build and push affected images (${{ matrix.arch }})
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}/queenswood
          TAG: latest-${{ matrix.arch }}
          TARGETS: ${{ needs.changes.outputs.targets }}
          # Provenance for the OCI labels in bake.hcl. The published tag
          # is `latest`, so the commit is otherwise unrecoverable from a
          # pulled image. CREATED is computed in the step body because
          # `env:` cannot run a command.
          REVISION: ${{ github.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export CREATED
          # Unquoted on purpose: TARGETS is a space-separated list of
          # bake target names and must word-split into arguments.
          docker buildx bake \
            -f infra/docker/bake.hcl \
            --set "*.platform=${{ matrix.platform }}" \
            --set "*.output=type=registry,push=true" \
            --set "*.cache-from=type=gha,scope=release-${{ matrix.arch }}" \
            --set "*.cache-to=type=gha,scope=release-${{ matrix.arch }},mode=max" \
            $TARGETS

  manifest:
    needs: [changes, build]
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `imagetools create -t :latest :latest-amd64 :latest-arm64`
      # produces a manifest list for each image whose two referenced
      # manifests are the per-arch images pushed above. No image data
      # is re-uploaded — only the manifest list is created.
      #
      # Only the images this run built: anything else has no fresh
      # `:latest-<arch>` pair to stitch.
      - name: Stitch multi-arch manifests
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}/queenswood
          TARGETS: ${{ needs.changes.outputs.targets }}
        run: |
          for img in $TARGETS; do
            docker buildx imagetools create \
              -t "$REGISTRY/$img:latest" \
              "$REGISTRY/$img:latest-amd64" \
              "$REGISTRY/$img:latest-arm64"
          done
