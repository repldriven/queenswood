name: Prune GHCR Untagged

# Deletes untagged manifests from GHCR for every Queenswood package --
# the service images and the three Helm charts. Every
# `release-images.yml` run pushes new content to the moving
# `:latest-<arch>` tags and rebuilds the `:latest` manifest list; the
# digests behind the *previous* tags become untagged but still occupy
# storage. Re-publishing a chart version supersedes its digest the same
# way. Without periodic pruning they accumulate indefinitely.
#
# Three things this has to get right, and the first two have bitten:
#
# 1. Images are published under `ghcr.io/<owner>/queenswood/<name>`,
#    so the GHCR package is `queenswood/<name>` and the REST path
#    needs it percent-encoded. A bare `<name>` fails with "Package
#    not found" -- which is silent enough to look like a clean run.
#    Charts publish to `ghcr.io/<owner>/<name>` instead, so their
#    package name carries no slash and the encoding is a no-op.
#
# 2. "Untagged" does not mean "unreferenced". A tagged multi-arch
#    index points at per-platform manifests that GHCR itself reports
#    with no tags, so deleting every untagged version destroys the
#    image `:latest` resolves to. Every digest a tagged version
#    references is collected first and kept.
#
# 3. A chart is a single manifest rather than an index, so the manifest
#    media types have to be in the Accept header -- against index types
#    alone GHCR answers 404 and the step dies under `set -e`. Listing
#    both is safe: GHCR still returns the index for a multi-arch image
#    whenever one is acceptable, so image pruning is unchanged.

on:
  # Sunday 03:30 UTC. Off-peak for GHCR + no overlap with
  # release-images.yml which fires on every push to main.
  schedule:
    - cron: '30 3 * * 0'
  workflow_dispatch:

# Manual + scheduled runs queue rather than overlap.
concurrency:
  group: prune-ghcr
  cancel-in-progress: false

permissions:
  packages: write       # delete untagged versions on GHCR

jobs:
  prune:
    runs-on: ubuntu-latest
    strategy:
      # Don't let a single package's failure (e.g. transient API
      # error, or a package that doesn't exist yet on a fresh
      # registry) cancel the rest.
      fail-fast: false
      matrix:
        # Images must track the target list in infra/docker/bake.hcl,
        # charts the one release.yml pushes.
        package:
          - queenswood/migrator-service
          - queenswood/bootstrap-service
          - queenswood/api-service
          - queenswood/monolith-service
          - queenswood/financial-processors-service
          - queenswood/operational-processors-service
          - queenswood/exclusive-dispatchers-service
          - queenswood/external-adapters-service
          - queenswood/console
          - queenswood
          - keycloak-operator
    steps:
      - name: Prune untagged versions of ${{ matrix.package }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PKG: ${{ matrix.package }}
          # Untagged digests are the only way to rebuild a previous
          # `:latest` with `imagetools create`, so keep a few as a
          # rollback path after a bad release.
          KEEP: '5'
        run: |
          set -euo pipefail

          encoded="${PKG//\//%2F}"
          versions=$(gh api \
            "/orgs/$OWNER/packages/container/$encoded/versions" --paginate)

          total=$(jq 'length' <<<"$versions")
          echo "$PKG: $total version(s)"

          # Anonymous pull token is enough to read manifests.
          regtoken=$(curl -fsSL \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:$OWNER/$PKG:pull" \
            | jq -r .token)

          keep=$(jq -r '.[] | select(.metadata.container.tags != []) | .name' \
                   <<<"$versions" \
                 | while read -r digest; do
                     curl -fsSL -H "Authorization: Bearer $regtoken" \
                       -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json" \
                       "https://ghcr.io/v2/$OWNER/$PKG/manifests/$digest" \
                       | jq -r '.manifests[]?.digest // empty'
                   done | sort -u)

          echo "$PKG: $(grep -c . <<<"$keep" || true) digest(s) referenced by a tag"

          ids=$(jq -r --arg keep "$keep" --argjson n "$KEEP" '
                  ($keep | split("\n") | map(select(length > 0))) as $k
                  | [ .[]
                      | select(.metadata.container.tags == [])
                      | select(.name as $d | ($k | index($d)) | not) ]
                  | sort_by(.created_at) | reverse
                  | .[$n:]
                  | .[].id' <<<"$versions")

          n=$(grep -c . <<<"$ids" || true)
          if [ "$n" = "0" ]; then
            echo "$PKG: nothing to prune"
            exit 0
          fi

          echo "$PKG: deleting $n untagged version(s)"
          for id in $ids; do
            gh api -X DELETE \
              "/orgs/$OWNER/packages/container/$encoded/versions/$id" --silent
          done
          echo "$PKG: done"
