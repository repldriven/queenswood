name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Escape hatch: runs every job regardless of what changed.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # Which trees a change touched. Classified in-workflow rather than with
  # `on.push.paths`: branch protection requires the `tests` check, and a
  # workflow skipped at the trigger never reports it.
  changes:
    runs-on: ubuntu-latest

    outputs:
      clojure: ${{ steps.decide.outputs.clojure }}
      js: ${{ steps.decide.outputs.js }}
      helm: ${{ steps.decide.outputs.helm }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The classifier needs both ends of the range in local history,
          # and diffs from the merge base on a pull request.
          fetch-depth: 0

      # Bucket definitions live in the script, shared with
      # release-images.yml.
      - name: Classify changed paths
        id: decide
        env:
          ALL: ${{ github.event_name == 'workflow_dispatch' }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/ci-changed-paths.sh

  # Ungated — the pins it checks live in Helm values and Dockerfile ARG
  # defaults, not only in deps.edn.
  versions:
    runs-on: ubuntu-latest
    name: check pinned versions

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check pinned versions
        run: ./scripts/check-versions.sh

  discover:
    needs: changes
    if: needs.changes.outputs.clojure == 'true'
    runs-on: ubuntu-latest

    outputs:
      projects: ${{ steps.projects.outputs.matrix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Discover projects
        id: projects
        run: |
          # Every service project under projects/ plus a `dev` entry for
          # the bricks that belong to no deployable service and so appear
          # in no other matrix entry: test-scenarios, test-model,
          # test-projections and test-api-scenarios, which carry the
          # end-to-end and model-equality coverage.
          matrix=$(ls projects/ | jq -Rc '[., inputs] + ["dev"]')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Discovered projects: $matrix"

  test:
    needs: discover
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}

    name: test (${{ matrix.project }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # versions.json is the single source for the native toolchain. The
      # steps below read it rather than repeating the numbers, so CI cannot
      # drift from the nix devshell.
      - name: Read pinned toolchain versions
        id: versions
        run: |
          {
            echo "fdb=$(jq -r '.foundationdb.version' versions.json)"
            echo "protoc=$(jq -r '.protoc.version' versions.json)"
            echo "protoc_gen_clojure=$(jq -r '."protoc-gen-clojure".version' versions.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: latest

      - name: Setup Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ steps.versions.outputs.protoc }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc-gen-clojure
        env:
          VERSION: ${{ steps.versions.outputs.protoc_gen_clojure }}
        run: |
          sudo curl -L "https://github.com/protojure/protoc-plugin/releases/download/v${VERSION}/protoc-gen-clojure" -o /usr/local/bin/protoc-gen-clojure
          sudo chmod +x /usr/local/bin/protoc-gen-clojure

      - name: Install FoundationDB client library and lcov
        env:
          VERSION: ${{ steps.versions.outputs.fdb }}
        run: |
          curl -LO "https://github.com/apple/foundationdb/releases/download/${VERSION}/foundationdb-clients_${VERSION}-1_amd64.deb"
          sudo dpkg -i "foundationdb-clients_${VERSION}-1_amd64.deb"
          sudo apt-get install -y lcov
          sudo sed -i 's/lcov_branch_coverage/branch_coverage/' /etc/lcovrc

      - name: Verify Docker
        run: |
          docker --version
          docker ps

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-

      # The coverage floor is 80 for dev and 0 for a service project: a
      # service imports its infra from mono without mono's tests, so the
      # coverage measured here is not representative of the code it runs.
      - name: Run tests
        env:
          TESTCONTAINERS_REUSE_ENABLE: "true"
          COVERAGE: "true"
          COVERAGE_THRESHOLD: ${{ matrix.project == 'dev' && '80' || '0' }}
          # The JUnit reporter trims this from suite and classname
          # attributes, so the published report reads `bank.core-test`
          # rather than the full namespace. mono's runner cannot default
          # it -- the prefix is the consuming workspace's own.
          JUNIT_NS_PREFIX: com.repldriven.queenswood.
        run: |
          # Codegen runs in a subprocess per prep lib, and clojure.main there
          # prints one frame and writes the rest to a temp file the runner
          # discards. report=stderr puts the whole trace in the log instead;
          # JAVA_TOOL_OPTIONS because the subprocess is the one that throws.
          JAVA_TOOL_OPTIONS=-Dclojure.main.report=stderr \
            clojure -X:deps prep :aliases '[:dev]'
          if [[ "${{ matrix.project }}" == "dev" ]]; then
            clojure -M:poly test project:dev \
              brick:test-scenarios:test-model:test-projections:test-api-scenarios \
              :all
          else
            clojure -M:poly test project:${{ matrix.project }} :all
          fi

      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Results (${{ matrix.project }})
          path: target/test-results/**/*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.project }}
          path: target/test-results/**/*.xml
          retention-days: 7

      # Polylith writes coverage to `target/coverage/<project-name>/`
      # using the project NAME, not its alias. For the dev matrix
      # entry the path is therefore `target/coverage/development/`,
      # not `target/coverage/dev/`. The ternary keeps a single
      # workflow expression for every entry.
      - name: Report coverage
        if: always()
        uses: zgosalvez/github-actions-report-lcov@v7.1.0
        with:
          coverage-files: target/coverage/${{ matrix.project == 'dev' && 'development' || matrix.project }}/lcov.info
          minimum-coverage: ${{ matrix.project == 'dev' && 80 || 0 }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true
          title-prefix: "[${{ matrix.project }}]"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.project }}
          path: target/coverage/${{ matrix.project == 'dev' && 'development' || matrix.project }}/
          retention-days: 7

  # Compiles the console bundle and the ui showcase. These packages carry
  # no test suite; the build is what catches a component missing from ui's
  # index.js, or a Svelte template that does not parse.
  js:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    name: js build

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Matches the build stage of infra/docker/console/Dockerfile.
      # package-manager-cache defaults on and shells out to the runner's
      # global yarn 1, which refuses a project pinned to yarn 4; corepack
      # below provides the pinned version.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable corepack
        run: corepack enable

      # --immutable fails if the lockfile would change.
      - name: Install
        run: corepack yarn install --immutable

      # Fails if the workspace resolves two copies of a package. Both
      # members declare svelte, vite and the vite plugin, and two svelte
      # copies compile to mutually unreadable context.
      - name: Check for duplicate resolutions
        run: corepack yarn dedupe --check

      - name: Build console
        run: corepack yarn workspace console build

      - name: Build ui showcase
        run: corepack yarn workspace @queenswood/ui build

  helm:
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    name: helm validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: latest

      - name: Install kubeconform
        run: |
          version=v0.7.0
          curl -L \
            "https://github.com/yannh/kubeconform/releases/download/$version/kubeconform-linux-amd64.tar.gz" \
            | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: Validate chart
        run: |
          # Static-only: helm lint + helm template piped through
          # kubeconform. No cluster, no image builds. CRDs from the
          # vendored FDB operator subchart bypass kubeconform via
          # -ignore-missing-schemas.
          helm dependency update infra/helm/queenswood
          helm lint infra/helm/queenswood
          helm template queenswood infra/helm/queenswood \
            --set image.tag=ci \
            | kubeconform -strict -ignore-missing-schemas -summary
          # Also validate the modular-monolith profile (Pulsar off,
          # single bank-monolith service enabled).
          helm lint infra/helm/queenswood -f infra/helm/queenswood/values-monolith.yaml
          helm template queenswood infra/helm/queenswood \
            -f infra/helm/queenswood/values-monolith.yaml \
            --set image.tag=ci \
            | kubeconform -strict -ignore-missing-schemas -summary

  # Gate job for branch protection — a single required check. `skipped`
  # passes; only failure and cancellation block.
  tests:
    if: always()
    needs: [versions, test, js, helm]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: >-
            versions=${{ needs.versions.result }}
            test=${{ needs.test.result }}
            js=${{ needs.js.result }}
            helm=${{ needs.helm.result }}
        run: |
          blocked=0
          for entry in $RESULTS; do
            case "${entry#*=}" in
              success|skipped) echo "ok       $entry" ;;
              *)               echo "BLOCKING $entry"; blocked=1 ;;
            esac
          done
          exit "$blocked"
