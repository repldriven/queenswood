name: Release

# A release is a merged pull request that bumps the chart's version.
# `just release` opens it, and this runs once that commit's Tests are
# green: it lints the OpenAPI document the commit exports, builds every
# image at the commit, tags them with the version, packages and pushes the chart, tags the commit `v<version>`
# and publishes the GitHub release, then deploys the release's docs to
# GitHub Pages, prunes the untagged images a retried release left
# behind and deletes the workflow runs nobody needs any more. Nothing
# here runs on a workflow button, and nothing is built for a commit that
# is not a release.
#
# One condition, read at the commit Tests ran on: the tag `v<version>`
# does not exist yet. The first green commit on main whose declared
# version has no tag is the one published, and the tag it writes is what
# stops a later run publishing it again -- so a Tests run cancelled by a
# later push, or a release that failed part way, is picked up by the
# next green push once whatever failed is fixed.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CHART: infra/helm/queenswood/Chart.yaml
  REGISTRY: ghcr.io/${{ github.repository_owner }}/queenswood

jobs:
  check:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.decide.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Decide whether this commit is a release
        id: decide
        run: |
          version=$(awk '/^version:/ {print $2}' "$CHART")
          app=$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' "$CHART")
          if [[ -z "$version" || "$version" != "$app" ]]; then
            echo "::error::$CHART carries version '$version' and appVersion '$app'; just release keeps them equal"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "releasing $version from $GITHUB_SHA"
          echo "release=true" >> "$GITHUB_OUTPUT"

  openapi-lint:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read pinned toolchain versions
        id: versions
        run: |
          {
            echo "fdb=$(jq -r '.foundationdb.version' versions.json)"
            echo "protoc=$(jq -r '.protoc.version' versions.json)"
            echo "protoc_gen_clojure=$(jq -r '."protoc-gen-clojure".version' versions.json)"
            echo "spectral=$(jq -r '.spectral.version' versions.json)"
            echo "spectral_sha256=$(jq -r '.spectral.sha256."linux-x64"' versions.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: latest

      - name: Setup Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ steps.versions.outputs.protoc }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install protoc-gen-clojure
        env:
          VERSION: ${{ steps.versions.outputs.protoc_gen_clojure }}
        run: |
          sudo curl -L "https://github.com/protojure/protoc-plugin/releases/download/v${VERSION}/protoc-gen-clojure" -o /usr/local/bin/protoc-gen-clojure
          sudo chmod +x /usr/local/bin/protoc-gen-clojure

      - name: Install FoundationDB client library
        env:
          VERSION: ${{ steps.versions.outputs.fdb }}
        run: |
          curl -LO "https://github.com/apple/foundationdb/releases/download/${VERSION}/foundationdb-clients_${VERSION}-1_amd64.deb"
          sudo dpkg -i "foundationdb-clients_${VERSION}-1_amd64.deb"

      - name: Install Spectral
        env:
          VERSION: ${{ steps.versions.outputs.spectral }}
          SHA256: ${{ steps.versions.outputs.spectral_sha256 }}
        run: |
          curl -fsSL "https://github.com/stoplightio/spectral/releases/download/v${VERSION}/spectral-linux-x64" -o spectral
          actual="sha256-$(openssl dgst -sha256 -binary spectral | base64)"
          if [[ "$actual" != "$SHA256" ]]; then
            echo "::error::spectral-linux-x64 is $actual; versions.json pins $SHA256"
            exit 1
          fi
          sudo install -m 755 spectral /usr/local/bin/spectral

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-

      # The same export and ruleset as `just openapi-lint`.
      - name: Export and lint the OpenAPI document
        run: |
          clojure -X:deps prep :aliases '[:dev]'
          clojure -Sdeps '{:aliases {:dev {:main-opts []}}}' -M:dev -m com.repldriven.queenswood.api.export-spec "$RUNNER_TEMP/openapi.yaml"
          spectral lint --ruleset .config/spectral/spectral.yaml "$RUNNER_TEMP/openapi.yaml"

  images:
    needs: [check, openapi-lint]
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-26.04
            platform: linux/amd64
          - arch: arm64
            runs-on: ubuntu-26.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Import mono's share
        run: ./scripts/mono-import.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push every image (${{ matrix.arch }})
        env:
          TAG: ${{ needs.check.outputs.version }}-${{ matrix.arch }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export CREATED
          # No targets named: the bake file's default group is every
          # service and the console, since a release is a complete set.
          docker buildx bake \
            -f infra/docker/bake.hcl \
            --set "*.platform=${{ matrix.platform }}" \
            --set "*.output=type=registry,push=true" \
            --set "*.cache-from=type=gha,scope=release-${{ matrix.arch }}" \
            --set "*.cache-to=type=gha,scope=release-${{ matrix.arch }},mode=max"

  publish:
    needs: [check, images]
    permissions:
      contents: write       # the tag and the release
      packages: write       # the multi-arch manifests and the chart
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stitch each image's multi-arch manifest
        run: |
          # The images are the bake file's targets, not the projects
          # directory: the demo bank's API is a project the chart never
          # deploys, and the bake file leaves it out on purpose.
          images=$(docker buildx bake -f infra/docker/bake.hcl --print \
                     | jq -r '.target | keys[]')
          for img in $images; do
            docker buildx imagetools create \
              -t "$REGISTRY/$img:$VERSION" \
              "$REGISTRY/$img:$VERSION-amd64" \
              "$REGISTRY/$img:$VERSION-arm64"
          done

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: latest

      - name: Package the chart
        run: |
          mkdir -p release
          helm dependency update infra/helm/queenswood
          helm package infra/helm/queenswood -d release
          test -f "release/queenswood-$VERSION.tgz"

      - name: Push the chart to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io \
              --username ${{ github.actor }} \
              --password-stdin
          helm push "release/queenswood-$VERSION.tgz" \
            oci://ghcr.io/${{ github.repository_owner }}

      - name: Write the quickstart README
        run: |
          cat > release/README.md <<'EOF'
          # Queenswood — local Kubernetes quickstart

          This release publishes the Helm chart at
          `oci://ghcr.io/__OWNER__/queenswood:__VERSION__` and the images it
          installs, tagged `__VERSION__` under `ghcr.io/__OWNER__/queenswood/`.
          The chart's images default to its own version, so installing the
          chart is installing the release. It deploys the entire Queenswood
          platform (API, processors, adapters/simulators, the Svelte
          front-end, Pulsar, FoundationDB) into a local Kubernetes cluster.

          ## Prerequisites

          - Docker
          - [kind](https://kind.sigs.k8s.io/)
          - [Helm](https://helm.sh/) (>= 3.14)
          - kubectl

          ## Deploy

          1. **Create a local cluster:**
             ```bash
             kind create cluster --name queenswood
             ```

          2. **Install the chart** straight from the OCI registry:
             ```bash
             helm install queenswood \
               oci://ghcr.io/__OWNER__/queenswood --version __VERSION__ \
               -n queenswood --create-namespace \
               -f https://raw.githubusercontent.com/__OWNER__/queenswood/v__VERSION__/infra/helm/queenswood/values-local.yaml \
               --wait --timeout 10m
             ```
             `values-local.yaml` adds the `dev` user you sign in as;
             the chart adds none without it.

          3. **Port-forward** the API and the SPAs
             (separate terminals):
             ```bash
             kubectl -n queenswood port-forward svc/queenswood-api-service 8080:8080
             kubectl -n queenswood port-forward svc/queenswood-console     8081:8080
             ```
             The console reverse-proxies its realm's Keycloak at
             `/keycloak/*`, so no separate Keycloak port-forward is
             needed.

          4. **Sign in via Keycloak.** Open
             <http://localhost:8081> for the organisation console
             (`console`). It redirects to its same-origin
             `/keycloak/realms/...` flow; nginx proxies the OAuth
             dance to the in-cluster Keycloak and proxies `/v1/*` to
             the in-cluster api-service. Sign in as `dev` / `dev`,
             the user `values-local.yaml` adds. The Keycloak admin
             console rides the same proxy at
             <http://localhost:8081/keycloak/admin> with `admin` /
             `admin`. OpenAPI docs at <http://localhost:8080/scalar>.

          ## Tear down

          ```bash
          helm uninstall queenswood -n queenswood
          kind delete cluster --name queenswood
          ```
          EOF
          OWNER="${{ github.repository_owner }}"
          sed -i "s/__VERSION__/$VERSION/g; s/__OWNER__/$OWNER/g" \
            release/README.md

      - name: Tag the commit and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "v$VERSION" "$SHA"
          git push origin "v$VERSION"
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file release/README.md \
            --target "$SHA" \
            "release/queenswood-$VERSION.tgz" \
            release/README.md
          echo "Released v$VERSION from \`$SHA\`." >> "$GITHUB_STEP_SUMMARY"

  pages:
    needs: [check, publish]
    permissions:
      actions: write        # dispatch the Pages workflow
    runs-on: ubuntu-26.04
    steps:
      - name: Deploy the release's docs to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh workflow run pages.yml \
            -R "${{ github.repository }}" --ref "v$VERSION"

  prune:
    needs: publish
    permissions:
      packages: write       # delete untagged versions on GHCR
    uses: ./.github/workflows/prune-ghcr.yml

  runs:
    needs: [publish, pages]
    permissions:
      actions: write        # delete workflow runs
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Delete the workflow runs nobody needs any more
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Under the token's 1,000 requests an hour, with room for the
          # listing; whatever is left goes at the next release.
          LIMIT: '500'
        run: ./scripts/prune-workflow-runs.sh
