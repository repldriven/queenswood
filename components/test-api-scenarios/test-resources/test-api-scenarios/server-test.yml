handler: !system/required-component
interceptors: !system/component
  system/component-kind: server/interceptors
  identity-provider: !system/ref keycloak.identity-provider
  # The providers the installation offers, by kind: what a bank's
  # create may name, and what its reads and product publishing
  # resolve against.
  providers:
    payment: !system/ref payment-provider.providers
    idv: !system/ref idv-provider.providers
  # API-scenario tests only ever mint service JWTs from the orgs
  # realm; the ops identity-provider is wired alongside so the
  # auth dispatch logic stays uniform with bank-api-service and
  # bank-monolith.
  identity-providers:
    - !system/ref keycloak.identity-provider
    - !system/ref keycloak.identity-provider-ops
  expected-audiences:
    - queenswood-api-test
    - queenswood-api-live
    - queenswood-console
    - queenswood-app
  user-client-ids:
    - queenswood-console
    - queenswood-app
  audiences-by-status:
    bank-status-test: queenswood-api-test
    bank-status-live: queenswood-api-live
  dispatchers:
    banks: !system/ref banks-dispatcher.dispatcher
    memberships: !system/ref memberships-dispatcher.dispatcher
    parties: !system/ref parties.dispatcher
    cash-accounts: !system/ref cash-accounts-dispatcher.dispatcher
    payments: !system/ref payments-dispatcher.dispatcher
    transactions: !system/ref transactions-dispatcher.dispatcher
    payee-checks: !system/ref payee-checks.dispatcher
    companies: !system/ref companies-dispatcher.dispatcher
    idvs: !system/ref idvs-dispatcher.dispatcher
  avro: !system/ref avro.serde
  # One of the platform's own hosts, as WEBHOOK_PLATFORM_HOSTS names them
  # in a deployment: webhook-endpoints/platform-host-refused.edn registers it.
  platform-hosts: "93.184.216.35"
  # The webhook address rule, as registration reads it: HTTP admitted
  # and loopback reachable, so an endpoint on the rig's receiver may be
  # registered.
  webhook-address-rule:
    allowed-schemes: [http, https]
    blocked-ranges: !include test-api-scenarios/webhook-blocked-ranges.yml
  record-db: !system/ref fdb.record-db
  record-store: !system/ref fdb.meta-store
jetty-adapter: !system/component
  system/component-kind: server/jetty-adapter
  handler: !system/ref server.handler
  interceptors: !system/ref server.interceptors
  options:
    port: 0
