# A tier whose policy refuses a write a developer can reach, so a
# scenario can show a policy refusal beside a role's. The platform and
# micro tiers allow every write a route exposes.
no-webhooks: !system/component
  system/component-kind: policies/policy
  record-db: !system/ref fdb.record-db
  record-store: !system/ref fdb.meta-store
  policy:
    policy-id: pol.00000000000000000000000004
    name: No-webhooks policy
    description: No-webhooks tier - refuses registering webhook endpoints
    status: !keyword policy-status-active
    labels: !strs
      tier: no-webhooks
    category: !keyword policy-category-restricted
    capabilities:
      - effect: !keyword effect-deny
        reason: "No-webhooks tier - deny registering webhook endpoints"
        kind:
          webhook-endpoint:
            action: !keyword webhook-endpoint-action-register
    limits: []
# A tier holding two banks, so a scenario can fill one. The micro tier's
# own limit is beyond a test system's reach.
two-banks: !system/component
  system/component-kind: policies/policy
  record-db: !system/ref fdb.record-db
  record-store: !system/ref fdb.meta-store
  policy:
    policy-id: pol.00000000000000000000000006
    name: Two-banks policy
    description: Two-banks tier - holds at most two banks
    status: !keyword policy-status-active
    labels: !strs
      tier: two-banks
    category: !keyword policy-category-restricted
    capabilities: []
    limits:
      - kind:
          bank:
            filters:
              - tier: two-banks
        bound:
          kind:
            max:
              aggregate:
                kind:
                  count:
                    value: 2
                    window: !keyword time-window-instant
        reason: "Two-banks tier - the installation holds at most 2 banks on the tier"
# A tier whose banks have two members and send five invitations a day,
# so a scenario can reach either with a handful of calls.
small-team: !system/component
  system/component-kind: policies/policy
  record-db: !system/ref fdb.record-db
  record-store: !system/ref fdb.meta-store
  policy:
    policy-id: pol.00000000000000000000000007
    name: Small-team policy
    description: Small-team tier - two members and five invitations a day
    status: !keyword policy-status-active
    labels: !strs
      tier: small-team
    category: !keyword policy-category-restricted
    capabilities: []
    limits:
      - kind:
          member: {}
        bound:
          kind:
            max:
              aggregate:
                kind:
                  count:
                    value: 2
                    window: !keyword time-window-instant
        reason: "Small-team tier - a bank has at most 2 members"
      - kind:
          invitation: {}
        bound:
          kind:
            max:
              aggregate:
                kind:
                  count:
                    value: 5
                    window: !keyword time-window-daily
        reason: "Small-team tier - a bank sends at most 5 invitations per day"
# A tier whose banks take small inbound payments: two a day of at most
# GBP 1,000 to own funds, and at most GBP 100 a payment and GBP 150 a
# day to current accounts, so a scenario can reach each with a handful
# of payments.
inbound-capped: !system/component
  system/component-kind: policies/policy
  record-db: !system/ref fdb.record-db
  record-store: !system/ref fdb.meta-store
  policy:
    policy-id: pol.00000000000000000000000008
    name: Inbound-capped policy
    description: Inbound-capped tier - small inbound payments by product type
    status: !keyword policy-status-active
    labels: !strs
      tier: inbound-capped
    category: !keyword policy-category-restricted
    capabilities: []
    limits:
      - kind:
          inbound-payment:
            filters:
              - product-type: !keyword account-product-type-sub-ledger-own-funds
        bound:
          kind:
            max:
              aggregate:
                kind:
                  count:
                    value: 2
                    window: !keyword time-window-daily
        reason: "Inbound-capped tier - max 2 inbound payments to own funds per day"
      - kind:
          inbound-payment:
            filters:
              - product-type: !keyword account-product-type-sub-ledger-own-funds
        bound:
          kind:
            max:
              aggregate:
                kind:
                  amount:
                    value:
                      value: 100000
                      currency: GBP
                    window: !keyword time-window-instant
        reason: "Inbound-capped tier - max GBP 1,000 per inbound payment to own funds"
      - kind:
          inbound-payment:
            filters:
              - product-type: !keyword account-product-type-sub-ledger-current
        bound:
          kind:
            max:
              aggregate:
                kind:
                  amount:
                    value:
                      value: 10000
                      currency: GBP
                    window: !keyword time-window-instant
        reason: "Inbound-capped tier - max GBP 100 per inbound payment to a current account"
      - kind:
          inbound-payment:
            filters:
              - product-type: !keyword account-product-type-sub-ledger-current
        bound:
          kind:
            max:
              aggregate:
                kind:
                  amount:
                    value:
                      value: 15000
                      currency: GBP
                    window: !keyword time-window-daily
        reason: "Inbound-capped tier - max GBP 150 inbound value per day to current accounts"
# A tier whose banks hold three parties, the bank's own among them, and
# make two payee checks a day, so a scenario can reach either limit with
# a handful of calls.
few-customers: !system/component
  system/component-kind: policies/policy
  record-db: !system/ref fdb.record-db
  record-store: !system/ref fdb.meta-store
  policy:
    policy-id: pol.00000000000000000000000009
    name: Few-customers policy
    description: Few-customers tier - three parties and two payee checks a day
    status: !keyword policy-status-active
    labels: !strs
      tier: few-customers
    category: !keyword policy-category-restricted
    capabilities: []
    limits:
      - kind:
          party: {}
        bound:
          kind:
            max:
              aggregate:
                kind:
                  count:
                    value: 3
                    window: !keyword time-window-instant
        reason: "Few-customers tier - a bank holds at most 3 parties"
      - kind:
          payee-check: {}
        bound:
          kind:
            max:
              aggregate:
                kind:
                  count:
                    value: 2
                    window: !keyword time-window-daily
        reason: "Few-customers tier - a bank makes at most 2 payee checks per day"
