# Test-only tier, bound by the model-equality scenario suite
# (test-scenarios) so those tests are decoupled from the production
# micro tier, whose limits evolve for production reasons. Capabilities and
# safety limits come from the always-on platform policy
# (get-effective-policies concats tier=platform unconditionally), so this
# tier deliberately adds no caps of its own — its job is to NOT bind
# micro. Seeded only into test systems (see policy-test.yml); the
# bootstrap service never references it, so it can't reach production.
policy-id: pol.00000000000000000000000003
name: Test-scenario policy
description: Test-scenario tier - test-owned; relies on the platform baseline
enabled: true
labels: !strs
  tier: test-scenario
category: !keyword policy-category-restricted
capabilities: []
limits: []
