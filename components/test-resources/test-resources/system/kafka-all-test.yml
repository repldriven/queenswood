    topics: [topic-cash-accounts-event]
    conf:
      bootstrap.servers: !system/local-ref bootstrap-servers
      group.id: test-cash-accounts-event
  # The webhook consumer's own group on the same topic: a Kafka channel
  # is one group member with one subscription, and the cash-account
  # processor holds `cash-accounts-event`.
  webhook-cash-accounts-event:
    _: !system/local-ref topics
    schemas: !system/local-ref schemas
    schema: !keyword event
    topics: [topic-cash-accounts-event]
    conf:
      bootstrap.servers: !system/local-ref bootstrap-servers
      group.id: test-webhook-cash-accounts-event
  # The reward processor's own group on the same topic, for the same
  # reason.
  reward-cash-accounts-event:
    _: !system/local-ref topics
    schemas: !system/local-ref schemas
    schema: !keyword event
    topics: [topic-cash-accounts-event]
    conf:
      bootstrap.servers: !system/local-ref bootstrap-servers
      group.id: test-reward-cash-accounts-event
  payments-event:
