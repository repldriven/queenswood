# The bank's own system, a Postgres container behind it and the platform
# stand-in in front of it. The testcontainer groups are inlined rather
# than included: mono's shared test resources are not published.
system:
  postgres:
    container: !system/component
      system/component-kind: postgres/container
      exposed-port: 5432

    container-mapped-exposed-port: !system/component
      system/component-kind: postgres/container-mapped-exposed-port
      container: !system/local-ref container
      exposed-port: 5432

  jdbc:
    datasource: !system/component
      system/component-kind: jdbc/datasource
      dbtype: postgres
      host: localhost
      port: !system/ref postgres.container-mapped-exposed-port
      database: test
      user: test
      password: test

  migrator:
    migrations: !system/component
      system/component-kind: migrator/migrations
      datasource: !system/ref jdbc.datasource
      changelogs:
        - demo-digital-bank/changelog.sql

  platform-stub: !include demo-digital-bank/platform-stub-test.yml

  demo-digital-bank: !include demo-digital-bank/bank-test.yml
