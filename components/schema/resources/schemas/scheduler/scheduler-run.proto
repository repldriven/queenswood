syntax = "proto2";

package com.repldriven.queenswood.schemas.scheduler;

import "record_metadata_options.proto";
import "schemas/actor/actor.proto";

option java_outer_classname = "SchedulerRunProto";

enum SchedulerRunStatus {
  SCHEDULER_RUN_STATUS_UNKNOWN = 0;
  SCHEDULER_RUN_STATUS_RUNNING = 1;
  SCHEDULER_RUN_STATUS_COMPLETED = 2;
  SCHEDULER_RUN_STATUS_FAILED = 3;
}

enum SchedulerTriggerSource {
  SCHEDULER_TRIGGER_SOURCE_UNKNOWN = 0;
  SCHEDULER_TRIGGER_SOURCE_SCHEDULED = 1;
  SCHEDULER_TRIGGER_SOURCE_FORCED = 2;
}

enum SchedulerTaskStatus {
  SCHEDULER_TASK_STATUS_UNKNOWN = 0;
  SCHEDULER_TASK_STATUS_RUNNING = 1;
  SCHEDULER_TASK_STATUS_COMPLETED = 2;
  SCHEDULER_TASK_STATUS_FAILED = 3;
  SCHEDULER_TASK_STATUS_SKIPPED = 4;
}

message SchedulerTaskRun {
  required string label = 1;
  required SchedulerTaskStatus status = 2;
  optional int32 processed_count = 3;
  optional int32 failed_count = 4;
  optional int64 started_at = 5;
  optional int64 finished_at = 6;
  optional string failure_reason = 7;
}

// One run of a scheduler job.
message SchedulerRun {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string bank_id = 1;
  required string run_id = 2; // uuidv7
  required SchedulerRunStatus status = 3;
  required SchedulerTriggerSource trigger_source = 4;
  required string job_id = 5;
  required int32 tasks_total = 6;
  optional int64 expected_end_at = 7;
  repeated SchedulerTaskRun tasks = 8;

  optional int64 completed_at = 51;
  optional int64 failed_at = 53;

  required int64 created_at = 101;
  optional com.repldriven.queenswood.schemas.actor.Actor created_by = 102;
  optional int64 updated_at = 103;

  optional string failure_reason = 200;
}
