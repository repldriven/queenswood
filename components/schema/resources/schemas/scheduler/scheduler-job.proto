syntax = "proto2";

package com.repldriven.queenswood.schema.scheduler;

import "record_metadata_options.proto";
import "schemas/actor/actor.proto";

option java_outer_classname = "SchedulerJobProto";

enum SchedulerJobStatus {
  SCHEDULER_JOB_STATUS_UNKNOWN = 0;
  SCHEDULER_JOB_STATUS_ACTIVE = 1;
  SCHEDULER_JOB_STATUS_PAUSED = 2;
}

enum SchedulerJobKind {
  SCHEDULER_JOB_KIND_UNKNOWN = 0;
  SCHEDULER_JOB_KIND_USER = 1;
  SCHEDULER_JOB_KIND_SYSTEM = 2;
}

enum SchedulerTaskKind {
  SCHEDULER_TASK_KIND_UNKNOWN = 0;
  SCHEDULER_TASK_KIND_ACCRUE = 1;
  SCHEDULER_TASK_KIND_CAPITALIZE = 2;
  SCHEDULER_TASK_KIND_ACCOUNT_MIGRATION = 3;
}

// A bank's sequence of tasks run on a schedule.
message SchedulerJob {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string bank_id = 1;
  required string job_id = 2;

  required string name = 3;
  required SchedulerJobStatus status = 4;
  required SchedulerJobKind kind = 5;
  repeated SchedulerTaskKind task_kinds = 6;
  required string schedule = 7; // Quartz cron, UTC
  optional int64 last_run_at = 8;
  optional int64 next_run_at = 9;

  required int64 created_at = 101;
  optional int64 updated_at = 103;
  optional com.repldriven.queenswood.schema.actor.Actor updated_by = 104;
}
