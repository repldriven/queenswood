syntax = "proto2";

package com.repldriven.queenswood.schemas.party;

import "record_metadata_options.proto";

option java_outer_classname = "PartyProto";

message Party {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string bank_id = 7;
  required string party_id = 1;
  required PartyType type = 2;
  required PartyStatus status = 3;
  required string display_name = 4;
  required int64 created_at = 5;
  required int64 updated_at = 6;

  // Set when `status` is PARTY_STATUS_MERGED, pointing at the survivor
  // party this record was merged into (QNS-24). Never rewritten once
  // set; IDV/KYC and other party-linked records stay on the original
  // party-id, so this pointer is the durable audit link.
  optional string merged_into_party_id = 8;

  // Client idempotency key (the command envelope :id, sourced from the
  // required Idempotency-Key header) that created this party. Unique-indexed
  // per bank so a redelivered or retried create-party command reads the
  // existing party back instead of creating a duplicate. Optional at the
  // wire level for compatibility with parties written before this field.
  optional string idempotency_key = 9;

  enum PartyType {
    PARTY_TYPE_UNKNOWN = 0;
    PARTY_TYPE_PERSON = 1;
    PARTY_TYPE_INTERNAL = 2;
    PARTY_TYPE_ORGANIZATION = 3;
  }

  enum PartyStatus {
    PARTY_STATUS_UNKNOWN = 0;
    PARTY_STATUS_PENDING = 1;
    PARTY_STATUS_ACTIVE = 2;
    PARTY_STATUS_SUSPENDED = 3;
    PARTY_STATUS_CLOSED = 4;
    PARTY_STATUS_REJECTED = 5;
    PARTY_STATUS_MERGED = 6;
  }
}
