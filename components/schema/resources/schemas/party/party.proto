syntax = "proto2";

package com.repldriven.queenswood.schema.party;

import "record_metadata_options.proto";
import "schemas/actor/actor.proto";

option java_outer_classname = "PartyProto";

enum PartyType {
  PARTY_TYPE_UNKNOWN = 0;
  PARTY_TYPE_PERSON = 1;
  PARTY_TYPE_INTERNAL = 2;
  PARTY_TYPE_ORGANIZATION = 3;
}

enum PartyStatus {
  PARTY_STATUS_UNKNOWN = 0;
  PARTY_STATUS_PENDING = 1;
  PARTY_STATUS_ACTIVE = 2;
  PARTY_STATUS_SUSPENDED = 3;
  PARTY_STATUS_CLOSED = 4;
  PARTY_STATUS_REJECTED = 5;
  PARTY_STATUS_MERGED = 6;
}

// A bank's customer, a person or an organisation, or the bank itself.
message Party {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string bank_id = 1;
  required string party_id = 2; // pty.<uuidv7>

  required string legal_name = 3;
  optional string display_name = 4;
  required PartyStatus status = 5;
  required PartyType party_type = 6;
  optional string external_reference = 7;
  optional string merged_into_party_id = 8;

  optional int64 activated_at = 51;
  optional int64 rejected_at = 53;
  optional int64 suspended_at = 55;
  optional com.repldriven.queenswood.schema.actor.Actor suspended_by = 56;
  optional int64 resumed_at = 57;
  optional com.repldriven.queenswood.schema.actor.Actor resumed_by = 58;
  optional int64 closed_at = 59;
  optional com.repldriven.queenswood.schema.actor.Actor closed_by = 60;
  optional int64 merged_at = 61;
  optional com.repldriven.queenswood.schema.actor.Actor merged_by = 62;

  optional string idempotency_key = 100;
  required int64 created_at = 101;
  required com.repldriven.queenswood.schema.actor.Actor created_by = 102;
  optional int64 updated_at = 103;
}
