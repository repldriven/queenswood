syntax = "proto2";

package com.repldriven.queenswood.schemas.clearbank;

import "record_metadata_options.proto";

option java_outer_classname = "ClearbankOutboxProto";

// An event the ClearBank adapter has yet to publish to the bus.
message ClearbankOutboxEvent {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string outbox_id = 1; // uuidv7
  required string dedup_key = 2;
  required string event_name = 3;
  required bytes payload = 4; // Avro
  optional string correlation_id = 5;
  optional string causation_id = 6;
  optional string traceparent = 7; // W3C trace context
  optional string ordering_key = 8;

  required int64 created_at = 101;
}

// A pending outbound ClearBank HTTP call (an FPS payment submit). Written
// in the FDB transaction that consumes a submit-payment command, then made
// by the out-of-transaction outbound relay — an HTTP call cannot run inside
// the changelog checkpoint transaction. ClearBank dedupes on the request's
// endToEndIdentification, so a retried POST is safe.
message ClearbankOutboundIntent {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string intent_id = 1;       // primary key (uuidv7)
  // The command's end-to-end id. Unique-indexed so a redelivered
  // submit-payment command does not enqueue a second FPS call.
  required string dedup_key = 2;
  required string request = 3;         // FPS request JSON body
  required string status = 4;          // pending | sent | failed
  optional string correlation_id = 5;
  optional int64  attempts = 6;
  optional int64  created_at = 7;
  optional int64  sent_at = 8;
  optional int64  next_attempt_at = 9; // epoch millis, absent means due now
  // What the call is: absent for an FPS payment submit, otherwise
  // open-account, close-account or reissue-address.
  optional string kind = 10;
  // EDN the runner needs to report the outcome of an account call: the
  // bank and account ids, and a rotation's key.
  optional string context = 11;
  // The W3C traceparent of the command that asked for the call, which
  // the runner's outcome event carries, so the trace runs on through
  // the provider. See ChangelogEvent.
  optional string traceparent = 12;
  // What the call acts on at the provider, the cash accounts for a
  // payment provider. The runner makes a subject's calls in the order
  // they were accepted (ADR-0033).
  repeated string subjects = 13;
}
