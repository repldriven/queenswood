syntax = "proto2";

package com.repldriven.queenswood.schemas.idv;

import "record_metadata_options.proto";
import "schemas/policies/policy.proto";

option java_outer_classname = "IdvProto";

message Idv {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string bank_id = 1;
  required string verification_id = 2;
  required string party_id = 3;
  required IdvStatus status = 4;
  required int64 created_at = 5;
  required int64 updated_at = 6;
  optional int64 completed_at = 7;
  // The latest evidence the provider reported, one section per kind.
  optional IdvEvidence evidence = 8;
  // Each verification and screening as the last decision settled it.
  repeated IdvCriterion criteria = 9;

  enum IdvStatus {
    IDV_STATUS_UNKNOWN = 0;
    IDV_STATUS_PENDING = 1; // initiated, awaiting result
    IDV_STATUS_IN_REVIEW = 2; // escalated to manual review
    IDV_STATUS_ACCEPTED = 3;
    IDV_STATUS_REJECTED = 4; // data doesn't pass checks
    IDV_STATUS_FAILED = 5; // technical failure — can be retried
  }
}

enum IdvEvidenceOutcome {
  IDV_EVIDENCE_OUTCOME_UNKNOWN = 0;
  IDV_EVIDENCE_OUTCOME_PASSED = 1;
  IDV_EVIDENCE_OUTCOME_FAILED = 2;
  IDV_EVIDENCE_OUTCOME_REVIEW = 3;
}

enum IdvSanctionsOutcome {
  IDV_SANCTIONS_OUTCOME_UNKNOWN = 0;
  IDV_SANCTIONS_OUTCOME_CLEAR = 1;
  IDV_SANCTIONS_OUTCOME_POSSIBLE_MATCH = 2;
  IDV_SANCTIONS_OUTCOME_HIT = 3;
}

// What the person's document says, as the provider extracted it.
enum IdvNameMatch {
  IDV_NAME_MATCH_UNKNOWN = 0;
  IDV_NAME_MATCH_MATCH = 1;
  IDV_NAME_MATCH_CLOSE_MATCH = 2;
  IDV_NAME_MATCH_NO_MATCH = 3;
}

message IdvDocumentEvidence {
  optional IdvEvidenceOutcome outcome = 1;
  // What the provider read stays with the provider (ADR-0045): the
  // adapter reports how the read name compares, never the name.
  optional string given_names = 2 [deprecated = true];
  optional string family_name = 3 [deprecated = true];
  optional string date_of_birth = 4 [deprecated = true];
  optional string document_type = 5;
  optional string issuing_country = 6;
  // How the name read off the document compares with the name the run
  // was started for.
  optional IdvNameMatch name_match = 7;
}

message IdvLivenessEvidence {
  optional IdvEvidenceOutcome outcome = 1;
}

message IdvAddressEvidence {
  optional IdvEvidenceOutcome outcome = 1;
  optional string document_type = 2;
}

message IdvScreeningEvidence {
  optional IdvSanctionsOutcome sanctions = 1;
  optional bool pep = 2;
}

message IdvEvidence {
  optional IdvDocumentEvidence document = 1;
  optional IdvLivenessEvidence liveness = 2;
  optional IdvAddressEvidence address = 3;
  optional IdvScreeningEvidence screening = 4;
  optional bool cancelled = 5;
}

enum IdvCriterionState {
  IDV_CRITERION_STATE_UNKNOWN = 0;
  IDV_CRITERION_STATE_OUTSTANDING = 1;
  IDV_CRITERION_STATE_ESTABLISHED = 2;
  IDV_CRITERION_STATE_REVIEW = 3;
  IDV_CRITERION_STATE_FAILED = 4;
}

// One verification or screening, whichever is set, and how it stands.
message IdvCriterion {
  optional com.repldriven.queenswood.schemas.policies.IdvVerification verification = 1;
  optional com.repldriven.queenswood.schemas.policies.IdvScreening screening = 2;
  optional IdvCriterionState state = 3;
}

// A run of the provider's flow the tenant opened to hand the person
// off, and the hand-off once the adapter has one.
message IdvSession {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string bank_id = 1;
  required string session_id = 2;
  required string verification_id = 3;
  required string party_id = 4;
  required IdvSessionChannel channel = 5;
  required string return_url = 6;
  required IdvSessionStatus status = 7;
  optional IdvHandOff hand_off = 8;
  // The epoch day the session opened, for the daily limit.
  required int64 opened_day = 9;
  required int64 created_at = 10;
  required int64 updated_at = 11;
  // Why the provider could not run the session's check.
  optional string failure_reason = 12;

  enum IdvSessionChannel {
    IDV_SESSION_CHANNEL_UNKNOWN = 0;
    IDV_SESSION_CHANNEL_WEB = 1;
    IDV_SESSION_CHANNEL_MOBILE = 2;
  }

  enum IdvSessionStatus {
    IDV_SESSION_STATUS_UNKNOWN = 0;
    IDV_SESSION_STATUS_OPENING = 1;
    IDV_SESSION_STATUS_READY = 2;
    IDV_SESSION_STATUS_COMPLETED = 3;
    IDV_SESSION_STATUS_FAILED = 4;
  }
}

message IdvHandOff {
  optional IdvHandOffType type = 1;
  optional string url = 2;
  optional int64 expires_at = 3;

  enum IdvHandOffType {
    IDV_HAND_OFF_TYPE_UNKNOWN = 0;
    IDV_HAND_OFF_TYPE_URL = 1;
  }
}
