syntax = "proto2";

package com.repldriven.queenswood.schema.idv;

import "record_metadata_options.proto";
import "schemas/policy/capability.proto";

option java_outer_classname = "IdvProto";

enum IdvStatus {
  IDV_STATUS_UNKNOWN = 0;
  IDV_STATUS_PENDING = 1;
  IDV_STATUS_IN_REVIEW = 2;
  IDV_STATUS_ACCEPTED = 3;
  IDV_STATUS_REJECTED = 4;
  IDV_STATUS_CANCELLED = 5;
}

enum IdvEvidenceOutcome {
  IDV_EVIDENCE_OUTCOME_UNKNOWN = 0;
  IDV_EVIDENCE_OUTCOME_PASSED = 1;
  IDV_EVIDENCE_OUTCOME_FAILED = 2;
  IDV_EVIDENCE_OUTCOME_REVIEW = 3;
}

enum IdvSanctionsOutcome {
  IDV_SANCTIONS_OUTCOME_UNKNOWN = 0;
  IDV_SANCTIONS_OUTCOME_CLEAR = 1;
  IDV_SANCTIONS_OUTCOME_POSSIBLE_MATCH = 2;
  IDV_SANCTIONS_OUTCOME_HIT = 3;
}

// How the name read off a document compares with the name the check was
// started for.
enum IdvNameMatch {
  IDV_NAME_MATCH_UNKNOWN = 0;
  IDV_NAME_MATCH_MATCH = 1;
  IDV_NAME_MATCH_CLOSE_MATCH = 2;
  IDV_NAME_MATCH_NO_MATCH = 3;
}

enum IdvCriterionStatus {
  IDV_CRITERION_STATUS_UNKNOWN = 0;
  IDV_CRITERION_STATUS_OUTSTANDING = 1;
  IDV_CRITERION_STATUS_ESTABLISHED = 2;
  IDV_CRITERION_STATUS_REVIEW = 3;
  IDV_CRITERION_STATUS_FAILED = 4;
}

message IdvDocumentEvidence {
  optional IdvEvidenceOutcome outcome = 1;
  optional IdvNameMatch name_match = 2;
  optional string document_type = 3;
  optional string issuing_country = 4;
}

message IdvLivenessEvidence {
  optional IdvEvidenceOutcome outcome = 1;
}

message IdvAddressEvidence {
  optional IdvEvidenceOutcome outcome = 1;
  optional string document_type = 2;
}

message IdvScreeningEvidence {
  optional IdvSanctionsOutcome sanctions = 1;
  optional bool pep = 2;
}

// What the provider last reported, one section per kind.
message IdvEvidence {
  optional IdvDocumentEvidence document = 1;
  optional IdvLivenessEvidence liveness = 2;
  optional IdvAddressEvidence address = 3;
  optional IdvScreeningEvidence screening = 4;
  optional bool cancelled = 5;
}

// One verification or screening, whichever is set.
message IdvCriterion {
  optional com.repldriven.queenswood.schema.policy.IdvVerification verification = 1;
  optional com.repldriven.queenswood.schema.policy.IdvScreening screening = 2;
  required IdvCriterionStatus status = 3;
}

// A party's identity verification.
message Idv {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string bank_id = 1;
  required string verification_id = 2;

  required string party_id = 3;
  required IdvStatus status = 4;
  repeated IdvCriterion criteria = 5;
  optional IdvEvidence evidence = 6;

  optional int64 accepted_at = 51;
  optional int64 rejected_at = 53;
  optional int64 cancelled_at = 55;

  required int64 created_at = 101;
  optional int64 updated_at = 103;
}
