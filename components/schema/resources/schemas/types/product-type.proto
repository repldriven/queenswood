syntax = "proto2";

package com.repldriven.queenswood.schemas.types;

option java_outer_classname = "ProductTypeProto";

// The kind of account a product, account, balance or leg belongs to:
// the bank's general ledger, a customer sub-ledger (100s) or a house
// sub-ledger (200s). Code reads a type's role from its maps, never from
// its band.
enum ProductType {
  PRODUCT_TYPE_UNKNOWN = 0;
  PRODUCT_TYPE_GENERAL_LEDGER = 1;
  PRODUCT_TYPE_SUB_LEDGER_CURRENT = 101;
  PRODUCT_TYPE_SUB_LEDGER_SAVINGS = 102;
  PRODUCT_TYPE_SUB_LEDGER_TERM_DEPOSIT = 103;
  PRODUCT_TYPE_SUB_LEDGER_OWN_FUNDS = 201;
}
