syntax = "proto2";

package com.repldriven.queenswood.schemas.payments;

import "record_metadata_options.proto";

option java_outer_classname = "ProviderTransferProto";

enum ProviderTransferStatus {
  PROVIDER_TRANSFER_STATUS_UNKNOWN = 0;
  PROVIDER_TRANSFER_STATUS_PENDING = 1;
  PROVIDER_TRANSFER_STATUS_COMPLETED = 2;
  PROVIDER_TRANSFER_STATUS_FAILED = 3;
}

// A movement the ledger made that the payment provider must make too,
// where the provider holds a balance for each account: one debtor and
// creditor pair of one posted transaction, named by the cash accounts
// whose provider accounts hold the money. The provider accounts are read
// when the transfer is sent, so one the provider has not yet opened
// waits.
message ProviderTransfer {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string transfer_id = 1;
  required string bank_id = 2;
  required string transaction_id = 3;
  // Absent when the money came from outside the provider, which only a
  // sandbox provider can credit.
  optional string debtor_account_id = 4;
  required string creditor_account_id = 5;
  required int64 amount = 6;
  required string currency = 7;
  required ProviderTransferStatus status = 8;
  required int64 created_at = 10;
  required int64 updated_at = 11;

  optional string failure_reason = 200;
}
