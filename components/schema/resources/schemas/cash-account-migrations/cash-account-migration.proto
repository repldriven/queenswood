syntax = "proto2";

package com.repldriven.queenswood.schemas.cash_account_migrations;

import "record_metadata_options.proto";
import "schemas/actor/actor.proto";

option java_outer_classname = "CashAccountMigrationProto";

enum CashAccountMigrationStatus {
  CASH_ACCOUNT_MIGRATION_STATUS_UNKNOWN = 0;
  CASH_ACCOUNT_MIGRATION_STATUS_DRAFT = 1;
  CASH_ACCOUNT_MIGRATION_STATUS_APPROVED = 2;
  CASH_ACCOUNT_MIGRATION_STATUS_COMPLETED = 3;
  CASH_ACCOUNT_MIGRATION_STATUS_CANCELLED = 4;
}

// A planned move of a product's cash accounts onto another version.
message CashAccountMigration {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string bank_id = 1;
  required string migration_id = 2;

  required string name = 3;
  required CashAccountMigrationStatus status = 4;
  required string source_product_id = 5;
  repeated string source_version_ids = 6;
  required string target_product_id = 7;
  required string target_version_id = 8;
  optional int64 notified_on = 9; // epoch day
  optional int64 due_on = 10; // epoch day

  optional int64 approved_at = 51;
  optional com.repldriven.queenswood.schemas.actor.Actor approved_by = 52;
  optional int64 completed_at = 53;
  optional int64 cancelled_at = 55;
  optional com.repldriven.queenswood.schemas.actor.Actor cancelled_by = 56;

  required string idempotency_key = 100;
  required int64 created_at = 101;
  required com.repldriven.queenswood.schemas.actor.Actor created_by = 102;
  optional int64 updated_at = 103;
}
