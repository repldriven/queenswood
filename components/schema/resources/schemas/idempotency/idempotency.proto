syntax = "proto2";

package com.repldriven.queenswood.schemas.idempotency;

import "record_metadata_options.proto";

option java_outer_classname = "IdempotencyProto";

enum IdempotencyStatus {
  IDEMPOTENCY_STATUS_UNKNOWN = 0;
  IDEMPOTENCY_STATUS_PENDING = 1;
  IDEMPOTENCY_STATUS_COMPLETED = 2;
}

// A request's response, kept under the Idempotency-Key the principal sent
// it with for the operation.
message Idempotency {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string principal_id = 1;
  required string operation = 2; // HTTP method and path template
  required string idempotency_key = 3;
  required IdempotencyStatus status = 4;
  required string fingerprint = 5; // hash of the path and decoded body
  optional int32 response_status = 6; // HTTP status
  optional string response_headers = 7; // EDN
  optional string response_body = 8; // EDN
  required int64 expires_at = 9;

  required int64 created_at = 101;
}
