syntax = "proto2";

package com.repldriven.queenswood.schemas.webhooks;

import "record_metadata_options.proto";
import "schemas/actor/actor.proto";

option java_outer_classname = "WebhookDeliveryProto";

enum WebhookDeliveryStatus {
  WEBHOOK_DELIVERY_STATUS_UNKNOWN = 0;
  WEBHOOK_DELIVERY_STATUS_PENDING = 1;
  WEBHOOK_DELIVERY_STATUS_IN_FLIGHT = 2;
  WEBHOOK_DELIVERY_STATUS_DELIVERED = 3;
  WEBHOOK_DELIVERY_STATUS_FAILED = 4;
}

// One notification's delivery to one endpoint.
message WebhookDelivery {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string bank_id = 1;
  required string delivery_id = 2; // whd.<uuidv7>
  required WebhookDeliveryStatus status = 3;
  required string notification_id = 4;
  required string endpoint_id = 5;
  required string kind = 6;

  optional int64 delivered_at = 51;
  optional int64 failed_at = 53;

  required int64 created_at = 101;
  optional com.repldriven.queenswood.schemas.actor.Actor created_by = 102;

  required int32 attempt_count = 201;
  optional int64 next_attempt_at = 202;
  optional string traceparent = 203;
}
