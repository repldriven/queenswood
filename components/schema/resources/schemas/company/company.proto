syntax = "proto2";

package com.repldriven.queenswood.schemas.company;

import "record_metadata_options.proto";

option java_outer_classname = "CompanyProto";

message RegisteredOfficeAddress {
  optional string address_line_1 = 1;
  optional string locality = 2;
  optional string postal_code = 3;
  optional string country = 4;
}

// A company's profile as its registry of record holds it.
message Company {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string company_number = 1;
  optional string company_name = 2;
  optional string company_status = 3;
  optional string type = 4;
  optional string jurisdiction = 5;
  optional string date_of_creation = 6;
  optional RegisteredOfficeAddress registered_office_address = 7;
}
