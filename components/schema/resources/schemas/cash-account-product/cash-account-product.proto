syntax = "proto2";

package com.repldriven.queenswood.schema.cash_account_product;

import "record_metadata_options.proto";
import "schemas/account-product-type/account-product-type.proto";
import "schemas/actor/actor.proto";
import "schemas/cash-account-product/types.proto";
import "schemas/policy/limit.proto";

option java_outer_classname = "CashAccountProductProto";

enum VersionStatus {
  VERSION_STATUS_UNKNOWN = 0;
  VERSION_STATUS_DRAFT = 1;
  VERSION_STATUS_PUBLISHED = 2;
}

enum InterestBanding {
  INTEREST_BANDING_UNKNOWN = 0;
  INTEREST_BANDING_MARGINAL = 1;
  INTEREST_BANDING_WHOLE_BALANCE = 2;
}

enum InterestPeriodUnit {
  INTEREST_PERIOD_UNIT_UNKNOWN = 0;
  INTEREST_PERIOD_UNIT_DAY = 1;
  INTEREST_PERIOD_UNIT_WEEK = 2;
  INTEREST_PERIOD_UNIT_MONTH = 3;
}

// The rates in force from `after` of the schedule's units after the
// account came onto the version until the next period's, one for each
// band.
message RelativeInterestPeriod {
  required int32 after = 1; // units after version_from_on
  repeated int32 rates_bps = 2; // one for each band
}

// Periods counted from the day the account came onto the version.
message RelativeInterestSchedule {
  required InterestPeriodUnit unit = 1;
  repeated RelativeInterestPeriod periods = 2;
}

// The rates in force from a date until the next period's, one for each
// band.
message FixedInterestPeriod {
  required int64 from_on = 1; // epoch day
  repeated int32 rates_bps = 2; // one for each band
}

// Periods set by date.
message FixedInterestSchedule {
  repeated FixedInterestPeriod periods = 1;
}

// How interest is earned: a rate for each period of an account's life
// and each band of its balance, accrued on each day's end-of-day
// balance.
message InterestAccrual {
  required InterestBanding banding = 1;
  required InterestDayCount day_count = 2;
  repeated int64 bands = 3; // each band's lowest balance, minor units
  oneof schedule {
    RelativeInterestSchedule relative = 4;
    FixedInterestSchedule fixed = 5;
  }
}

// Interest paid every `every` of `unit`, counted from the day the
// account came onto the version.
message AccountDayInterestPayment {
  required InterestPeriodUnit unit = 1;
  required int32 every = 2;
}

// Interest paid on `day_of_month`, or the month's last day where it has
// fewer, in `in_month` and every `every` months from it.
message CalendarDayInterestPayment {
  required int32 every = 1; // months: 1, 2, 3, 4, 6 or 12
  required int32 day_of_month = 2; // 1 to 31
  required int32 in_month = 3; // 1 to 12
}

// Interest paid once, when the account closes.
message ClosureDayInterestPayment {}

// When accrued interest is paid: on the days its kind schedules,
// counted on `calendar`, a day the calendar does not count moving by
// `business_day_convention`.
message InterestPayment {
  required BusinessDayConvention business_day_convention = 1;
  oneof kind {
    AccountDayInterestPayment account_day = 2;
    CalendarDayInterestPayment calendar_day = 3;
    ClosureDayInterestPayment closure_day = 4;
  }
  required BusinessDayCalendar calendar = 5;
}

// A version's interest: how it is earned and when it is paid.
message InterestTerms {
  required InterestAccrual accrual = 1;
  required InterestPayment payment = 2;
}

// Accrued interest paid at closure.
message PayClosureInterest {}

// Accrued interest forfeited at closure.
message ForfeitClosureInterest {}

// `days` of interest at the closure day's rates forfeited, never more
// than has accrued, and the rest paid.
message ForfeitDaysClosureInterest {
  required int32 days = 1;
}

// What a closure does with interest accrued and not yet paid.
message ClosureInterest {
  oneof kind {
    PayClosureInterest pay = 1;
    ForfeitClosureInterest forfeit = 2;
    ForfeitDaysClosureInterest forfeit_days = 3;
  }
}

// A fee of `amount`.
message FlatClosureFee {
  required int64 amount = 1; // minor units
}

// A fee of `rate_bps` of the balance closed, between `min` and `max`.
message BalanceClosureFee {
  required int32 rate_bps = 1; // basis points
  optional int64 min = 2; // minor units
  optional int64 max = 3; // minor units
}

// A fee charged at closure, never more than the balance left once the
// interest is settled.
message ClosureFee {
  oneof kind {
    FlatClosureFee flat = 1;
    BalanceClosureFee balance = 2;
  }
}

// An early closure refused.
message RefusedEarlyClosure {}

// An early closure allowed, its interest settled by `interest` and its
// `fee` charged.
message ChargedEarlyClosure {
  required ClosureInterest interest = 1;
  optional ClosureFee fee = 2;
}

// A closure before the account has been on the version `count` of
// `unit`.
message EarlyClosure {
  required InterestPeriodUnit unit = 1;
  required int32 count = 2; // units after version_from_on
  oneof kind {
    RefusedEarlyClosure refused = 3;
    ChargedEarlyClosure charged = 4;
  }
}

// What closing an account on the version does: an early closure by the
// first of `early` still open, any other by `interest` alone.
message ClosureTerms {
  required ClosureInterest interest = 1;
  repeated EarlyClosure early = 2; // in ascending order of count
}

// A reward a version promises the accounts opened under it.
message RewardTerms {
  required RewardKind kind = 1;
  required int64 amount = 2; // minor units
}

// One version of a bank's cash account product.
message CashAccountProduct {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string bank_id = 1;
  required string product_id = 2;
  required string version_id = 3;

  required string template_id = 4;
  required string name = 5;
  required int32 version_number = 6;
  required VersionStatus status = 7;
  required com.repldriven.queenswood.schema.account_product_type.AccountProductType product_type = 8;
  required IsoCashAccountType iso_cash_account_type = 9;
  required BalanceSheetSide balance_sheet_side = 10;
  required string currency = 11; // ISO 4217
  repeated BalanceProduct balance_products = 12;
  repeated PaymentAddressScheme allowed_payment_address_schemes = 13;
  optional InterestTerms interest_terms = 14;
  repeated RewardTerms reward_terms = 15;
  required int64 effective_from = 16; // epoch day
  optional int64 effective_to = 17; // epoch day
  repeated com.repldriven.queenswood.schema.policy.Limit limits = 18;
  optional int64 published_on = 19; // epoch day
  required ClosureTerms closure_terms = 20;

  optional string idempotency_key = 100;
  required int64 created_at = 101;
  required com.repldriven.queenswood.schema.actor.Actor created_by = 102;
  optional int64 updated_at = 103;
  optional com.repldriven.queenswood.schema.actor.Actor updated_by = 104;
}
