syntax = "proto2";

package com.repldriven.queenswood.schema.cash_account_product;

import "schemas/balance/types.proto";

option java_outer_classname = "CashAccountProductTypesProto";

enum BalanceSheetSide {
  BALANCE_SHEET_SIDE_UNKNOWN = 0;
  BALANCE_SHEET_SIDE_ASSET = 1;
  BALANCE_SHEET_SIDE_LIABILITY = 2;
}

enum PaymentAddressScheme {
  PAYMENT_ADDRESS_SCHEME_UNKNOWN = 0;
  PAYMENT_ADDRESS_SCHEME_SCAN = 1;
  PAYMENT_ADDRESS_SCHEME_IBAN = 2;
  PAYMENT_ADDRESS_SCHEME_SWIFT = 3;
  PAYMENT_ADDRESS_SCHEME_ACH = 4;
}

// ISO 20022 ExternalCashAccountType1Code.
enum IsoCashAccountType {
  ISO_CASH_ACCOUNT_TYPE_UNKNOWN = 0;
  ISO_CASH_ACCOUNT_TYPE_CACC = 1; // current
  ISO_CASH_ACCOUNT_TYPE_SVGS = 2; // savings
  ISO_CASH_ACCOUNT_TYPE_LLSV = 3; // savings with special terms
  ISO_CASH_ACCOUNT_TYPE_TRAN = 4; // basic transacting
  ISO_CASH_ACCOUNT_TYPE_SACC = 5; // settlement
  ISO_CASH_ACCOUNT_TYPE_CPAC = 6; // clearing participant
}

// A balance bucket an account opens with.
message BalanceProduct {
  required com.repldriven.queenswood.schema.balance.BalanceType balance_type = 1;
  required com.repldriven.queenswood.schema.balance.BalanceStatus balance_status = 2;
}

// What a reward is for.
enum RewardKind {
  REWARD_KIND_UNKNOWN = 0;
  REWARD_KIND_OPENING = 1;
}

enum InterestDayCount {
  INTEREST_DAY_COUNT_UNKNOWN = 0;
  INTEREST_DAY_COUNT_ACTUAL_365 = 1;
  INTEREST_DAY_COUNT_ACTUAL_ACTUAL = 2;
  INTEREST_DAY_COUNT_ACTUAL_360 = 3;
}

// ISDA's rule for moving a date that is not a business day.
enum BusinessDayConvention {
  BUSINESS_DAY_CONVENTION_UNKNOWN = 0;
  BUSINESS_DAY_CONVENTION_UNADJUSTED = 1;
  BUSINESS_DAY_CONVENTION_FOLLOWING = 2;
  BUSINESS_DAY_CONVENTION_MODIFIED_FOLLOWING = 3;
  BUSINESS_DAY_CONVENTION_PRECEDING = 4;
  BUSINESS_DAY_CONVENTION_MODIFIED_PRECEDING = 5;
}

// The days a payment schedule counts as business days. A named
// calendar is an FpML business centre: its Saturdays, Sundays and
// published holidays are not business days.
enum BusinessDayCalendar {
  BUSINESS_DAY_CALENDAR_UNKNOWN = 0;
  BUSINESS_DAY_CALENDAR_NONE = 1; // every day
  BUSINESS_DAY_CALENDAR_WEEKENDS = 2; // every day but Saturday and Sunday
  BUSINESS_DAY_CALENDAR_GBLO = 3; // London: England and Wales bank holidays
  BUSINESS_DAY_CALENDAR_EUTA = 4; // TARGET closing days
}
