syntax = "proto2";

package com.repldriven.queenswood.schemas.memberships;

import "record_metadata_options.proto";
import "schemas/memberships/actor.proto";

option java_outer_classname = "MembershipProto";

enum Role {
  ROLE_UNKNOWN = 0;
  ROLE_OWNER = 1;
  ROLE_ADMIN = 2;
  ROLE_DEVELOPER = 3;
  ROLE_VIEWER = 4;
}

enum MembershipStatus {
  MEMBERSHIP_STATUS_UNKNOWN = 0;
  MEMBERSHIP_STATUS_ACTIVE = 1;
  MEMBERSHIP_STATUS_ENDED = 2;
}

// Joins a user to a bank with a role. A user may hold memberships of
// many banks.
message Membership {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string bank_id = 1;
  required string membership_id = 2;
  required MembershipStatus status = 3;
  required Role role = 4;
  required string user_id = 5;
  // The invitation accepted to create it, none for the bank's first owner.
  optional string invitation_id = 6;
  optional int64 ended_at = 51;
  optional Actor ended_by = 52;
  required int64 created_at = 101;
  required Actor created_by = 102;
  required int64 updated_at = 103;
}
