syntax = "proto2";

package com.repldriven.queenswood.schema.ledger_account;

import "record_metadata_options.proto";

option java_outer_classname = "LedgerAccountProto";

enum LedgerAccountStatus {
  LEDGER_ACCOUNT_STATUS_UNKNOWN = 0;
  LEDGER_ACCOUNT_STATUS_OPEN = 1;
  LEDGER_ACCOUNT_STATUS_CLOSED = 2;
}

// A chart role; each value is its chart-of-accounts number, whose
// thousand is its class: 1 asset, 2 liability, 3 equity, 4 income,
// 5 expense.
enum LedgerAccountCode {
  LEDGER_ACCOUNT_CODE_UNKNOWN = 0;
  LEDGER_ACCOUNT_CODE_CASH_AT_CORRESPONDENT = 1100;
  LEDGER_ACCOUNT_CODE_PENDING_OUTBOUND = 1200;
  LEDGER_ACCOUNT_CODE_CUSTOMER_DEPOSITS_CURRENT = 2100;
  LEDGER_ACCOUNT_CODE_CUSTOMER_DEPOSITS_SAVINGS = 2200;
  LEDGER_ACCOUNT_CODE_CUSTOMER_DEPOSITS_TERM = 2300;
  LEDGER_ACCOUNT_CODE_INTEREST_PAYABLE = 2400;
  LEDGER_ACCOUNT_CODE_SUSPENSE = 2500;
  LEDGER_ACCOUNT_CODE_OWN_FUNDS = 3100;
  LEDGER_ACCOUNT_CODE_INTEREST_EXPENSE = 5100;
}

// A bank's general-ledger account in one currency.
message LedgerAccount {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string bank_id = 1;
  required string ledger_account_id = 2; // led.<uuidv7>

  required LedgerAccountCode code = 3;
  required string currency = 4; // ISO 4217
  required string name = 5;
  required LedgerAccountStatus status = 6;

  required int64 created_at = 101;
  optional int64 updated_at = 103;
}
