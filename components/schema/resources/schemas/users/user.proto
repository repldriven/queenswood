syntax = "proto2";

package com.repldriven.queenswood.schemas.users;

import "record_metadata_options.proto";

option java_outer_classname = "UserProto";

enum IdentityProvider {
  IDENTITY_PROVIDER_UNKNOWN = 0;
  IDENTITY_PROVIDER_GOOGLE = 1;
  IDENTITY_PROVIDER_GITHUB = 2;
  IDENTITY_PROVIDER_PASSWORD = 3;
}

// A person who signs in to operate the platform.
message User {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string user_id = 1 [(com.apple.foundationdb.record.field).primary_key = true]; // usr.<uuidv7>
  required string issuer = 2;
  required string sub = 3;
  required string name = 4;
  required IdentityProvider identity_provider = 5;
  required string email = 6;
  optional string avatar_url = 7;

  required int64 created_at = 101;
  optional int64 updated_at = 103;
}
