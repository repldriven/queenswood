syntax = "proto2";

package com.repldriven.queenswood.schema.cash_account;

import "record_metadata_options.proto";
import "schemas/account-product-type/account-product-type.proto";
import "schemas/actor/actor.proto";
import "schemas/cash-account-product/types.proto";
import "schemas/cash-account/types.proto";
import "schemas/fideslang/data-category.proto";

option java_outer_classname = "CashAccountProto";

enum CashAccountStatus {
  CASH_ACCOUNT_STATUS_UNKNOWN = 0;
  CASH_ACCOUNT_STATUS_OPENING = 1;
  CASH_ACCOUNT_STATUS_OPENED = 2;
  CASH_ACCOUNT_STATUS_CLOSING = 3;
  CASH_ACCOUNT_STATUS_CLOSED = 4;
  CASH_ACCOUNT_STATUS_SUSPENDED = 5;
  CASH_ACCOUNT_STATUS_REFUSED = 6;
}

// A UK sort code and account number.
message ScanAddress {
  required string sort_code = 1 [(fideslang.data_category) = "user.financial.bank_account"];
  required string account_number = 2 [(fideslang.data_category) = "user.financial.bank_account"];
}

// An address payments reach the account at.
message PaymentAddress {
  required com.repldriven.queenswood.schema.cash_account_product.PaymentAddressScheme scheme = 1;
  optional ScanAddress scan = 2;
  optional string value = 3;
}

// An address the account no longer answers to.
message RetiredPaymentAddress {
  required PaymentAddress address = 1;
  required int64 retired_at = 2;
}

enum AddressRotationStatus {
  ADDRESS_ROTATION_STATUS_UNKNOWN = 0;
  ADDRESS_ROTATION_STATUS_PENDING = 1;
  ADDRESS_ROTATION_STATUS_COMPLETED = 2;
  ADDRESS_ROTATION_STATUS_FAILED = 3;
}

// The latest change of an account's payment addresses.
message AddressRotation {
  required string idempotency_key = 1 [(fideslang.data_category) = "system.operations"];
  required AddressRotationStatus status = 2;
  optional string failed_reason = 3;
}

// A bank's account held by a party under a product version.
message CashAccount {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string bank_id = 1;
  required string account_id = 2;

  required string product_id = 3;
  required string version_id = 4;
  required int64 version_from_on = 5; // epoch day
  required string name = 6;
  required CashAccountStatus status = 7;
  required string party_id = 8;
  required com.repldriven.queenswood.schema.account_product_type.AccountProductType product_type = 9;
  required AccountType account_type = 10;
  required string currency = 11; // ISO 4217
  repeated PaymentAddress payment_addresses = 12;
  optional string bban = 13 [(fideslang.data_category) = "user.financial.bank_account"]; // sort code and account number
  repeated RetiredPaymentAddress retired_payment_addresses = 14;
  optional string provider_account_id = 15 [(fideslang.data_category) = "system.operations"];
  optional AddressRotation rotation = 16;
  optional string refused_reason = 17;
  optional CashAccountStatus close_requested_from = 18;

  optional string idempotency_key = 100;
  required int64 created_at = 101;
  required com.repldriven.queenswood.schema.actor.Actor created_by = 102;
  optional int64 updated_at = 103;
  optional com.repldriven.queenswood.schema.actor.Actor updated_by = 104;
}
