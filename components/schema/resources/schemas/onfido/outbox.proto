syntax = "proto2";

package com.repldriven.queenswood.schemas.onfido;

import "record_metadata_options.proto";

option java_outer_classname = "OnfidoOutboxProto";

// Durable egress event for the Onfido adapter — the evidence a finished
// workflow run reports, or the hand-off the relay composed for a session.
// Written atomically with the webhook receipt or the intent it settles,
// relayed to the bus by a changelog watcher.
message OnfidoOutboxEvent {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string outbox_id = 1;       // primary key (uuidv7)
  required string dedup_key = 2;       // unique: verification-id + kind
  required string event_name = 3;      // bus event name to publish
  required bytes  payload = 4;         // Avro-serialised event payload
  optional string correlation_id = 5;
  optional string causation_id = 6;
  optional int64  created_at = 7;
  optional string traceparent = 8;   // W3C, see ChangelogEvent
}

// A pending outbound Onfido check submission. Written in the FDB
// transaction that consumes a submit-idv-check command, then executed by
// the out-of-transaction outbound relay (create-applicant + create-check).
// `request` is the JSON-encoded command data; the relay makes both calls.
message OnfidoOutboundIntent {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string intent_id = 1;       // primary key (uuidv7)
  required string dedup_key = 2;       // unique: verification-id
  required string request = 3;         // JSON-encoded submit-idv-check data
  required string status = 4;          // pending | sent | failed
  optional string correlation_id = 5;
  optional int64  attempts = 6;
  optional int64  created_at = 7;
  optional int64  sent_at = 8;
  optional string traceparent = 9;     // W3C, see ChangelogEvent
}
