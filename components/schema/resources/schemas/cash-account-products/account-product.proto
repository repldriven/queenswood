syntax = "proto2";

package com.repldriven.queenswood.schemas.cash_account_products;

import "record_metadata_options.proto";
import "schemas/balances/balance.proto";
import "schemas/types/product-type.proto";

option java_outer_classname = "CashAccountProductProto";

enum BalanceSheetSide {
  BALANCE_SHEET_SIDE_UNKNOWN = 0;
  BALANCE_SHEET_SIDE_ASSET = 1;
  BALANCE_SHEET_SIDE_LIABILITY = 2;
}

enum PaymentAddressScheme {
  PAYMENT_ADDRESS_SCHEME_UNKNOWN = 0;
  PAYMENT_ADDRESS_SCHEME_SCAN = 1;
  PAYMENT_ADDRESS_SCHEME_IBAN = 2;
  PAYMENT_ADDRESS_SCHEME_SWIFT = 3;
  PAYMENT_ADDRESS_SCHEME_ACH = 4;
}

// ISO 20022 ExternalCashAccountType1Code (subset used today). CACC =
// current; SVGS = savings; LLSV = savings with special interest or
// withdrawal terms (term-deposit fits here); TRAN = basic transacting;
// SACC = bank's own settlement account at a clearing rail (1100 family);
// CPAC = clearing-participant account (indirect access sponsor view).
enum IsoCashAccountType {
  ISO_CASH_ACCOUNT_TYPE_UNKNOWN = 0;
  ISO_CASH_ACCOUNT_TYPE_CACC = 1;
  ISO_CASH_ACCOUNT_TYPE_SVGS = 2;
  ISO_CASH_ACCOUNT_TYPE_LLSV = 3;
  ISO_CASH_ACCOUNT_TYPE_TRAN = 4;
  ISO_CASH_ACCOUNT_TYPE_SACC = 5;
  ISO_CASH_ACCOUNT_TYPE_CPAC = 6;
}

enum CashAccountProductStatus {
  CASH_ACCOUNT_PRODUCT_STATUS_UNKNOWN = 0;
  CASH_ACCOUNT_PRODUCT_STATUS_DRAFT = 1;
  CASH_ACCOUNT_PRODUCT_STATUS_PUBLISHED = 2;
  CASH_ACCOUNT_PRODUCT_STATUS_DISCARDED = 3;
}

// A versioned customer-facing instrument template: drives cash-account
// opening (allowed balance buckets, payment schemes, interest rate) and the
// outbound ISO 20022 account-type classification.
message CashAccountProduct {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  reserved 9;                          // was: optional string valid_from
  reserved "valid_from";
  reserved 20, 21, 22;                 // was: oneof kind { sub_ledger,
  reserved "sub_ledger", "general_ledger", "gl_code";  // general_ledger }, gl_code

  required string bank_id = 1;
  required string product_id = 2;
  required string version_id = 3;
  required int32 version_number = 4;
  required CashAccountProductStatus status = 5;
  required com.repldriven.queenswood.schemas.types.ProductType product_type = 6;
  required BalanceSheetSide balance_sheet_side = 7;
  required string name = 8;
  repeated string allowed_currencies = 10;
  // Effective window (epoch-day, int64) over which a published version is the
  // active one for opening accounts. effective_to is open-ended when absent.
  optional int64 effective_from = 11;
  optional int64 effective_to = 12;
  repeated com.repldriven.queenswood.schemas.balances.BalanceProduct balance_products = 13;
  required int64 created_at = 14;
  required int64 updated_at = 15;
  optional int64 discarded_at = 16;
  repeated PaymentAddressScheme allowed_payment_address_schemes = 17;
  optional int32 interest_rate_bps = 18;
  optional IsoCashAccountType iso_cash_account_type = 19;
  // The template this version was created from. The template's fields are
  // snapshotted into the version at creation, so later edits to the template
  // never change an existing product; this records the provenance only.
  optional string template_id = 23;
  // Snapshotted from the template: an internal product (e.g. the bank's
  // own-funds house product) is excluded from the customer-facing product
  // listing, mirroring how internal templates are hidden.
  optional bool internal = 24;
  // Client idempotency key (the command envelope :id) that created this
  // product. Unique-indexed per bank so a create-cash-account-product
  // command replayed with the same key reads the existing product back
  // instead of minting a duplicate draft. Only new-product stamps it;
  // publish, discard and update-version preserve it. A version reached by
  // any other path leaves it unset (protojure drops the empty default, so
  // it takes no unique-index entry).
  optional string idempotency_key = 25;
}

// A platform-scoped template (no bank_id) that defines the derived instrument
// fields a product is created from. Seeded at bootstrap, like platform
// policies; `internal` ones (e.g. own-funds) are excluded from the
// customer-facing template list.
message CashAccountProductTemplate {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string template_id = 1 [(com.apple.foundationdb.record.field).primary_key = true];
  optional string name = 2;
  required com.repldriven.queenswood.schemas.types.ProductType product_type = 3;
  required BalanceSheetSide balance_sheet_side = 4;
  repeated string allowed_currencies = 5;
  repeated com.repldriven.queenswood.schemas.balances.BalanceProduct balance_products = 6;
  repeated PaymentAddressScheme allowed_payment_address_schemes = 7;
  optional IsoCashAccountType iso_cash_account_type = 8;
  optional bool internal = 9;
  required int64 created_at = 10;
  required int64 updated_at = 11;
}
