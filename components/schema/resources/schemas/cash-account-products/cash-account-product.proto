syntax = "proto2";

package com.repldriven.queenswood.schemas.cash_account_products;

import "record_metadata_options.proto";
import "schemas/memberships/actor.proto";
import "schemas/cash-account-products/types.proto";
import "schemas/types/product-type.proto";

option java_outer_classname = "CashAccountProductProto";

enum CashAccountProductStatus {
  CASH_ACCOUNT_PRODUCT_STATUS_UNKNOWN = 0;
  CASH_ACCOUNT_PRODUCT_STATUS_DRAFT = 1;
  CASH_ACCOUNT_PRODUCT_STATUS_PUBLISHED = 2;
  CASH_ACCOUNT_PRODUCT_STATUS_DISCARDED = 3;
}

// A welcome reward paid once to an account opened under a version.
message OpeningReward {
  required int64 amount = 1; // minor units
}

// One version of a bank's cash account product.
message CashAccountProduct {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string bank_id = 1;
  required string product_id = 2;
  required string version_id = 3;
  required int32 version_number = 4;
  required string name = 5;
  required CashAccountProductStatus status = 6;
  required string template_id = 7;
  required com.repldriven.queenswood.schemas.types.ProductType product_type = 8;
  required BalanceSheetSide balance_sheet_side = 9;
  required bool internal = 10;
  required string currency = 11; // ISO 4217
  repeated PaymentAddressScheme allowed_payment_address_schemes = 12;
  optional IsoCashAccountType iso_cash_account_type = 13;
  repeated BalanceProduct balance_products = 14;
  required int32 interest_rate_bps = 15;
  optional OpeningReward opening_reward = 16;
  required int64 effective_from = 17; // epoch day
  optional int64 effective_to = 18; // epoch day

  optional int64 published_at = 51;
  optional com.repldriven.queenswood.schemas.memberships.Actor published_by = 52;
  optional int64 discarded_at = 53;
  optional com.repldriven.queenswood.schemas.memberships.Actor discarded_by = 54;

  optional string idempotency_key = 100;
  required int64 created_at = 101;
  required com.repldriven.queenswood.schemas.memberships.Actor created_by = 102;
  required int64 updated_at = 103;
}
