syntax = "proto2";

package com.repldriven.queenswood.schemas.form3;

import "record_metadata_options.proto";

option java_outer_classname = "Form3OutboxProto";

// An event the Form3 adapter has yet to publish to the bus.
message Form3OutboxEvent {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string outbox_id = 1; // uuidv7
  required string dedup_key = 2;
  required string event_name = 3;
  required bytes payload = 4; // Avro
  optional string correlation_id = 5;
  optional string causation_id = 6;
  optional string traceparent = 7; // W3C trace context
  optional string ordering_key = 8;

  required int64 created_at = 101;
}

// A pending call to Form3: a payment, or an account registered, closed or
// reissued. Written in the FDB transaction that
// consumes the command, then made by the out-of-transaction runner.
message Form3OutboundIntent {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string intent_id = 1;       // primary key (uuidv7)
  // The command's identity: the end-to-end id, the transfer id, or the
  // account call's key. Unique-indexed so a redelivered command does not
  // enqueue a second call.
  required string dedup_key = 2;
  required string request = 3;         // the call's JSON body
  // pending | sent | settled | failed
  required string status = 4;
  optional string correlation_id = 5;
  optional int64  attempts = 6;
  optional int64  created_at = 7;
  optional int64  sent_at = 8;
  // Epoch millis. For a pending intent, when to call next; for a sent
  // one, when to ask Form3 what became of it. Absent means now.
  optional int64  next_attempt_at = 9;
  // payment, open-account, close-account or reissue-address.
  optional string kind = 10;
  // EDN the runner needs to finish the call: the bank and account ids,
  // a rotation's key, a reissue's progress.
  optional string context = 11;
  optional string traceparent = 12;    // W3C, see ChangelogEvent
  // Form3's id for the payment the call created, chosen by the adapter,
  // which a reconciliation reads back.
  optional string provider_payment_id = 14;
  // What the call acts on at the provider, the cash accounts for a
  // payment provider. The runner makes a subject's calls in the order
  // they were accepted (ADR-0033).
  repeated string subjects = 15;
}
