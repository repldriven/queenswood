syntax = "proto2";

package com.repldriven.queenswood.schemas.form3;

import "record_metadata_options.proto";
import "schemas/outbound/types.proto";

option java_outer_classname = "Form3OutboundIntentProto";

enum Form3OutboundIntentKind {
  FORM3_OUTBOUND_INTENT_KIND_UNKNOWN = 0;
  FORM3_OUTBOUND_INTENT_KIND_PAYMENT = 1;
  FORM3_OUTBOUND_INTENT_KIND_RETURN = 2;
  FORM3_OUTBOUND_INTENT_KIND_OPEN_ACCOUNT = 3;
  FORM3_OUTBOUND_INTENT_KIND_CLOSE_ACCOUNT = 4;
  FORM3_OUTBOUND_INTENT_KIND_REISSUE_ADDRESS = 5;
}

// A call to Form3 the adapter has yet to make, or to hear back from.
message Form3OutboundIntent {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string intent_id = 1; // uuidv7
  required Form3OutboundIntentKind kind = 2;
  required com.repldriven.queenswood.schemas.outbound.OutboundIntentStatus status = 3;
  required string request = 4; // JSON
  optional string context = 5; // EDN
  repeated string subjects = 6;
  optional string correlation_id = 7;
  optional string provider_payment_id = 8;

  optional int64 sent_at = 51;

  required string idempotency_key = 100; // the command's dedup key
  required int64 created_at = 101;

  optional string failure_reason = 200;

  required int32 attempt_count = 201;
  optional int64 next_attempt_at = 202;
  optional string traceparent = 203; // W3C trace context
}

