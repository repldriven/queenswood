syntax = "proto2";

package com.repldriven.queenswood.schemas.banks;

import "record_metadata_options.proto";
import "schemas/actor/actor.proto";

option java_outer_classname = "BankProto";

enum BankStatus {
  BANK_STATUS_UNKNOWN = 0;
  BANK_STATUS_TEST = 1;
  BANK_STATUS_LIVE = 2;
}

// A bank run on the platform.
message Bank {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string bank_id = 1 [(com.apple.foundationdb.record.field).primary_key = true];

  required string name = 2;
  required BankStatus status = 3;
  required string tier = 4;
  repeated BankProvider providers = 5;
  optional BankCompanyBinding company_binding = 6;

  optional int64 status_changed_at = 51;
  optional com.repldriven.queenswood.schemas.actor.Actor status_changed_by = 52;
  optional int64 tier_changed_at = 53;
  optional com.repldriven.queenswood.schemas.actor.Actor tier_changed_by = 54;

  required string idempotency_key = 100;
  required int64 created_at = 101;
  required com.repldriven.queenswood.schemas.actor.Actor created_by = 102;
  optional int64 updated_at = 103;
}

// The provider of one kind a bank runs on.
message BankProvider {
  required string kind = 1; // e.g. "payment"
  required string provider = 2; // e.g. "modulr"
}

// The company a bank is bound to, as its registry held it.
message BankCompanyBinding {
  required string registry = 1; // e.g. "uk-companies-house"
  required string company_number = 2;
  optional string company_name = 3;
  optional string company_status = 4;
  optional string type = 5;
  optional string jurisdiction = 6;
  optional string date_of_creation = 7;
  optional string registered_office_address = 8; // joined address lines
}
