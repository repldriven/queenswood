syntax = "proto2";

package com.repldriven.queenswood.schemas.cash_accounts;

import "record_metadata_options.proto";
import "schemas/cash-account-products/account-product.proto";
import "schemas/types/product-type.proto";

option java_outer_classname = "CashAccountProto";

message ScanAddress {
  required string sort_code = 1;
  required string account_number = 2;
}

message PaymentAddress {
  required com.repldriven.queenswood.schemas.cash_account_products.PaymentAddressScheme scheme = 1;
  // Sibling optional variants (no proto `oneof` wrapper) so the
  // protojure-deserialised Clojure shape matches the Avro response
  // shape directly — `{scheme, scan, value}`. Field tags 2/3 are
  // preserved for wire compatibility with any previously-written
  // records. Domain code is responsible for setting at most one.
  optional ScanAddress scan = 2;
  optional string value = 3;
}

message RetiredPaymentAddress {
  required PaymentAddress address = 1;
  required int64 retired_at = 2;
}

enum AccountType {
  ACCOUNT_TYPE_UNKNOWN = 0;
  ACCOUNT_TYPE_PERSONAL = 1;
  ACCOUNT_TYPE_BUSINESS = 2;
}

message CashAccount {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string bank_id = 1;
  required string account_id = 2;
  // Tag 3 (account_type) derived from the holder party — personal for a
  // person party, business otherwise (incl. the bank's org party). Always
  // set by the domain; kept optional at the wire level only for record
  // compatibility.
  optional AccountType account_type = 3;
  required string party_id = 4;
  required string product_id = 5;
  required string version_id = 6;
  // Tag 7 (product_type) cached from the product for the
  // CashAccount_count_by_bank_product_account_type_currency index. Customer
  // accounts carry their product type; the bank's own-funds account carries
  // PRODUCT_TYPE_SUB_LEDGER_OWN_FUNDS.
  optional com.repldriven.queenswood.schemas.types.ProductType product_type = 7;
  required string name = 8;
  required string currency = 9;
  required CashAccountStatus account_status = 10;
  repeated PaymentAddress payment_addresses = 11;
  optional string bban = 12; // denormalised for indexing: sort_code + account_number
  required int64 created_at = 13;
  required int64 updated_at = 14;

  // Customer accounts (current/savings/term-deposit) inherit a direct
  // pointer to the matching GL control account, resolved at open-time by
  // chasing product-type → control gl-code → GL product → GL account. The
  // add-control-legs paired-leg construction reads this pointer directly so
  // posting is one extra lookup per leg, not a four-hop chase. GL
  // accounts leave it unset (they ARE the controls; they don't roll up).
  optional string gl_control_account_id = 20;

  // Client idempotency key (the command envelope :id, sourced from the
  // required Idempotency-Key header) that opened this account. Unique-indexed
  // per bank so a redelivered or retried open-cash-account command reads the
  // existing account back instead of creating a duplicate. Optional at the
  // wire level for compatibility with accounts written before this field.
  optional string idempotency_key = 21;

  // Rotation history (QNS-20): every payment address ever replaced by
  // `rotate-address`, oldest first. Append-only — a rotation never
  // removes an entry, it only adds one. Tag 22 is reserved for
  // QNS-37's last_customer_activity_at.
  repeated RetiredPaymentAddress retired_payment_addresses = 23;

  // The idempotency key of the rotation that last replaced this account's
  // payment addresses. A rotate-cash-account-address command retried under
  // that same key returns the account unchanged rather than allocating a
  // second set. Optional at the wire level for compatibility with accounts
  // written before this field.
  optional string last_rotation_idempotency_key = 24;

  enum CashAccountStatus {
    CASH_ACCOUNT_STATUS_UNKNOWN = 0;
    CASH_ACCOUNT_STATUS_OPENING = 1;
    CASH_ACCOUNT_STATUS_OPENED = 2;
    CASH_ACCOUNT_STATUS_CLOSING = 3;
    CASH_ACCOUNT_STATUS_CLOSED = 4;
    CASH_ACCOUNT_STATUS_SUSPENDED = 5;
  }
}
