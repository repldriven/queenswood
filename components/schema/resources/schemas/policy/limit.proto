syntax = "proto2";

package com.repldriven.queenswood.schema.policy;

import "schemas/account-product-type/account-product-type.proto";
import "schemas/account-type/account-type.proto";
import "schemas/actor/actor.proto";
import "schemas/amount/amount.proto";
import "schemas/balance/types.proto";
import "schemas/bank/bank.proto";
import "schemas/party/party.proto";
import "schemas/policy/capability.proto";
import "schemas/policy/types.proto";
import "schemas/scheme-type/scheme-type.proto";
import "schemas/transaction/transaction.proto";

option java_outer_classname = "LimitProto";

enum TimeWindow {
  TIME_WINDOW_UNKNOWN = 0;
  TIME_WINDOW_INSTANT = 1;
  TIME_WINDOW_DAILY = 2;
  TIME_WINDOW_WEEKLY = 3;
  TIME_WINDOW_MONTHLY = 4;
  TIME_WINDOW_ROLLING = 5;
  TIME_WINDOW_QUARTERLY = 6;
  TIME_WINDOW_ANNUALLY = 7;
}

// The day a window's periods are counted from.
enum WindowAnchor {
  WINDOW_ANCHOR_UNKNOWN = 0;
  WINDOW_ANCHOR_ACCOUNT = 1; // the day the account was opened
  WINDOW_ANCHOR_CALENDAR = 2; // the first of the month, quarter or year, or starts_month and starts_day_of_month
}

message AmountAggregate {
  required com.repldriven.queenswood.schema.amount.Amount value = 1;
  required TimeWindow window = 2;
  optional int64 rolling_window_ms = 3;
  optional WindowAnchor anchor = 4;
  optional int32 starts_month = 5; // 1 to 12
  optional int32 starts_day_of_month = 6; // 1 to 28
}

message CountAggregate {
  required int64 value = 1;
  required TimeWindow window = 2;
  optional int64 rolling_window_ms = 3;
  optional WindowAnchor anchor = 4;
  optional int32 starts_month = 5; // 1 to 12
  optional int32 starts_day_of_month = 6; // 1 to 28
}

message Aggregate {
  oneof kind {
    AmountAggregate amount = 1;
    CountAggregate count = 2;
  }
}

message MaxBound {
  required Aggregate aggregate = 1;
}

message MinBound {
  required Aggregate aggregate = 1;
}

message RangeBound {
  required Aggregate min = 1;
  required Aggregate max = 2;
}

message Bound {
  oneof kind {
    MaxBound max = 1;
    MinBound min = 2;
    RangeBound range = 3;
  }
}

enum LimitAllow {
  LIMIT_ALLOW_UNKNOWN = 0;
  LIMIT_ALLOW_IMPROVING = 1;
}

// Whether a payment is into an account or out of it.
enum PaymentDirection {
  PAYMENT_DIRECTION_UNKNOWN = 0;
  PAYMENT_DIRECTION_IN = 1;
  PAYMENT_DIRECTION_OUT = 2;
}

// A filter naming a direction bounds one account's payments in it.
message AccountPaymentLimitFilter {
  optional PaymentDirection direction = 1;
}

message AccountPaymentLimit {
  repeated AccountPaymentLimitFilter filters = 1;
}

message ActualBalance {
  required com.repldriven.queenswood.schema.balance.BalanceType type = 1;
  required com.repldriven.queenswood.schema.balance.BalanceStatus status = 2;
}

message ComputedBalance {
  required string name = 1;
}

message BalanceLimitFilter {
  oneof kind {
    ActualBalance actual = 1;
    ComputedBalance computed = 2;
  }
  optional com.repldriven.queenswood.schema.transaction.TransactionType transaction_type = 3;
}

message BalanceLimit {
  repeated BalanceLimitFilter filters = 1;
}

// A filter naming a tier bounds the banks on it, and one naming a kind of
// creator as well the banks one creator of that kind has on it.
message BankLimitFilter {
  optional string tier = 1;
  optional com.repldriven.queenswood.schema.bank.BankStatus status = 2;
  optional com.repldriven.queenswood.schema.actor.ActorKind created_by_kind = 3;
}

message BankLimit {
  repeated BankLimitFilter filters = 1;
}

message CashAccountLimitFilter {
  optional com.repldriven.queenswood.schema.account_product_type.AccountProductType product_type = 1;
  optional com.repldriven.queenswood.schema.account_type.AccountType account_type = 2;
  optional string currency = 3;
}

message CashAccountLimit {
  repeated CashAccountLimitFilter filters = 1;
}

enum CashAccountMigrationAction {
  CASH_ACCOUNT_MIGRATION_ACTION_UNKNOWN = 0;
  CASH_ACCOUNT_MIGRATION_ACTION_RUN = 1;
  CASH_ACCOUNT_MIGRATION_ACTION_PREVIEW = 2;
}

message CashAccountMigrationLimitFilter {
  optional CashAccountMigrationAction action = 1;
}

message CashAccountMigrationLimit {
  repeated CashAccountMigrationLimitFilter filters = 1;
}

message CashAccountOperationLimit {}

message CashAccountProductLimitFilter {
  optional com.repldriven.queenswood.schema.account_product_type.AccountProductType product_type = 1;
}

message CashAccountProductLimit {
  repeated CashAccountProductLimitFilter filters = 1;
}

message EmailLimit {}

message IdvLimit {}

// A filter naming a product type bounds the inbound payments to accounts
// of that type.
message InboundPaymentLimitFilter {
  optional com.repldriven.queenswood.schema.scheme_type.SchemeType scheme = 1;
  optional com.repldriven.queenswood.schema.account_product_type.AccountProductType product_type = 2;
}

message InboundPaymentLimit {
  repeated InboundPaymentLimitFilter filters = 1;
}

message InterestLimitFilter {
  optional InterestAction action = 1;
}

message InterestLimit {
  repeated InterestLimitFilter filters = 1;
}

message InternalPaymentLimit {}

message InvitationLimit {}

message MemberLimit {}

message OutboundPaymentLimitFilter {
  optional com.repldriven.queenswood.schema.scheme_type.SchemeType scheme = 1;
}

message OutboundPaymentLimit {
  repeated OutboundPaymentLimitFilter filters = 1;
}

message PartyLimitFilter {
  optional com.repldriven.queenswood.schema.party.PartyType type = 1;
  optional com.repldriven.queenswood.schema.party.PartyStatus status = 2;
}

message PartyLimit {
  repeated PartyLimitFilter filters = 1;
}

message PayeeCheckLimit {}

message PolicyLimitFilter {
  optional PolicyCategory category = 1;
}

message PolicyLimit {
  repeated PolicyLimitFilter filters = 1;
}

message TransactionLimit {}

message WebhookEndpointLimit {}

message WebhookTestNotificationLimit {}

message Limit {
  required Bound bound = 1;
  optional string reason = 2;
  optional LimitAllow allow = 3;

  oneof kind {
    BalanceLimit balance = 11;
    BankLimit bank = 12;
    CashAccountLimit cash_account = 13;
    CashAccountMigrationLimit cash_account_migration = 14;
    CashAccountProductLimit cash_account_product = 15;
    IdvLimit idv = 16;
    InboundPaymentLimit inbound_payment = 17;
    InterestLimit interest = 18;
    InternalPaymentLimit internal_payment = 19;
    OutboundPaymentLimit outbound_payment = 20;
    PartyLimit party = 21;
    PayeeCheckLimit payee_check = 22;
    PolicyLimit policy = 23;
    TransactionLimit transaction = 24;
    WebhookEndpointLimit webhook_endpoint = 25;
    InvitationLimit invitation = 26;
    MemberLimit member = 27;
    EmailLimit email = 28;
    AccountPaymentLimit account_payment = 29;
    WebhookTestNotificationLimit webhook_test_notification = 30;
    CashAccountOperationLimit cash_account_operation = 31;
  }
}
