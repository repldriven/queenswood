syntax = "proto2";

package com.repldriven.queenswood.schema.audit;

import "schemas/actor/actor.proto";

option java_outer_classname = "AuditEventProto";

// The kind of record an act was performed on. Each takes a multiple of
// ten, and the kinds of act on it number up from it.
enum AuditSubjectKind {
  AUDIT_SUBJECT_KIND_UNKNOWN = 0;
  AUDIT_SUBJECT_KIND_BANK = 10;
  AUDIT_SUBJECT_KIND_INVITATION = 20;
  AUDIT_SUBJECT_KIND_MEMBER = 30;
  AUDIT_SUBJECT_KIND_PARTY = 40;
  AUDIT_SUBJECT_KIND_VERIFICATION_SESSION = 50;
  AUDIT_SUBJECT_KIND_CASH_ACCOUNT = 60;
  AUDIT_SUBJECT_KIND_PRODUCT = 70;
  AUDIT_SUBJECT_KIND_MIGRATION = 80;
  AUDIT_SUBJECT_KIND_INTERNAL_PAYMENT = 90;
  AUDIT_SUBJECT_KIND_OUTBOUND_PAYMENT = 100;
  AUDIT_SUBJECT_KIND_PAYEE_CHECK = 110;
  AUDIT_SUBJECT_KIND_TRANSACTION = 120;
  AUDIT_SUBJECT_KIND_WEBHOOK_ENDPOINT = 130;
  AUDIT_SUBJECT_KIND_JOB = 140;
}

// The act, numbered in its subject kind's band of ten.
enum AuditEventKind {
  AUDIT_EVENT_KIND_UNKNOWN = 0;

  AUDIT_EVENT_KIND_BANK_CREATED = 11;
  AUDIT_EVENT_KIND_BANK_TIER_CHANGED = 12;
  AUDIT_EVENT_KIND_BANK_STATUS_CHANGED = 13;

  AUDIT_EVENT_KIND_INVITATION_CREATED = 21;
  AUDIT_EVENT_KIND_INVITATION_RESENT = 22;
  AUDIT_EVENT_KIND_INVITATION_ACCEPTED = 23;
  AUDIT_EVENT_KIND_INVITATION_DECLINED = 24;
  AUDIT_EVENT_KIND_INVITATION_WITHDRAWN = 25;

  AUDIT_EVENT_KIND_MEMBER_ROLE_CHANGED = 31;
  AUDIT_EVENT_KIND_MEMBER_REMOVED = 32;
  AUDIT_EVENT_KIND_MEMBER_LEFT = 33;

  AUDIT_EVENT_KIND_PARTY_CREATED = 41;
  AUDIT_EVENT_KIND_PARTY_SUSPENDED = 42;
  AUDIT_EVENT_KIND_PARTY_RESUMED = 43;
  AUDIT_EVENT_KIND_PARTY_CLOSED = 44;
  AUDIT_EVENT_KIND_PARTY_MERGED = 45;

  AUDIT_EVENT_KIND_VERIFICATION_SESSION_OPENED = 51;

  AUDIT_EVENT_KIND_CASH_ACCOUNT_OPENED = 61;
  AUDIT_EVENT_KIND_CASH_ACCOUNT_SUSPENDED = 62;
  AUDIT_EVENT_KIND_CASH_ACCOUNT_RESUMED = 63;
  AUDIT_EVENT_KIND_CASH_ACCOUNT_CLOSE_REQUESTED = 64;
  AUDIT_EVENT_KIND_CASH_ACCOUNT_ROTATION_REQUESTED = 65;

  AUDIT_EVENT_KIND_PRODUCT_CREATED = 71;
  AUDIT_EVENT_KIND_PRODUCT_VERSION_DRAFTED = 72;
  AUDIT_EVENT_KIND_PRODUCT_VERSION_UPDATED = 73;
  AUDIT_EVENT_KIND_PRODUCT_VERSION_PUBLISHED = 74;
  AUDIT_EVENT_KIND_PRODUCT_VERSION_DISCARDED = 75;

  AUDIT_EVENT_KIND_MIGRATION_CREATED = 81;
  AUDIT_EVENT_KIND_MIGRATION_APPROVED = 82;
  AUDIT_EVENT_KIND_MIGRATION_CANCELLED = 83;
  AUDIT_EVENT_KIND_MIGRATION_PREVIEWED = 84;

  AUDIT_EVENT_KIND_INTERNAL_PAYMENT_SUBMITTED = 91;

  AUDIT_EVENT_KIND_OUTBOUND_PAYMENT_SUBMITTED = 101;

  AUDIT_EVENT_KIND_PAYEE_CHECK_MADE = 111;

  AUDIT_EVENT_KIND_TRANSACTION_SIMULATED = 121;

  AUDIT_EVENT_KIND_WEBHOOK_ENDPOINT_REGISTERED = 131;
  AUDIT_EVENT_KIND_WEBHOOK_ENDPOINT_UPDATED = 132;
  AUDIT_EVENT_KIND_WEBHOOK_ENDPOINT_ENABLED = 133;
  AUDIT_EVENT_KIND_WEBHOOK_ENDPOINT_DISABLED = 134;
  AUDIT_EVENT_KIND_WEBHOOK_ENDPOINT_REMOVED = 135;
  AUDIT_EVENT_KIND_WEBHOOK_ENDPOINT_SECRET_ROTATED = 136;
  AUDIT_EVENT_KIND_WEBHOOK_ENDPOINT_TEST_SENT = 137;
  AUDIT_EVENT_KIND_WEBHOOK_ENDPOINT_DELIVERIES_RESENT = 138;

  AUDIT_EVENT_KIND_JOB_SCHEDULE_UPDATED = 141;
  AUDIT_EVENT_KIND_JOB_PAUSED = 142;
  AUDIT_EVENT_KIND_JOB_RESUMED = 143;
  AUDIT_EVENT_KIND_JOB_RUN_FORCED = 144;
}

// One act a person, a bank or an operator performed on a bank's record,
// appended under the bank in the transaction that made it and keyed by
// that commit's versionstamp. Not a record type: nothing updates it.
message AuditEvent {
  required string bank_id = 1;

  required AuditEventKind kind = 2;
  required AuditSubjectKind subject_kind = 3;
  required string subject_id = 4;
  optional string request_id = 5; // uuidv7, the API request that made it
  optional string details = 6; // json, what the act carried

  required int64 created_at = 101;
  required com.repldriven.queenswood.schema.actor.Actor created_by = 102;
}
