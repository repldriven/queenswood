syntax = "proto2";

package com.repldriven.queenswood.schemas.modulr;

import "record_metadata_options.proto";
import "schemas/outbound/types.proto";

option java_outer_classname = "ModulrOutboundIntentProto";

enum ModulrOutboundIntentKind {
  MODULR_OUTBOUND_INTENT_KIND_UNKNOWN = 0;
  MODULR_OUTBOUND_INTENT_KIND_PAYMENT = 1;
  MODULR_OUTBOUND_INTENT_KIND_TRANSFER = 2;
  MODULR_OUTBOUND_INTENT_KIND_CREDIT = 3;
  MODULR_OUTBOUND_INTENT_KIND_OPEN_ACCOUNT = 4;
  MODULR_OUTBOUND_INTENT_KIND_CLOSE_ACCOUNT = 5;
  MODULR_OUTBOUND_INTENT_KIND_REISSUE_ADDRESS = 6;
}

// A call to Modulr the adapter has yet to make, or to hear back from.
message ModulrOutboundIntent {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string intent_id = 1; // uuidv7
  required string dedup_key = 2;
  required ModulrOutboundIntentKind kind = 3;
  required com.repldriven.queenswood.schemas.outbound.OutboundIntentStatus status = 4;
  required string request = 5; // JSON
  optional string context = 6; // EDN
  repeated string subjects = 7;
  optional string correlation_id = 8;
  optional string traceparent = 9; // W3C trace context
  required int64 attempts = 10;
  optional int64 next_attempt_at = 11; // epoch millis
  optional string nonce = 12;
  optional string provider_payment_id = 13;

  optional int64 sent_at = 51;

  required int64 created_at = 101;
}
