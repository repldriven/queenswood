syntax = "proto2";

package com.repldriven.queenswood.schema.reward;

import "record_metadata_options.proto";
import "schemas/cash-account-product/types.proto";

option java_outer_classname = "AccountRewardProto";

enum AccountRewardStatus {
  ACCOUNT_REWARD_STATUS_UNKNOWN = 0;
  ACCOUNT_REWARD_STATUS_DEFERRED = 1;
  ACCOUNT_REWARD_STATUS_PAID = 2;
}

// A reward owed or paid to one cash account.
message AccountReward {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string bank_id = 1;
  required string reward_id = 2; // rwd.<uuidv7>

  required AccountRewardStatus status = 3;
  required com.repldriven.queenswood.schema.cash_account_product.RewardKind kind = 4;
  required string account_id = 5;
  required string product_id = 6;
  required string version_id = 7;
  required int64 amount = 8; // minor units
  required string currency = 9; // ISO 4217
  optional string transaction_id = 10;
  optional string deferred_reason = 11;

  optional int64 deferred_at = 51;
  optional int64 paid_at = 53;

  required int64 created_at = 101;
  optional int64 updated_at = 103;
}
