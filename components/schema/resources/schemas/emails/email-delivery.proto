syntax = "proto2";

package com.repldriven.queenswood.schemas.emails;

import "record_metadata_options.proto";

option java_outer_classname = "EmailDeliveryProto";

enum EmailKind {
  EMAIL_KIND_UNKNOWN = 0;
  EMAIL_KIND_INVITATION = 1;
}

enum EmailDeliveryStatus {
  EMAIL_DELIVERY_STATUS_UNKNOWN = 0;
  EMAIL_DELIVERY_STATUS_PENDING = 1;
  EMAIL_DELIVERY_STATUS_IN_FLIGHT = 2;
  EMAIL_DELIVERY_STATUS_SENT = 3;
  EMAIL_DELIVERY_STATUS_SUPERSEDED = 4;
  EMAIL_DELIVERY_STATUS_FAILED = 5;
}

// An email to send, written before the send.
message EmailDelivery {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string bank_id = 1;
  required string delivery_id = 2;
  required EmailKind kind = 3;
  required EmailDeliveryStatus status = 4;
  required string kind_id = 5; // the id of the record the kind names
  optional string message_id = 6; // Message-ID

  optional int64 sent_at = 51;

  required string idempotency_key = 100; // the changelog entry that asked for it
  required int64 created_at = 101;
  required int64 updated_at = 103;

  optional string failure_reason = 200;

  required int32 attempt_count = 201;
  optional int64 next_attempt_at = 202; // in flight: when the claim lapses
  optional string traceparent = 203; // W3C trace context
}
