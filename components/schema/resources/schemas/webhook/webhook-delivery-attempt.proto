syntax = "proto2";

package com.repldriven.queenswood.schema.webhook;

import "record_metadata_options.proto";

option java_outer_classname = "WebhookDeliveryAttemptProto";

// One call made to deliver a notification.
message WebhookDeliveryAttempt {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string bank_id = 1;
  required string delivery_id = 2;
  required string attempt_id = 3; // wha.<uuidv7>

  optional int32 response_status = 4;
  optional string failed_reason = 5;
  required int64 duration_ms = 6;

  required int64 created_at = 101;
}
