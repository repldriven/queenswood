syntax = "proto2";

package com.repldriven.queenswood.schema.webhook;

import "record_metadata_options.proto";
import "schemas/actor/actor.proto";

option java_outer_classname = "WebhookEndpointProto";

enum WebhookEndpointStatus {
  WEBHOOK_ENDPOINT_STATUS_UNKNOWN = 0;
  WEBHOOK_ENDPOINT_STATUS_ENABLED = 1;
  WEBHOOK_ENDPOINT_STATUS_DISABLED = 2;
  WEBHOOK_ENDPOINT_STATUS_REMOVED = 3;
}

// A bank's registered destination for webhook notifications.
message WebhookEndpoint {
  option (com.apple.foundationdb.record.record).usage = RECORD;

  required string bank_id = 1;
  required string endpoint_id = 2; // whe.<uuidv7>

  required WebhookEndpointStatus status = 3;
  required string address = 4;
  optional string description = 5;
  repeated string kinds = 6;
  required string secret = 7; // whsec_<base64url>
  optional string previous_secret = 8; // whsec_<base64url>
  optional int64 previous_secret_expires_at = 9;
  optional string rotation_idempotency_key = 10;

  optional int64 disabled_at = 51;
  optional com.repldriven.queenswood.schema.actor.Actor disabled_by = 52;
  optional int64 enabled_at = 53;
  optional com.repldriven.queenswood.schema.actor.Actor enabled_by = 54;
  optional int64 removed_at = 55;
  optional com.repldriven.queenswood.schema.actor.Actor removed_by = 56;
  optional int64 secret_rotated_at = 57;
  optional com.repldriven.queenswood.schema.actor.Actor secret_rotated_by = 58;

  required string idempotency_key = 100;
  required int64 created_at = 101;
  required com.repldriven.queenswood.schema.actor.Actor created_by = 102;
  optional int64 updated_at = 103;
  optional com.repldriven.queenswood.schema.actor.Actor updated_by = 104;
}
