syntax = "proto2";

package com.repldriven.queenswood.schemas.policies;

import "schemas/balances/types.proto";
import "schemas/banks/bank.proto";
import "schemas/cash-accounts/types.proto";
import "schemas/party/party.proto";
import "schemas/policies/types.proto";
import "schemas/schemes/scheme.proto";
import "schemas/types/product-type.proto";

option java_outer_classname = "CapabilityProto";

enum BalanceAction {
  BALANCE_ACTION_UNKNOWN = 0;
  BALANCE_ACTION_CREATE = 1;
  BALANCE_ACTION_APPLY = 2;
}

message BalanceCapabilityFilter {
  optional com.repldriven.queenswood.schemas.balances.BalanceType balance_type = 1;
  optional com.repldriven.queenswood.schemas.balances.BalanceStatus balance_status = 2;
}

message BalanceCapability {
  required BalanceAction action = 1;
  repeated BalanceCapabilityFilter filters = 2;
}

enum BankAction {
  BANK_ACTION_UNKNOWN = 0;
  BANK_ACTION_CREATE = 1;
}

message BankCapabilityFilter {
  optional com.repldriven.queenswood.schemas.banks.BankStatus status = 2;
}

message BankCapability {
  required BankAction action = 1;
  repeated BankCapabilityFilter filters = 2;
}

enum CashAccountAction {
  CASH_ACCOUNT_ACTION_UNKNOWN = 0;
  CASH_ACCOUNT_ACTION_OPEN = 1;
  CASH_ACCOUNT_ACTION_CLOSE = 2;
  CASH_ACCOUNT_ACTION_SUSPEND = 3;
  CASH_ACCOUNT_ACTION_RESUME = 4;
  CASH_ACCOUNT_ACTION_CLOSE_NON_ZERO = 6;
  CASH_ACCOUNT_ACTION_ROTATE_ADDRESS = 7;
  CASH_ACCOUNT_ACTION_MIGRATE = 8;
}

message CashAccountCapabilityFilter {
  optional com.repldriven.queenswood.schemas.cash_accounts.AccountType account_type = 1;
}

message CashAccountCapability {
  required CashAccountAction action = 1;
  repeated CashAccountCapabilityFilter filters = 2;
}

enum CashAccountProductAction {
  CASH_ACCOUNT_PRODUCT_ACTION_UNKNOWN = 0;
  CASH_ACCOUNT_PRODUCT_ACTION_DRAFT = 1;
  CASH_ACCOUNT_PRODUCT_ACTION_PUBLISH = 2;
}

message CashAccountProductCapabilityFilter {
  optional com.repldriven.queenswood.schemas.types.ProductType product_type = 1;
}

message CashAccountProductCapability {
  required CashAccountProductAction action = 1;
  repeated CashAccountProductCapabilityFilter filters = 2;
}

enum IdvAction {
  IDV_ACTION_UNKNOWN = 0;
  IDV_ACTION_SUBMIT = 1;
  IDV_ACTION_ACCEPT = 2;
}

enum IdvVerification {
  IDV_VERIFICATION_UNKNOWN = 0;
  IDV_VERIFICATION_IDENTITY = 1;
  IDV_VERIFICATION_LIVENESS = 2;
  IDV_VERIFICATION_CLAIMED_IDENTITY = 3;
  IDV_VERIFICATION_ADDRESS = 4;
}

enum IdvScreening {
  IDV_SCREENING_UNKNOWN = 0;
  IDV_SCREENING_SANCTIONS = 1;
  IDV_SCREENING_PEP = 2;
}

message IdvCapabilityFilter {
  optional com.repldriven.queenswood.schemas.party.PartyType party_type = 1;
  optional IdvVerification unverified = 2;
  optional IdvScreening unscreened = 3;
}

message IdvCapability {
  required IdvAction action = 1;
  repeated IdvCapabilityFilter filters = 2;
}

enum InboundPaymentAction {
  INBOUND_PAYMENT_ACTION_UNKNOWN = 0;
  INBOUND_PAYMENT_ACTION_RECEIVE = 1;
}

message InboundPaymentCapabilityFilter {
  optional com.repldriven.queenswood.schemas.schemes.SchemeType scheme = 1;
}

message InboundPaymentCapability {
  required InboundPaymentAction action = 1;
  repeated InboundPaymentCapabilityFilter filters = 2;
}

enum InterestAction {
  INTEREST_ACTION_UNKNOWN = 0;
  INTEREST_ACTION_ACCRUE = 1;
  INTEREST_ACTION_CAPITALIZE = 2;
}

message InterestCapability {
  required InterestAction action = 1;
}

enum InternalPaymentAction {
  INTERNAL_PAYMENT_ACTION_UNKNOWN = 0;
  INTERNAL_PAYMENT_ACTION_SUBMIT = 1;
}

message InternalPaymentCapability {
  required InternalPaymentAction action = 1;
}

enum LedgerAccountAction {
  LEDGER_ACCOUNT_ACTION_UNKNOWN = 0;
  LEDGER_ACCOUNT_ACTION_OPEN = 1;
  LEDGER_ACCOUNT_ACTION_CLOSE = 2;
}

message LedgerAccountCapability {
  required LedgerAccountAction action = 1;
}

enum OutboundPaymentAction {
  OUTBOUND_PAYMENT_ACTION_UNKNOWN = 0;
  OUTBOUND_PAYMENT_ACTION_SEND = 1;
}

message OutboundPaymentCapabilityFilter {
  optional com.repldriven.queenswood.schemas.schemes.SchemeType scheme = 1;
}

message OutboundPaymentCapability {
  required OutboundPaymentAction action = 1;
  repeated OutboundPaymentCapabilityFilter filters = 2;
}

enum PartyAction {
  PARTY_ACTION_UNKNOWN = 0;
  PARTY_ACTION_CREATE = 1;
  PARTY_ACTION_MERGE = 2;
  PARTY_ACTION_SUSPEND = 3;
  PARTY_ACTION_RESUME = 4;
  PARTY_ACTION_CLOSE = 5;
}

message PartyCapabilityFilter {
  optional com.repldriven.queenswood.schemas.party.PartyType type = 1;
  optional com.repldriven.queenswood.schemas.party.PartyStatus status = 2;
}

message PartyCapability {
  required PartyAction action = 1;
  repeated PartyCapabilityFilter filters = 2;
}

enum PayeeCheckAction {
  PAYEE_CHECK_ACTION_UNKNOWN = 0;
  PAYEE_CHECK_ACTION_CHECK = 1;
}

message PayeeCheckCapability {
  required PayeeCheckAction action = 1;
}

enum PolicyAction {
  POLICY_ACTION_UNKNOWN = 0;
  POLICY_ACTION_CREATE = 1;
  POLICY_ACTION_BIND = 2;
}

message PolicyCapabilityFilter {
  optional PolicyCategory category = 1;
}

message PolicyCapability {
  required PolicyAction action = 1;
  repeated PolicyCapabilityFilter filters = 2;
}

enum TransactionAction {
  TRANSACTION_ACTION_UNKNOWN = 0;
  TRANSACTION_ACTION_CREATE = 1;
}

message TransactionCapability {
  required TransactionAction action = 1;
}

enum WebhookEndpointAction {
  WEBHOOK_ENDPOINT_ACTION_UNKNOWN = 0;
  WEBHOOK_ENDPOINT_ACTION_REGISTER = 1;
  WEBHOOK_ENDPOINT_ACTION_MANAGE = 2;
}

message WebhookEndpointCapability {
  required WebhookEndpointAction action = 1;
}

enum Effect {
  EFFECT_UNKNOWN = 0;
  EFFECT_ALLOW = 1;
  EFFECT_DENY = 2;
}

message Capability {
  required Effect effect = 1;
  optional string reason = 2;

  oneof kind {
    BalanceCapability balance = 11;
    BankCapability bank = 12;
    CashAccountCapability cash_account = 13;
    CashAccountProductCapability cash_account_product = 14;
    IdvCapability idv = 15;
    InboundPaymentCapability inbound_payment = 16;
    InterestCapability interest = 17;
    InternalPaymentCapability internal_payment = 18;
    LedgerAccountCapability ledger_account = 19;
    OutboundPaymentCapability outbound_payment = 20;
    PartyCapability party = 21;
    PayeeCheckCapability payee_check = 22;
    PolicyCapability policy = 23;
    TransactionCapability transaction = 24;
    WebhookEndpointCapability webhook_endpoint = 25;
  }
}
