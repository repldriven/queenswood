# Stable template-id -- seeded on every bootstrap; a fixed id keeps the
# seed idempotent (re-seeding preserves the original created-at rather
# than piling up rows). Format conforms to the TemplateId regex
# (`tpl\.[0-9a-hjkmnp-tv-z]{26}`).
template-id: tpl.00000000000000000000000001
name: Current account
product-type: !keyword account-product-type-sub-ledger-current
balance-sheet-side: !keyword balance-sheet-side-liability
iso-cash-account-type: !keyword iso-cash-account-type-cacc
allowed-currencies: [GBP]
allowed-payment-address-schemes:
  - !keyword payment-address-scheme-scan
balance-products: !keywords
  - balance-type: balance-type-default
    balance-status: balance-status-posted
  - balance-type: balance-type-default
    balance-status: balance-status-pending-incoming
  - balance-type: balance-type-default
    balance-status: balance-status-pending-outgoing
  - balance-type: balance-type-interest-accrued
    balance-status: balance-status-posted
