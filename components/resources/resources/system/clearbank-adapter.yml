readiness: !system/component
  system/component-kind: clearbank-adapter/readiness


registrar: !system/component
  system/component-kind: clearbank-adapter/registrar
  simulator-url: !profile
    dev: !system/ref clearbank-simulator-server.http-url
    test: !system/ref clearbank-simulator-server.http-url
    default: !env CLEARBANK_SIMULATOR_URL
  webhook-url: !profile
    dev: !system/ref clearbank-adapter-server.http-url
    test: !system/ref clearbank-adapter-server.http-url
    default: !env CLEARBANK_ADAPTER_PUBLIC_URL
  readiness: !system/ref clearbank-adapter.readiness
  webhooks:
    - type: TransactionSettled
      path: /webhooks/transaction-settled
    - type: TransactionRejected
      path: /webhooks/transaction-rejected
    - type: PaymentMessageAssessmentFailed
      path: /webhooks/payment-message-assessment-failed
    - type: InboundHeldTransaction
      path: /webhooks/inbound-held-transaction
    - type: OutboundHeldTransaction
      path: /webhooks/outbound-held-transaction
    - type: InboundCopRequestReceived
      path: /webhooks/inbound-cop-request-received


command-processor-impl: !system/component
  system/component-kind: clearbank-adapter/command-processor
  schemas: !system/ref avro.serde
  record-db: !system/ref fdb.record-db
  record-store: !system/ref fdb.meta-store


command-processor: !system/component
  system/component-kind: command-processor/command-processor
  bus: !system/ref message-bus.bus
  processor: !system/local-ref command-processor-impl
  command-channel: !keyword schemes-payment-command
  command-response-channel: !keyword schemes-payment-command-response


outbound-runner: !system/component
  system/component-kind: clearbank-relay/outbound-runner
  record-db: !system/ref fdb.record-db
  record-store: !system/ref fdb.meta-store
  clearbank-url: !profile
    dev: !system/ref clearbank-simulator-server.http-url
    test: !system/ref clearbank-simulator-server.http-url
    default: !env CLEARBANK_SIMULATOR_URL
  schemas: !system/ref avro.serde
  max-attempts: 20
  initial-backoff-ms: 1000
  max-backoff-ms: 60000
