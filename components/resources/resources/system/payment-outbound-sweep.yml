runner: !system/component
  system/component-kind: payment/outbound-sweep
  record-db: !system/ref fdb.record-db
  record-store: !system/ref fdb.meta-store
  schemas: !system/ref avro.serde
  bus: !system/ref message-bus.bus
  payment-providers: !system/ref payment-provider.providers

# Sends again a provider transfer still pending, as one waiting for a
# provider account the provider has since opened.
transfer-runner: !system/component
  system/component-kind: payment/transfer-sweep
  record-db: !system/ref fdb.record-db
  record-store: !system/ref fdb.meta-store
  schemas: !system/ref avro.serde
  bus: !system/ref message-bus.bus
  payment-providers: !system/ref payment-provider.providers
  interval-ms: !profile
    test: 1000
    default: 30000
  resend-after-ms: !profile
    test: 2000
    default: 30000
