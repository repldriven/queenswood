cluster-file-path: !system/component
  system/component-kind: fdb/cluster-file-path
  path: !env FDB_CLUSTER_FILE

db: !system/component
  system/component-kind: fdb/db
  cluster-file-path: !system/local-ref cluster-file-path
  record-db: !system/local-ref record-db

record-db: !system/component
  system/component-kind: fdb/record-db
  cluster-file-path: !system/local-ref cluster-file-path
  # Override Record Layer's 5s `getWithDeadline` default: a single-
  # process dev FDB serialises the directory-layer resolution that
  # `FDBMetaDataStore.<init>` performs, and 12+ services hitting it
  # concurrently at boot routinely tipped past 5s and crashed pods.
  # 30s leaves headroom without masking a genuinely sick cluster.
  async-to-sync-timeout-ms: 30000

# Qualifies every FDB key this deployment writes. Unset is the norm
# and leaves keys byte-identical to a deployment that never had one —
# setting it on a cluster with data strands the existing records,
# changelog and cursors.
keyspace-prefix: !system/component
  system/component-kind: fdb/keyspace-prefix
  value: !env FDB_KEYSPACE_PREFIX

store: !system/component
  system/component-kind: fdb/store
  descriptor: com.repldriven.queenswood.schemas.schemas.SchemaProto
  metadata: !include system/fdb-record-types.yml
  keyspace-prefix: !system/local-ref keyspace-prefix

# Single component-kind for both modes. `migrate: true` (set by
# the bank-migrator-service Job's deployment via FDB_MIGRATE) saves
# the record meta-data into FDB once at start; the default (env
# unset → nil → falsy) is a lazy read-only open-fn — no schema
# write, no directory-cache warm — used by every other service.
meta-store: !system/component
  system/component-kind: fdb/meta-store
  record-db: !system/local-ref record-db
  path: meta
  descriptor: com.repldriven.queenswood.schemas.schemas.SchemaProto
  metadata: !include system/fdb-record-types.yml
  keyspace-prefix: !system/local-ref keyspace-prefix
  migrate: !env FDB_MIGRATE
