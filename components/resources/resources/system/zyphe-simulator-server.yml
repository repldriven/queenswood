handler: !system/required-component

state: !system/component
  system/component-kind: zyphe-simulator/state

# A run settles only when the person submits the hosted page, or a test
# posts the same body to /simulator/verification-requests/{id}/decision.
interceptors: !system/component
  system/component-kind: server/interceptors
  state: !system/local-ref state
  organization-id: 6b0f6a2e-1f5c-4a70-9d6b-2b1a0e4c9d33
  api-key: !profile
    dev: zyphe_sk_simulator
    test: zyphe_sk_simulator
    default: !env ZYPHE_API_KEY

jetty-adapter: !system/component
  system/component-kind: server/jetty-adapter
  handler: !system/ref zyphe-simulator-server.handler
  interceptors: !system/ref zyphe-simulator-server.interceptors
  options: !profile
    dev:
      port: 8086
    test:
      port: 0
    default:
      port: 8086

http-url: !system/component
  system/component-kind: server/http-url
  jetty-adapter: !system/local-ref jetty-adapter
