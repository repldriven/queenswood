# The IDV providers a system offers, each provider's declaration under
# its key, and the providers component naming the default and the
# channel that reaches each provider's adapter. A system includes it as
# its `idv-provider` group; an adapter refers to its own declaration,
# `idv-provider.<key>`, and every other component that reads one refers
# to `idv-provider.providers`. See docs/tdd/bank-providers.md.
zyphe: !include system/idv-providers/zyphe.yml

providers: !system/component
  system/component-kind: idv-provider/providers
  default: zyphe
  providers:
    zyphe:
      declaration: !system/local-ref zyphe
      command-channel: !keyword zyphe-idv-command
