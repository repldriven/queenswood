readiness: !system/component
  system/component-kind: modulr-adapter/readiness


# The API key and secret the adapter signs each call to Modulr with.
# Generated at start where none is given, as the simulator verifies with
# this same component.
credentials: !system/component
  system/component-kind: modulr-webhook/credentials
  key-id: !profile
    dev: null
    test: null
    default: !env MODULR_API_KEY
  secret: !profile
    dev: null
    test: null
    default: !env MODULR_API_SECRET


# The secret the adapter sets on each notification subscription, which
# Modulr signs every delivery with.
webhook-credentials: !system/component
  system/component-kind: modulr-webhook/credentials


registrar: !system/component
  system/component-kind: modulr-adapter/registrar
  modulr-url: !profile
    dev: !system/ref modulr-simulator-server.http-url
    test: !system/ref modulr-simulator-server.http-url
    default: !env MODULR_URL
  credentials: !system/local-ref credentials
  customer-id: !or [!env MODULR_CUSTOMER_ID, C0000001]
  webhook-url: !profile
    dev: !system/ref modulr-adapter-server.http-url
    test: !system/ref modulr-adapter-server.http-url
    default: !env MODULR_ADAPTER_PUBLIC_URL
  webhook-credentials: !system/local-ref webhook-credentials
  readiness: !system/local-ref readiness


command-processor-impl: !system/component
  system/component-kind: modulr-adapter/command-processor
  schemas: !system/ref avro.serde
  record-db: !system/ref fdb.record-db
  record-store: !system/ref fdb.meta-store
  payment-provider: !system/ref payment-provider.declaration


command-processor: !system/component
  system/component-kind: command-processor/command-processor
  bus: !system/ref message-bus.bus
  processor: !system/local-ref command-processor-impl
  command-channel: !keyword schemes-payment-command
  command-response-channel: !keyword schemes-payment-command-response


account-command-processor: !system/component
  system/component-kind: command-processor/command-processor
  bus: !system/ref message-bus.bus
  processor: !system/local-ref command-processor-impl
  command-channel: !keyword schemes-account-command
  command-response-channel: !keyword schemes-account-command-response


outbound-runner: !system/component
  system/component-kind: modulr-relay/outbound-runner
  record-db: !system/ref fdb.record-db
  record-store: !system/ref fdb.meta-store
  modulr-url: !profile
    dev: !system/ref modulr-simulator-server.http-url
    test: !system/ref modulr-simulator-server.http-url
    default: !env MODULR_URL
  credentials: !system/local-ref credentials
  customer-id: !or [!env MODULR_CUSTOMER_ID, C0000001]
  schemas: !system/ref avro.serde
  max-attempts: 20
  initial-backoff-ms: 1000
  max-backoff-ms: 60000
  reconcile-after-ms: !profile
    test: 5000
    default: 300000
