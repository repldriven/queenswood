!strs
# The meta-data version, bumped on every change below. Each index
# carries the version it was added at and the version its key last
# changed at, a store added after the first version carries the version
# its record type arrived on as since, and a store lists the indexes
# removed from it under former-indexes with the versions they were added
# and removed at. See docs/recipes/code/schema-evolution.md.
version: 1
stores:
  account-balances:
    record-type: AccountBalance
    primary-key: [bank_id, account_id, balance_type, balance_status]
    indexes: []
  cash-account-products:
    record-type: CashAccountProduct
    primary-key: [bank_id, product_id, version_id]
    indexes:
      - name: CashAccountProduct_count_by_bank
        added: 1
        modified: 1
        fields: [bank_id, product_id]
        type: count
      - name: CashAccountProduct_count_by_bank_product_type
        added: 1
        modified: 1
        fields: [bank_id, product_type, product_id]
        type: count
      - name: CashAccountProduct_by_bank_product_type
        added: 1
        modified: 1
        fields: [bank_id, product_type]
      - name: CashAccountProduct_by_idempotency_key
        added: 1
        modified: 1
        fields: [bank_id, idempotency_key]
        unique: true
  cash-account-product-templates:
    record-type: CashAccountProductTemplate
    indexes: []
  cash-account-migrations:
    record-type: CashAccountMigration
    primary-key: [bank_id, migration_id]
    indexes:
      # The scheduler's work list: migrations a bank has approved, read by
      # status rather than scanned and filtered.
      - name: CashAccountMigration_by_bank_status
        added: 1
        modified: 1
        fields: [bank_id, status]
      # What a product version answers when asked which migrations point
      # at it, without owning any of them.
      - name: CashAccountMigration_by_target_version
        added: 1
        modified: 1
        fields: [bank_id, target_product_id, target_version_id]
      - name: CashAccountMigration_by_idempotency_key
        added: 1
        modified: 1
        fields: [bank_id, idempotency_key]
        unique: true
  cash-account-migration-runs:
    record-type: CashAccountMigrationRun
    primary-key: [bank_id, run_id]
    indexes:
      # Runs of one migration, newest first.
      - name: CashAccountMigrationRun_by_migration
        added: 1
        modified: 1
        fields: [bank_id, migration_id]
      # How many previews a bank has done today, for the daily limit — a
      # count rather than a scan, so enforcing the cap costs one read.
      - name: CashAccountMigrationRun_count_by_bank_day_dry_run
        added: 1
        modified: 1
        fields: [bank_id, business_day, dry_run]
        type: count
  cash-account-migration-account-runs:
    record-type: CashAccountMigrationAccountRun
    primary-key: [bank_id, run_id, account_id]
    indexes:
      # A run's verdicts grouped by outcome — what a preview is read for
      # is the totals per outcome, not the rows.
      - name: CashAccountMigrationAccountRun_count_by_run_outcome
        added: 1
        modified: 1
        fields: [bank_id, run_id, outcome]
        type: count
  cash-accounts:
    record-type: CashAccount
    primary-key: [bank_id, account_id]
    indexes:
      - name: CashAccount_count_by_bank
        added: 1
        modified: 1
        field: bank_id
        type: count
      - name: CashAccount_count_by_bank_product_type_account_type_currency
        added: 1
        modified: 1
        fields: [bank_id, product_type, account_type, currency]
        type: count
      # How many accounts sit on one product version. A migration's
      # cohort is measured against this before it runs, so a limit on
      # how many accounts one may move refuses before anything moves.
      - name: CashAccount_count_by_bank_version
        added: 1
        modified: 1
        fields: [bank_id, version_id]
        type: count
      - name: CashAccount_by_bban
        added: 1
        modified: 1
        field: bban
        unique: true
      - name: CashAccount_by_bank_product
        added: 1
        modified: 1
        fields: [bank_id, product_id]
      - name: CashAccount_by_idempotency_key
        added: 1
        modified: 1
        fields: [bank_id, idempotency_key]
        unique: true
      - name: CashAccount_by_party
        added: 1
        modified: 1
        fields: [bank_id, party_id]
  ledger-accounts:
    record-type: LedgerAccount
    primary-key: [bank_id, ledger_account_id]
    indexes:
      - name: LedgerAccount_by_bank_gl_account_code
        added: 1
        modified: 1
        fields: [bank_id, gl_account_code, currency]
  companies:
    record-type: Company
    primary-key: [registry, company_number]
    indexes: []
  idempotency:
    record-type: Idempotency
    primary-key: [principal_id, operation, idempotency_key]
    indexes: []
  idvs:
    record-type: Idv
    primary-key: [bank_id, verification_id]
    indexes:
      - name: Idv_by_party
        added: 1
        modified: 1
        field: party_id
        unique: true
  idv-sessions:
    record-type: IdvSession
    primary-key: [bank_id, session_id]
    indexes:
      # The sessions of one IDV, completed together when it decides.
      - name: IdvSession_by_verification
        added: 1
        modified: 1
        fields: [bank_id, verification_id]
      # How many sessions a bank opened on a day, for the daily limit.
      - name: IdvSession_count_by_bank_day
        added: 1
        modified: 1
        fields: [bank_id, opened_day]
        type: count
  interest-runs:
    record-type: InterestRun
    primary-key: [bank_id, business_day, kind]
    indexes:
      - name: InterestRun_count_by_bank_kind_business_day
        added: 1
        modified: 1
        fields: [bank_id, kind, business_day]
        type: count
  interest-account-runs:
    record-type: InterestAccountRun
    primary-key: [bank_id, business_day, kind, account_id]
    indexes:
      # Scope size for a run.
      - name: InterestAccountRun_count_by_bank_day_kind
        added: 1
        modified: 1
        fields: [bank_id, business_day, kind]
        type: count
      # Progress and residue: count pending/done/failed within a run.
      - name: InterestAccountRun_count_by_bank_day_kind_state
        added: 1
        modified: 1
        fields: [bank_id, business_day, kind, state]
        type: count
      # The sub-unit carry an account's next accrual opens with: the sum
      # of every accrual's change to it. ADR-0042.
      - name: InterestAccountRun_sum_carry_change_by_bank_kind_account
        added: 1
        modified: 1
        fields: [bank_id, kind, account_id, carry_change]
        type: sum
  memberships:
    record-type: Membership
    indexes:
      - name: Membership_by_user
        added: 1
        modified: 1
        field: user_id
      - name: Membership_by_bank
        added: 1
        modified: 1
        field: bank_id
  banks:
    record-type: Bank
    indexes:
      # A create sent again under its Idempotency-Key is answered with
      # the bank it made, found by who created it and the key.
      - name: Bank_by_creator_idempotency_key
        added: 1
        modified: 1
        fields:
          - field: created_by
            nest:
              field: principal_id
          - idempotency_key
        unique: true
  payee-checks:
    record-type: PayeeCheck
    primary-key: [bank_id, check_id]
    indexes: []
  parties:
    record-type: Party
    primary-key: [bank_id, party_id]
    indexes:
      - name: Party_by_idempotency_key
        added: 1
        modified: 1
        fields: [bank_id, idempotency_key]
        unique: true
      - name: Party_by_external_reference
        added: 1
        modified: 1
        fields: [bank_id, external_reference]
        unique: true
  party-national-identifiers:
    record-type: PartyNationalIdentifier
    primary-key: [party_id, type]
    indexes:
      - name: bank_type_value_unique_idx
        added: 1
        modified: 1
        fields: [bank_id, type, value]
        unique: true
  person-identifications:
    record-type: PersonIdentification
    indexes: []
  person-names:
    record-type: PersonName
    indexes: []
  inbound-payments:
    record-type: InboundPayment
    indexes:
      - name: InboundPayment_by_scheme_transaction_id
        added: 1
        modified: 1
        field: scheme_transaction_id
        unique: true
      - name: InboundPayment_by_end_to_end_id
        added: 1
        modified: 1
        field: end_to_end_id
      - name: InboundPayment_count_by_bank_business_day
        added: 1
        modified: 1
        fields: [bank_id, business_day]
        type: count
      - name: InboundPayment_by_bank_status_created_at
        added: 1
        modified: 1
        fields: [bank_id, payment_status, created_at]
  outbound-payments:
    record-type: OutboundPayment
    indexes:
      - name: OutboundPayment_by_idempotency_key
        added: 1
        modified: 1
        fields: [bank_id, idempotency_key]
        unique: true
      - name: OutboundPayment_count_by_bank_business_day
        added: 1
        modified: 1
        fields: [bank_id, business_day]
        type: count
      - name: OutboundPayment_sum_amount_by_bank_business_day
        added: 1
        modified: 1
        fields: [bank_id, business_day, amount]
        type: sum
      - name: OutboundPayment_by_status_created_at
        added: 1
        modified: 1
        fields: [payment_status, created_at]
  internal-payments:
    record-type: InternalPayment
    indexes:
      - name: InternalPayment_by_idempotency_key
        added: 1
        modified: 1
        fields: [bank_id, idempotency_key]
        unique: true
      - name: InternalPayment_count_by_bank_business_day
        added: 1
        modified: 1
        fields: [bank_id, business_day]
        type: count
  policies:
    record-type: Policy
    indexes:
      - name: Policy_by_label
        added: 1
        modified: 1
        field: labels
        fan-out: true
        nest:
          fields: [key, value]
  policy-bindings:
    record-type: PolicyBinding
    indexes:
      - name: PolicyBinding_by_bank
        added: 1
        modified: 1
        field: target
        nest:
          field: bank
          nest:
            field: bank_id
      - name: PolicyBinding_by_policy
        added: 1
        modified: 1
        field: policy_id
  transaction-legs:
    record-type: TransactionLeg
    primary-key: [account_id, transaction_id, leg_id]
    # A ledger account with no balance row of its own, as 1100 is, sums
    # its legs from this rather than having every posting rewrite one
    # row. ADR-0039.
    indexes:
      - name: TransactionLeg_sum_amount_by_account_bucket_side
        added: 1
        modified: 1
        fields: [account_id, balance_type, balance_status, side, amount]
        type: sum
      # A deposit or own-funds control, and 1200, sum the legs of every
      # cash account of a product type in the bank. ADR-0042.
      - name: TransactionLeg_sum_amount_by_bank_product_currency_bucket_side
        added: 1
        modified: 1
        fields: [bank_id, product_type, currency, balance_type, balance_status, side, amount]
        type: sum
  transactions:
    record-type: Transaction
    indexes:
      - name: Transaction_by_idempotency_key
        added: 1
        modified: 1
        fields: [bank_id, transaction_type, idempotency_key]
        unique: true
  users:
    record-type: User
    indexes:
      - name: User_by_issuer_and_sub
        added: 1
        modified: 1
        fields: [issuer, sub]
        unique: true
      - name: User_by_email
        added: 1
        modified: 1
        field: email
  scheduler-jobs:
    record-type: SchedulerJob
    primary-key: [bank_id, job_id]
    indexes: []
  scheduler-runs:
    record-type: SchedulerRun
    primary-key: [bank_id, run_id]
    indexes:
      - name: SchedulerRun_by_bank_job
        added: 1
        modified: 1
        fields: [bank_id, job_id]
  circuit-breakers:
    record-type: CircuitBreaker
    primary-key: [destination]
    indexes: []
  clearbank-outbox:
    record-type: ClearbankOutboxEvent
    primary-key: [outbox_id]
    indexes:
      - name: ClearbankOutboxEvent_by_dedup_key
        added: 1
        modified: 1
        field: dedup_key
        unique: true
  clearbank-outbound-intents:
    record-type: ClearbankOutboundIntent
    primary-key: [intent_id]
    indexes:
      - name: ClearbankOutboundIntent_by_dedup_key
        added: 1
        modified: 1
        field: dedup_key
        unique: true
      - name: ClearbankOutboundIntent_by_status
        added: 1
        modified: 1
        field: status
  onfido-outbox:
    record-type: OnfidoOutboxEvent
    primary-key: [outbox_id]
    indexes:
      - name: OnfidoOutboxEvent_by_dedup_key
        added: 1
        modified: 1
        field: dedup_key
        unique: true
  onfido-outbound-intents:
    record-type: OnfidoOutboundIntent
    primary-key: [intent_id]
    indexes:
      - name: OnfidoOutboundIntent_by_dedup_key
        added: 1
        modified: 1
        field: dedup_key
        unique: true
      - name: OnfidoOutboundIntent_by_status
        added: 1
        modified: 1
        field: status
  webhook-endpoints:
    record-type: WebhookEndpoint
    primary-key: [bank_id, endpoint_id]
    indexes:
      - name: WebhookEndpoint_count_by_bank
        added: 1
        modified: 1
        fields: [bank_id, endpoint_id]
        type: count
      - name: WebhookEndpoint_by_idempotency_key
        added: 1
        modified: 1
        fields: [bank_id, idempotency_key]
        unique: true
  webhook-notifications:
    record-type: WebhookNotification
    primary-key: [bank_id, notification_id]
    indexes:
      - name: WebhookNotification_by_changelog_event_id
        added: 1
        modified: 1
        field: changelog_event_id
        unique: true
      - name: WebhookNotification_by_bank_created
        added: 1
        modified: 1
        fields: [bank_id, created_at]
  webhook-deliveries:
    record-type: WebhookDelivery
    primary-key: [bank_id, delivery_id]
    indexes:
      - name: WebhookDelivery_by_status_due
        added: 1
        modified: 1
        fields: [status, next_attempt_at]
      - name: WebhookDelivery_by_endpoint_created
        added: 1
        modified: 1
        fields: [endpoint_id, created_at]
  webhook-delivery-attempts:
    record-type: WebhookDeliveryAttempt
    primary-key: [bank_id, attempt_id]
    indexes:
      - name: WebhookDeliveryAttempt_by_delivery
        added: 1
        modified: 1
        fields: [delivery_id, attempted_at]
  invitations:
    record-type: Invitation
    primary-key: [bank_id, invitation_id]
    indexes:
      - name: Invitation_by_bank
        added: 1
        modified: 1
        field: bank_id
      - name: Invitation_by_email
        added: 1
        modified: 1
        field: email_lower
      - name: Invitation_by_token_hash
        added: 1
        modified: 1
        field: token_hash
        unique: true
  access-events:
    record-type: AccessEvent
    primary-key: [bank_id, access_event_id]
    indexes: []
  email-deliveries:
    record-type: EmailDelivery
    primary-key: [bank_id, delivery_id]
    indexes:
      - name: EmailDelivery_by_idempotency_key
        added: 1
        modified: 1
        field: idempotency_key
        unique: true
      - name: EmailDelivery_by_status_due
        added: 1
        modified: 1
        fields: [status, next_attempt_at]
      - name: EmailDelivery_by_kind
        added: 1
        modified: 1
        fields: [bank_id, kind, kind_id]
  rewards:
    record-type: Reward
    primary-key: [bank_id, reward_id]
    indexes:
      - name: Reward_by_bank_account
        added: 1
        modified: 1
        fields: [bank_id, account_id, kind]
        unique: true
  zyphe-outbox:
    record-type: ZypheOutboxEvent
    primary-key: [outbox_id]
    indexes:
      - name: ZypheOutboxEvent_by_dedup_key
        added: 1
        modified: 1
        field: dedup_key
        unique: true
  zyphe-outbound-intents:
    record-type: ZypheOutboundIntent
    primary-key: [intent_id]
    indexes:
      - name: ZypheOutboundIntent_by_dedup_key
        added: 1
        modified: 1
        field: dedup_key
        unique: true
      - name: ZypheOutboundIntent_by_status
        added: 1
        modified: 1
        field: status
  modulr-outbox:
    record-type: ModulrOutboxEvent
    primary-key: [outbox_id]
    indexes:
      - name: ModulrOutboxEvent_by_dedup_key
        added: 1
        modified: 1
        field: dedup_key
        unique: true
  modulr-outbound-intents:
    record-type: ModulrOutboundIntent
    primary-key: [intent_id]
    indexes:
      - name: ModulrOutboundIntent_by_dedup_key
        added: 1
        modified: 1
        field: dedup_key
        unique: true
      - name: ModulrOutboundIntent_by_status
        added: 1
        modified: 1
        field: status
  form3-outbox:
    record-type: Form3OutboxEvent
    primary-key: [outbox_id]
    indexes:
      - name: Form3OutboxEvent_by_dedup_key
        added: 1
        modified: 1
        field: dedup_key
        unique: true
  form3-outbound-intents:
    record-type: Form3OutboundIntent
    primary-key: [intent_id]
    indexes:
      - name: Form3OutboundIntent_by_dedup_key
        added: 1
        modified: 1
        field: dedup_key
        unique: true
      - name: Form3OutboundIntent_by_status
        added: 1
        modified: 1
        field: status
  provider-transfers:
    record-type: ProviderTransfer
    primary-key: [bank_id, transfer_id]
    indexes:
      - name: ProviderTransfer_by_transaction_pair
        added: 1
        modified: 1
        fields: [transaction_id, debtor_account_id, creditor_account_id]
        unique: true
      - name: ProviderTransfer_by_status
        added: 1
        modified: 1
        fields: [status, created_at]
