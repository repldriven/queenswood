!strs
assertions:
  record-type: Assertion
  primary-key: [bank_id, party_id, assertion_id]
  indexes:
    - name: Assertion_by_party_kind
      fields: [party_id, kind]
balances:
  record-type: Balance
  # bank_id heads the key so a bank's balances scan contiguously,
  # matching cash-accounts and letting the interest pass scan one bank
  # rather than every bank's rows.
  primary-key: [bank_id, account_id, balance_type, currency, balance_status]
  indexes: []
cash-account-products:
  record-type: CashAccountProduct
  primary-key: [bank_id, product_id, version_id]
  indexes:
    - name: CashAccountProduct_count_by_bank
      fields: [bank_id, product_id]
      type: count
    - name: CashAccountProduct_count_by_bank_product_type
      fields: [bank_id, product_type, product_id]
      type: count
    - name: CashAccountProduct_by_bank_product_type
      fields: [bank_id, product_type]
    - name: CashAccountProduct_by_idempotency_key
      fields: [bank_id, idempotency_key]
      unique: true
cash-account-product-templates:
  record-type: CashAccountProductTemplate
  indexes: []
cash-account-migrations:
  record-type: CashAccountMigration
  primary-key: [bank_id, migration_id]
  indexes:
    # The scheduler's work list: migrations a bank has approved, read by
    # status rather than scanned and filtered.
    - name: CashAccountMigration_by_bank_status
      fields: [bank_id, status]
    # What a product version answers when asked which migrations point
    # at it, without owning any of them.
    - name: CashAccountMigration_by_target_version
      fields: [bank_id, target_product_id, target_version_id]
    - name: CashAccountMigration_by_idempotency_key
      fields: [bank_id, idempotency_key]
      unique: true
cash-account-migration-runs:
  record-type: CashAccountMigrationRun
  primary-key: [bank_id, run_id]
  indexes:
    # Runs of one migration, newest first.
    - name: CashAccountMigrationRun_by_migration
      fields: [bank_id, migration_id]
    # How many previews a bank has done today, for the daily limit — a
    # count rather than a scan, so enforcing the cap costs one read.
    - name: CashAccountMigrationRun_count_by_bank_day_dry_run
      fields: [bank_id, business_day, dry_run]
      type: count
cash-account-migration-account-runs:
  record-type: CashAccountMigrationAccountRun
  primary-key: [bank_id, run_id, account_id]
  indexes:
    # A run's verdicts grouped by outcome — what a preview is read for
    # is the totals per outcome, not the rows.
    - name: CashAccountMigrationAccountRun_count_by_run_outcome
      fields: [bank_id, run_id, outcome]
      type: count
cash-accounts:
  record-type: CashAccount
  primary-key: [bank_id, account_id]
  indexes:
    - name: CashAccount_count_by_bank
      field: bank_id
      type: count
    - name: CashAccount_count_by_bank_product_account_type_currency
      fields: [bank_id, product_type, account_type, currency]
      type: count
    # How many accounts sit on one product version. A migration's
    # cohort is measured against this before it runs, so a limit on
    # how many accounts one may move refuses before anything moves.
    - name: CashAccount_count_by_bank_version
      fields: [bank_id, version_id]
      type: count
    - name: CashAccount_by_bban
      field: bban
      unique: true
    - name: CashAccount_by_bank_product
      fields: [bank_id, product_id]
    - name: CashAccount_by_idempotency_key
      fields: [bank_id, idempotency_key]
      unique: true
    - name: CashAccount_by_party
      field: party_id
ledger-accounts:
  record-type: LedgerAccount
  primary-key: [bank_id, ledger_account_id]
  indexes:
    - name: LedgerAccount_by_bank_gl_account_code
      fields: [bank_id, gl_account_code]
companies:
  record-type: Company
  primary-key: [company_number]
  indexes: []
idempotency:
  record-type: Idempotency
  primary-key: [principal_id, operation, idempotency_key]
  indexes: []
idvs:
  record-type: Idv
  primary-key: [bank_id, verification_id]
  indexes:
    - name: Idv_by_party
      field: party_id
      unique: true
interest-runs:
  record-type: InterestRun
  primary-key: [bank_id, business_day, kind]
  indexes:
    - name: InterestRun_count_by_bank_kind_business_day
      fields: [bank_id, kind, business_day]
      type: count
interest-account-runs:
  record-type: InterestAccountRun
  primary-key: [bank_id, business_day, kind, account_id]
  indexes:
    # Scope size for a run.
    - name: InterestAccountRun_count_by_bank_day_kind
      fields: [bank_id, business_day, kind]
      type: count
    # Progress and residue: count pending/done/failed within a run.
    - name: InterestAccountRun_count_by_bank_day_kind_state
      fields: [bank_id, business_day, kind, state]
      type: count
    # The run's total per currency, for the ledger entries posted at
    # close. Grouped by currency because one entry per currency is the
    # only way the pair of legs can balance.
    - name: InterestAccountRun_sum_amount_by_bank_day_kind_currency
      fields: [bank_id, business_day, kind, currency, amount]
      type: sum
    # The same total split by product type, which capitalisation needs
    # and accrual does not. Accrual's aggregate legs are two fixed GL
    # accounts, so a currency total is enough. Capitalisation credits
    # whichever deposit control the product type maps to, so it posts
    # one entry per (currency, product type) and needs the total for
    # each.
    - name: InterestAccountRun_sum_amount_by_bank_day_kind_currency_product
      fields: [bank_id, business_day, kind, currency, product_type, amount]
      type: sum
memberships:
  record-type: Membership
  indexes:
    - name: Membership_by_user
      field: user_id
    - name: Membership_by_bank
      field: bank_id
    - name: Membership_by_user_and_bank
      fields: [user_id, bank_id]
      unique: true
banks:
  record-type: Bank
  indexes:
    - name: Bank_by_sort_code
      field: sort_code
      unique: true
payee-checks:
  record-type: PayeeCheck
  primary-key: [bank_id, check_id]
  indexes: []
parties:
  record-type: Party
  primary-key: [bank_id, party_id]
  indexes: []
party-national-identifiers:
  record-type: PartyNationalIdentifier
  primary-key: [party_id, type]
  indexes:
    - name: bank_type_value_unique_idx
      fields: [bank_id, type, value]
      unique: true
person-identifications:
  record-type: PersonIdentification
  indexes: []
inbound-payments:
  record-type: InboundPayment
  indexes:
    - name: InboundPayment_by_scheme_transaction_id
      field: scheme_transaction_id
      unique: true
    - name: InboundPayment_by_end_to_end_id
      field: end_to_end_id
    - name: InboundPayment_count_by_bank_business_day
      fields: [bank_id, business_day]
      type: count
outbound-payments:
  record-type: OutboundPayment
  indexes:
    - name: OutboundPayment_by_idempotency_key
      fields: [bank_id, idempotency_key]
      unique: true
    - name: OutboundPayment_count_by_bank_business_day
      fields: [bank_id, business_day]
      type: count
    - name: OutboundPayment_sum_amount_by_bank_business_day
      fields: [bank_id, business_day, amount]
      type: sum
internal-payments:
  record-type: InternalPayment
  indexes:
    - name: InternalPayment_by_idempotency_key
      fields: [bank_id, idempotency_key]
      unique: true
    - name: InternalPayment_count_by_bank_business_day
      fields: [bank_id, business_day]
      type: count
policies:
  record-type: Policy
  indexes:
    - name: Policy_by_label
      field: labels
      fan-out: true
      nest:
        fields: [key, value]
policy-bindings:
  record-type: PolicyBinding
  indexes: []
transaction-legs:
  record-type: TransactionLeg
  primary-key: [account_id, transaction_id, leg_id]
  indexes: []
transactions:
  record-type: Transaction
  indexes:
    - name: Transaction_by_idempotency_key
      fields: [bank_id, transaction_type, idempotency_key]
      unique: true
users:
  record-type: User
  indexes:
    - name: User_by_issuer_and_sub
      fields: [issuer, sub]
      unique: true
    - name: User_by_email
      field: email
scheduler-jobs:
  record-type: SchedulerJob
  primary-key: [bank_id, job_id]
  indexes: []
scheduler-runs:
  record-type: SchedulerRun
  primary-key: [bank_id, run_id]
  indexes:
    - name: SchedulerRun_by_bank_job
      fields: [bank_id, job_id]
clearbank-outbox:
  record-type: ClearbankOutboxEvent
  primary-key: [outbox_id]
  indexes:
    - name: ClearbankOutboxEvent_by_dedup_key
      field: dedup_key
      unique: true
clearbank-outbound-intents:
  record-type: ClearbankOutboundIntent
  primary-key: [intent_id]
  indexes:
    - name: ClearbankOutboundIntent_by_dedup_key
      field: dedup_key
      unique: true
    - name: ClearbankOutboundIntent_by_status
      field: status
onfido-outbox:
  record-type: OnfidoOutboxEvent
  primary-key: [outbox_id]
  indexes:
    - name: OnfidoOutboxEvent_by_dedup_key
      field: dedup_key
      unique: true
onfido-outbound-intents:
  record-type: OnfidoOutboundIntent
  primary-key: [intent_id]
  indexes:
    - name: OnfidoOutboundIntent_by_dedup_key
      field: dedup_key
      unique: true
    - name: OnfidoOutboundIntent_by_status
      field: status
