# What the Form3 adapter can carry: Faster Payments for a bank holding
# the money in its own settlement account, name checks made outbound and
# answered by Form3 from each registration's name, every inbound
# admitted by the platform before it settles, one it cannot apply sent
# back, and nothing screened by Form3. See docs/tdd/payments.md.
!system/component
system/component-kind: payment-provider/declaration
schemes: [fps]
addresses: [scan]
balances: pooled
payee-check: [outbound]
inbound: admitted
returns: [inbound]
screening: bank
