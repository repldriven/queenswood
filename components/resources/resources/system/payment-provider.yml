# What the deployment's payment adapter can carry: the schemes an
# outbound payment may go by, the address schemes it issues, whether the
# provider holds a balance per account or one pooled balance, the name
# checks it makes, whether it tells of an inbound once settled or asks
# for it to be admitted first, the payments the platform may return, and
# who screens payments. Checked when the adapter starts, when a product
# version is published and when an outbound payment is submitted. See
# docs/tdd/payments.md.
schemes: [fps]
addresses: [scan]
balances: per-account
payee-check: [outbound]
inbound: notified
returns: []
screening: provider
