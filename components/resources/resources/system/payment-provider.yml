# The payment providers a system offers, each provider's declaration
# under its key, and the providers component naming the default and the
# channels that reach each provider's adapter. A system includes it as
# its `payment-provider` group; an adapter refers to its own declaration,
# `payment-provider.<key>`, and every other component that reads one
# refers to `payment-provider.providers`. See docs/tdd/bank-providers.md.
modulr: !include system/payment-providers/modulr.yml

providers: !system/component
  system/component-kind: payment-provider/providers
  default: modulr
  providers:
    modulr:
      declaration: !system/local-ref modulr
      payment-command-channel: !keyword modulr-payment-command
      account-command-channel: !keyword modulr-account-command
