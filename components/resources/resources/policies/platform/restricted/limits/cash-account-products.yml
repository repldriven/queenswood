- kind:
    cash-account-product: {}
  bound:
    kind:
      max:
        aggregate:
          kind:
            count:
              value: 1000
              window: !keyword time-window-instant
  reason: "Platform-restricted - max 1,000 cash account products"
- kind:
    cash-account-product:
      filters:
        - product-type: !keyword account-product-type-sub-ledger-current
        - product-type: !keyword account-product-type-sub-ledger-savings
        - product-type: !keyword account-product-type-sub-ledger-term-deposit
  bound:
    kind:
      max:
        aggregate:
          kind:
            count:
              value: 100
              window: !keyword time-window-instant
  reason: "Platform-restricted - max 100 cash account products per product type"
- kind:
    cash-account-product:
      filters:
        - action: !keyword cash-account-product-action-publish
  bound:
    kind:
      max:
        aggregate:
          kind:
            count:
              value: 10
              window: !keyword time-window-monthly
  reason: "Platform-restricted - a product publishes at most 10 versions per calendar month"
