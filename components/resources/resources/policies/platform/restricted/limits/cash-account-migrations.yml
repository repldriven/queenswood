- kind:
    cash-account-migration:
      filters:
        - action: !keyword cash-account-migration-action-run
  bound:
    kind:
      max:
        aggregate:
          kind:
            count:
              value: 1000000
              window: !keyword time-window-instant
  reason: "Platform-restricted - a migration may move at most 1,000,000 accounts"
- kind:
    cash-account-migration:
      filters:
        - action: !keyword cash-account-migration-action-preview
  bound:
    kind:
      max:
        aggregate:
          kind:
            count:
              value: 1000
              window: !keyword time-window-daily
  reason: "Platform-restricted - at most 1,000 migration previews per day"
