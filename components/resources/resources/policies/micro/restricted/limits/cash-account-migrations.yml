# Tracks the tier's cash-account cap, so it cannot bind on micro — a
# ceiling for a tier where the two diverge, not a live constraint here.
- kind:
    cash-account-migration:
      filters:
        - action: !keyword cash-account-migration-action-run
  bound:
    kind:
      max:
        aggregate:
          kind:
            count:
              value: 50
              window: !keyword time-window-instant
  reason: "Micro tier - a migration may move at most 50 accounts"
- kind:
    cash-account-migration:
      filters:
        - action: !keyword cash-account-migration-action-preview
  bound:
    kind:
      max:
        aggregate:
          kind:
            count:
              value: 10
              window: !keyword time-window-daily
  reason: "Micro tier - at most 10 migration previews per day"
