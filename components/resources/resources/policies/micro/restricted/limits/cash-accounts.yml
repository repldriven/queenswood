- kind:
    cash-account: {}
  bound:
    kind:
      max:
        aggregate:
          kind:
            count:
              value: 50
              window: !keyword time-window-instant
  reason: "Micro tier - max 50 cash accounts"
- kind:
    cash-account:
      filters:
        - product-type: !keyword product-type-sub-ledger-term-deposit
