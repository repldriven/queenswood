_metadata: &metadata !strs
  version: 1
  stores:
    pets:
      record-type: Pet
      indexes:
        - name: species_idx
          added: 1
          modified: 1
          field: species
    # Keys sharing a leading element, for scan and merge coverage. One
    # owner per key, several toys, so a toys scan under a household has a
    # key tail longer than one element.
    owners:
      record-type: Owner
      primary-key: [household_id, owner_id]
      indexes: []
    toys:
      record-type: Toy
      primary-key: [household_id, owner_id, toy_id]
      indexes: []

container: !system/component
  system/component-kind: fdb/container

container-cluster-file-path: !system/component
  system/component-kind: fdb/container-cluster-file-path
  container: !system/local-ref container

cluster-file-path: !system/component
  system/component-kind: fdb/cluster-file-path
  path: !system/local-ref container-cluster-file-path

db: !system/component
  system/component-kind: fdb/db
  cluster-file-path: !system/local-ref cluster-file-path
  record-db: !system/local-ref record-db

record-db: !system/component
  system/component-kind: fdb/record-db
  cluster-file-path: !system/local-ref cluster-file-path

pet-store: !system/component
  system/component-kind: fdb/store
  descriptor: com.repldriven.queenswood.test_schemas.schemas.TestSchemaProto
  metadata: *metadata

pet-meta-store: !system/component
  system/component-kind: fdb/meta-store
  record-db: !system/local-ref record-db
  path: pet-meta
  descriptor: com.repldriven.queenswood.test_schemas.schemas.TestSchemaProto
  metadata: *metadata
  migrate: true
