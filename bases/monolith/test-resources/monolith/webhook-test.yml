# The webhook consumer and runner, hosted in the local monolith so a
# registered endpoint is delivered to. The consumer subscribes under a
# channel of its own: this monolith's bus is Kafka, where a channel is
# one consumer group member with one subscription, and the cash-account
# processor already holds `cash-accounts-event`.
# `webhook-cash-accounts-event` reads the same topic under its own
# consumer group, in kafka-all-test.yml.
event-processor-impl: !system/component
  system/component-kind: webhook/event-processor
  record-db: !system/ref fdb.record-db
  record-store: !system/ref fdb.meta-store
  schemas: !system/ref avro.serde

event-consumer: !system/component
  system/component-kind: event-processor/event-processor
  bus: !system/ref message-bus.bus
  processor: !system/local-ref event-processor-impl
  event-channel: !keyword webhook-cash-accounts-event

payments-event-consumer: !system/component
  system/component-kind: event-processor/event-processor
  bus: !system/ref message-bus.bus
  processor: !system/local-ref event-processor-impl
  event-channel: !keyword webhook-payments-event

rewards-event-consumer: !system/component
  system/component-kind: event-processor/event-processor
  bus: !system/ref message-bus.bus
  processor: !system/local-ref event-processor-impl
  event-channel: !keyword webhook-rewards-event

idvs-event-consumer: !system/component
  system/component-kind: event-processor/event-processor
  bus: !system/ref message-bus.bus
  processor: !system/local-ref event-processor-impl
  event-channel: !keyword webhook-idvs-event

parties-event-consumer: !system/component
  system/component-kind: event-processor/event-processor
  bus: !system/ref message-bus.bus
  processor: !system/local-ref event-processor-impl
  event-channel: !keyword webhook-parties-event

outbound-runner: !system/component
  system/component-kind: webhook/outbound-runner
  record-db: !system/ref fdb.record-db
  record-store: !system/ref fdb.meta-store
  # The same relaxation the server's interceptors carry, so what
  # registration admitted under dev is not refused at send time.
  address-rule: !profile
    dev:
      allowed-schemes: [http, https]
      blocked-ranges: []
    default: {}
  poll-ms: 200
  batch-size: 32
  claim-lease-ms: 60000
  request-timeout-ms: 10000
  max-in-flight-per-endpoint: 2
  delivery-policy: !include system/webhook-delivery-policy.yml
