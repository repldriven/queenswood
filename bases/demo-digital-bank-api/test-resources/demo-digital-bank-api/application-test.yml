# The bank's system for its tests and for the local loop. Under `test`
# the platform is the core brick's stand-in, served in the same process;
# under `dev` it is a local monolith, and the organisation's credential
# arrives in the environment from `pass` — `just demo-digital-bank-start`
# does both. Postgres is a container either way. The testcontainer groups
# are inlined rather than included: mono's shared test resources are not
# published.
system:
  postgres:
    container: !system/component
      system/component-kind: postgres/container
      exposed-port: 5432

    container-mapped-exposed-port: !system/component
      system/component-kind: postgres/container-mapped-exposed-port
      container: !system/local-ref container
      exposed-port: 5432

  jdbc:
    datasource: !system/component
      system/component-kind: jdbc/datasource
      dbtype: postgres
      host: localhost
      port: !system/ref postgres.container-mapped-exposed-port
      database: test
      user: test
      password: test

  migrator:
    migrations: !system/component
      system/component-kind: migrator/migrations
      datasource: !system/ref jdbc.datasource
      changelogs:
        - demo-digital-bank/changelog.sql

  platform-stub: !profile
    dev: {}
    default: !include demo-digital-bank/platform-stub-test.yml

  demo-digital-bank:
    store: !system/component
      system/component-kind: demo-digital-bank/store
      datasource: !system/ref migrator.migrations

    platform: !system/component
      system/component-kind: demo-digital-bank/platform
      url: !profile
        dev: !or [!env DEMO_API_URL, "http://localhost:8080"]
        default: !system/ref platform-stub.http-url
      client-id: !profile
        dev: !env DEMO_DIGITAL_BANK_CLIENT_ID
        default: bnk.00000000000000000000000001
      client-secret: !profile
        dev: !env DEMO_DIGITAL_BANK_CLIENT_SECRET
        default: stub-secret
      status: test

    bank: !system/component
      system/component-kind: demo-digital-bank/bank
      store: !system/local-ref store
      platform: !system/local-ref platform
      sign-up-code: "123456"
      # The secret the seed's registration returned, under which the
      # platform signs what it delivers.
      webhook-secret: !profile
        dev: !env DEMO_DIGITAL_BANK_WEBHOOK_SECRET
        default: whsec_ZGVtby1kaWdpdGFsLWJhbmstdGVzdC1zZWNyZXQtMzJi

  server: !include demo-digital-bank-api/server-test.yml

  telemetry: !include system/telemetry.yml
